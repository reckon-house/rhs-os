<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: "Avenir Next", "Helvetica Neue", Helvetica, sans-serif; background: #ffffff; color: #000000; -webkit-font-smoothing: antialiased; }
    a { color: #000000; } a:hover { color: #555555; }
    button { font-family: inherit; }

    /* The faux reel's photo beats, after SizzleReel's sz-* rules. */
    .rl { position: absolute; top: 0; left: 0; right: 0; bottom: 0; will-change: transform, opacity, clip-path; }
    .rl-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .b-shutter { animation: rlShutter 0.42s cubic-bezier(.7,0,.15,1) both; }
    @keyframes rlShutter { from { clip-path: inset(50% 0 50% 0); } to { clip-path: inset(0 0 0 0); } }
    .b-curtain { animation: rlCurtain 0.46s cubic-bezier(.7,0,.15,1) both; }
    @keyframes rlCurtain { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    .b-fade { animation: rlFade 0.36s ease both; }
    @keyframes rlFade { from { opacity: 0; } to { opacity: 1; } }
    .b-cut { animation: rlFade 0.16s steps(2) both; }
    .rl-strip { position: absolute; top: 0; height: 100%; overflow: hidden; clip-path: inset(0 0 100% 0); }
    .b-slat .rl-strip { animation: rlSlat 0.36s cubic-bezier(.6,0,.15,1) both; }
    @keyframes rlSlat { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
    .rl-strip img { position: absolute; top: 0; height: 100%; max-width: none; object-fit: cover; display: block; }
    .b-burn .rl-img { animation: rlBurnImg 1.1s cubic-bezier(.72,0,.18,1) both; }
    @keyframes rlBurnImg { 0% { opacity: 0; transform: scale(1.02); filter: brightness(1.5) saturate(2.6) contrast(1.5); } 22% { opacity: 1; transform: scale(1.015); filter: brightness(1.35) saturate(2.2) contrast(1.4); } 100% { opacity: 1; transform: scale(1); filter: none; } }
    .rl-pop { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; background: rgba(243,240,237,.35); opacity: 0; animation: rlBurnPop 1.1s cubic-bezier(.72,0,.18,1) both; }
    @keyframes rlBurnPop { 0% { opacity: 0; backdrop-filter: blur(0px) saturate(1) contrast(1); } 18% { opacity: 1; backdrop-filter: blur(4px) saturate(4.5) contrast(2.2); } 100% { opacity: 0; backdrop-filter: blur(0px) saturate(1) contrast(1); } }
    .rl-wash { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; background: #F3F0ED; opacity: 0; animation: rlBurnWash 1.1s cubic-bezier(.72,0,.18,1) both; }
    @keyframes rlBurnWash { 0% { opacity: 0; } 16% { opacity: .95; } 40% { opacity: .3; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .rl, .rl-strip, .rl-img, .rl-pop, .rl-wash { animation: none !important; }
      .rl-strip { clip-path: inset(0 0 0 0) !important; }
      .rl-pop, .rl-wash { opacity: 0 !important; }
    }
  </style>
</helmet>
<div style="position: relative; width: 640px; height: 900px; overflow: hidden; background: #ffffff;">
  <div style="position: absolute; left: 50px; top: 50px; font-size: 13px; font-weight: 500; letter-spacing: -0.01em;">Reckon*House</div>
  <div style="position: absolute; left: 330px; top: 76px; width: 1px; height: 712px; background: #ececec;"></div>
  <div style="position: absolute; left: 353px; top: 96px; width: 470px; font-size: 30px; line-height: 1.28; font-weight: 600; letter-spacing: -0.025em;">I’m Jeremy Prasatik. I make things across brand, product, and place. <span style="color: #a6a6a6;">Apps and ecommerce, campaigns and brand systems, photography and art direction, custom interiors, AI tools.</span> Or just ask me:</div>

  <nav aria-label="Index" style="position: absolute; left: 50px; top: 96px; width: 256px; display: flex; flex-direction: column;">
    <div style="display: flex; gap: 18px; font-size: 12px; font-weight: 500; padding-bottom: 30px;">
      <a href="#info" style="text-decoration: none;">/ Info</a>
      <a href="#connect" style="text-decoration: none;">/ Connect</a>
    </div>
    <div style="display: flex; flex-direction: column;">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <button type="button" onMouseEnter="{{r.pick}}" onFocus="{{r.pick}}" onClick="{{r.pick}}" style="display: flex; align-items: flex-start; gap: 4px; background: none; border: 0; padding: 0; margin: 0; color: {{r.color}}; font-size: 46px; font-weight: 700; letter-spacing: -0.045em; line-height: 1.02; text-align: left; cursor: pointer; transition: color 0.4s cubic-bezier(0.2,0.7,0.2,1);">
          <span>{{r.label}}</span>
          <span style="font-size: 12px; font-weight: 600; letter-spacing: 0; line-height: 1; padding-top: 7px; font-variant-numeric: tabular-nums;">{{r.n}}</span>
        </button>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; padding-top: 30px;">
      <div aria-label="{{cur.label}} reel" style="position: relative; width: 256px; height: 170px; overflow: hidden; border-radius: 16px; background: #0e0e0e;">
        <img class="rl-img" src="{{reel.prev}}" alt="">
        <sc-if value="{{reel.even}}" hint-placeholder-val="{{true}}">
          <div class="rl {{reel.cls}}">
            <sc-if value="{{reel.slat}}" hint-placeholder-val="{{false}}">
              <sc-for list="{{strips}}" as="s" hint-placeholder-count="5">
                <div class="rl-strip" style="left: {{s.left}}; width: {{s.w}}; animation-delay: {{s.delay}};"><img src="{{reel.cur}}" alt="" style="left: {{s.imgLeft}}; width: 256px;"></div>
              </sc-for>
            </sc-if>
            <sc-if value="{{reel.whole}}" hint-placeholder-val="{{true}}">
              <img class="rl-img" src="{{reel.cur}}" alt="">
            </sc-if>
            <sc-if value="{{reel.burn}}" hint-placeholder-val="{{false}}">
              <div class="rl-pop"></div>
              <div class="rl-wash"></div>
            </sc-if>
          </div>
        </sc-if>
        <sc-if value="{{reel.odd}}" hint-placeholder-val="{{false}}">
          <div class="rl {{reel.cls}}">
            <sc-if value="{{reel.slat}}" hint-placeholder-val="{{false}}">
              <sc-for list="{{strips}}" as="s" hint-placeholder-count="5">
                <div class="rl-strip" style="left: {{s.left}}; width: {{s.w}}; animation-delay: {{s.delay}};"><img src="{{reel.cur}}" alt="" style="left: {{s.imgLeft}}; width: 256px;"></div>
              </sc-for>
            </sc-if>
            <sc-if value="{{reel.whole}}" hint-placeholder-val="{{true}}">
              <img class="rl-img" src="{{reel.cur}}" alt="">
            </sc-if>
            <sc-if value="{{reel.burn}}" hint-placeholder-val="{{false}}">
              <div class="rl-pop"></div>
              <div class="rl-wash"></div>
            </sc-if>
          </div>
        </sc-if>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 16px;">
        <div style="font-size: 12px; line-height: 1.45; max-width: 26ch;"><span style="font-weight: 600;">{{cur.label}}.</span> <span style="color: #8a8a8a;">{{cur.note}}</span></div>
        <a href="#open" style="font-size: 12px; font-weight: 500; white-space: nowrap; text-decoration: underline; text-underline-offset: 3px;">Open</a>
      </div>
    </div>
  </nav>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":640,"height":900},"rest":{"editor":"color","default":"#d4d4d4","options":["#d4d4d4","#a6a6a6","#e9e6e1"]},"hold":{"editor":"range","default":950,"min":500,"max":2500,"step":100,"unit":"ms"}}'>
const REEL = {
  digital: ['/_blob/6fe2334acf03dc08a8bcce5de988a7f4', '/_blob/2ea98b89536d7a68185d4575622c78ac', '/_blob/5592086e441cc42479905ba8bf592614', '/_blob/435c78eda72b4c15d930b8dc6a113950'],
  apps: ['/_blob/e52f669a23d75292a4da44a68d0bf144', '/_blob/14419a4681bddd4358ea500ac237844e', '/_blob/ad3edf1a1163cbf41abd61d95be23ea9', '/_blob/a41c8fddb68b202d167ba303f06fdd87'],
  campaigns: ['/_blob/6ce7ff2448f9a78531e42e277bfdef1e', '/_blob/918e91284198fef728b65d513cf91b42', '/_blob/52b016d195f7b6b37a8051efc59575c2', '/_blob/32b79ef9b56f364f42bf55ee4edb4e59'],
  branding: ['/_blob/cb80c158ece5bae5b91e8902ba85de75', '/_blob/35752953d45db1c25a68798d251368c5', '/_blob/9e18932eb9fc458bfa77ea5e2c259cfa', '/_blob/64024d55ee3ab9d745523305b0145a5e'],
  interiors: ['/_blob/46881a2b07ef516a68f4eba3c4c61e53', '/_blob/f2e6ce1679fc44536d76e0ea4b402813', '/_blob/6a8bc5b995cde2aa4350051fabd75dc8', '/_blob/237ecf41e4d4710e7d3aa0399f1ab01d'],
  staples: ['/_blob/9fab580e7ac79f7d37a8f87825360413', '/_blob/0cc3d3421a8980fcf19ee31412b4712a', '/_blob/929ed86bd962628ab44794c2fa1ca725', '/_blob/af352d0abddef9f6dd8664b9a5d66f2f']
};
const ROWS = [
  { k: 'digital', label: 'Digital', n: 10, note: 'Sites, stores and platforms, designed and shipped.' },
  { k: 'apps', label: 'Apps', n: 4, note: 'Native tools and AI products, built end to end.' },
  { k: 'campaigns', label: 'Campaigns', n: 6, note: 'Creative direction and execution for international brands.' },
  { k: 'branding', label: 'Branding', n: 5, note: 'Marks, type and patterns, on packaging, print and apparel.' },
  { k: 'interiors', label: 'Interiors', n: 8, note: 'Rooms designed like products, down to the hardware.' },
  { k: 'staples', label: 'Staples', n: 104, note: 'Pictures and lines saved from other people’s work.' }
];
/* the in-category cuts rotate through these; a category swap always burns */
const BEATS = ['shutter', 'slat', 'curtain', 'cut', 'fade'];
const STRIPS = [0, 1, 2, 3, 4].map((i) => ({
  left: (i * 51.2) + 'px', w: '52px', imgLeft: (-i * 51.2) + 'px', delay: (i * 40) + 'ms'
}));
const START = 4;
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    const first = REEL[ROWS[START].k];
    this.state = { a: START, f: 0, t: 0, beat: 'fade', prev: first[first.length - 1] };
  }
  componentDidMount() { this.arm(); }
  componentWillUnmount() { clearTimeout(this.timer); }
  hold() { return this.props.hold ?? 950; }
  arm() {
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.advance(), this.hold());
  }
  advance() {
    const s = this.state;
    const list = REEL[ROWS[s.a].k];
    this.setState({
      prev: list[s.f],
      f: (s.f + 1) % list.length,
      t: s.t + 1,
      beat: BEATS[(s.t + 1) % BEATS.length]
    });
    this.arm();
  }
  pick(i) {
    const s = this.state;
    if (i === s.a) return;
    const shown = REEL[ROWS[s.a].k][s.f];
    this.setState({ a: i, f: 0, t: s.t + 1, beat: 'burn', prev: shown });
    this.arm();
  }
  renderVals() {
    const s = this.state;
    const rest = this.props.rest ?? '#d4d4d4';
    const rows = ROWS.map((r, i) => ({ ...r,
      color: i === s.a ? '#000000' : rest,
      pick: () => this.pick(i) }));
    const list = REEL[ROWS[s.a].k];
    const beat = s.beat;
    return {
      rows,
      cur: rows[s.a],
      strips: STRIPS,
      reel: {
        cur: list[s.f],
        prev: s.prev,
        even: s.t % 2 === 0,
        odd: s.t % 2 === 1,
        cls: 'b-' + beat,
        slat: beat === 'slat',
        whole: beat !== 'slat',
        burn: beat === 'burn'
      }
    };
  }
}
</script>
