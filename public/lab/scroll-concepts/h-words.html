<!-- ── CONCEPT H: THE WORDS (25 Sept 2026) ─────────────────────────────
     His ask, with eight frames drawn in Figma: "what if there's even more
     of a combo and we work in a big font at the bottom but look at a
     serif (this is ogg). the big scrolls over, intro text scrolls down
     and in then the big images scroll from the bottom up in place until
     that section of images is done then the next big text header comes
     in and that sections image scroll up. maybe we mix some of the other
     elements we've looked at too ... how do we push it?!"

     His frames, as built: a word in Ogg Bold as tall as a third of the
     glass sits on the foot of the page with its serifs just cut by the
     edge (measured off his comp: the O's thick side is 0.204 of the cap,
     Ogg Bold's exactly). It slides in from the right faster than the
     page, then the text drops in line by line. The page goes on across,
     the word leaves faster than it came and crosses the first picture as
     it arrives, and when the pictures fill the glass the page stops going
     across and they rise in place: one held on one side while a column of
     its neighbours climbs past it, then the whole set lifts away under a
     picture at full bleed. Then across again, into the next word.

     The sections are the board's lines, in the order his About names
     them: technology (Apps), workflow and structure (Systems), marketing
     (Digital), creative (Campaigns), brand (Branding), then Interiors.
     Every study sits in one line. About's pictures are his comp's.

     The pushes, each small: where the word crosses a picture it takes
     the colour that reads on that picture (his APPS frame set black type
     on the dark Ivy Park laptop); the mark names the section you are in;
     every picture opens its study in a sheet that rises from the foot,
     the same move as the pictures, so you never leave the page; and the
     end is a contents page of the words, each one a way back.

     Then the two pushes he said yes to ("let's try those two pushes").
     THE WORD IS A WINDOW: once the text is down, the ink drains up out
     of the letters and the section's pictures show through them, then
     the word opens from the heart of its thickest stroke until they fill
     the glass. It is the page that has the word cut out of it (an SVG
     mask), not the pictures clipped to it, because Chrome stops drawing
     a letter past about 5,000px: the holes grow to 4,400px of type and
     the paper dissolves for the rest. FIELDS: after a section's last
     picture a field in the next line's own colour rises, and the next
     word arrives on it before its page slides in. The colour is the
     line's lead study's, from its palette (house.js); the end's is black.

     Ogg is Sharp Type's and it is installed on his Mac, so the page asks
     for it by name and never ships the files. Anyone without it sees
     Georgia. Going live needs a web licence. -->

<style>

  .pnl { position: absolute; top: 0; height: 100%; background: var(--paper); }

  .txt .list i { font-style: normal; color: var(--grey); margin-left: 0.35em; }
  .txt .list a:hover, .txt .list button:hover { color: var(--grey); }
  .txt .lead a { border-bottom: 1px solid currentColor; }

  /* ── the pictures: edge to edge, rising in place ── */
  .blk { position: absolute; top: 0; height: 100%; overflow: hidden; background: #e6e1dc; }
  .blk .col { position: absolute; left: 0; top: 0; width: 100%; will-change: transform; }
  .fr { position: absolute; display: block; overflow: hidden; background: #e6e1dc; }

    letter-spacing: -0.012em; white-space: nowrap; will-change: transform; }

  .wd .b { color: #fff; }

  /* ── the chrome: the mark and the section it is in, and the index ── */
  .chrome { position: fixed; z-index: 30; color: var(--c, #000); transition: color 0.3s ease; }
  #mast { left: var(--mg); top: 28px; display: flex; align-items: baseline; gap: 16px; font-size: 17px; }
  #mast .mark { font-size: 17px; }

  #idx { right: var(--mg); top: 28px; padding: 0; border: 0; background: none; font: inherit; font-size: 15px; font-weight: 600; letter-spacing: -0.01em;
    line-height: 1.2; cursor: pointer; }

  /* the contents, from the right */
  #toc { position: fixed; z-index: 40; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); padding: 96px 48px 48px; background: var(--paper); color: var(--ink);
    box-shadow: -1px 0 0 var(--hair); clip-path: inset(0 0 0 100%); pointer-events: none; transition: clip-path 0.7s var(--ease); overflow: auto; }
  #toc.on { clip-path: inset(0 0 0 0); pointer-events: auto; }
  #toc .x { position: absolute; right: 48px; top: 28px; padding: 0; border: 0; background: none; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  #toc .toc { position: relative; }

  #toc .toc button.here { color: var(--ink); }
  #toc .mail { margin: 40px 0 0; font-size: 15px; font-weight: 600; line-height: 1.8; }
  #toc .mail a { display: block; }

  /* ── a study rises from the foot, the same move as the pictures ── */
  #study { position: fixed; z-index: 60; inset: 0; display: flex; flex-direction: column; background: var(--paper);
    transform: translateY(101%); transition: transform 0.85s var(--ease); visibility: hidden; }
  #study.on { transform: none; visibility: visible; }

  #study .bar { flex: none; display: flex; align-items: baseline; gap: 16px; height: 64px; padding: 26px var(--mg) 0; box-shadow: 0 1px 0 var(--hair);

  #study .bar .t { font-size: 17px; font-weight: 700; letter-spacing: -0.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

<script>
(function () {
"use strict";
const H = window.HOUSE, P = window.PICTURES, R = window.Ride, clamp = R.clamp, lerp = R.lerp, ease = R.ease;
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const INK = "#000", PAPER = "#fff";
const stage = document.getElementById("stage"), world = document.getElementById("world"), wordsEl = document.getElementById("words");

/* ── WHAT IS SHOWN ────────────────────────────────────────────────── */
/* the house's studies by the address their page lives at */
const BYH = {}; Object.values(H.studies).forEach((s) => { BYH[s.h] = s; });
const lineOf = (tag) => H.lines.find((l) => l.tag === tag);
/* a picture by its study's address and the start of its file name */
const pic = (h, name) => {
  if (name === "*reel") return { h, reel: (P[h] || []).slice(0, 8), w: 4, h2: 3 };
  const f = (P[h] || []).find((p) => p.src.split("/").pop().startsWith(name));
  if (!f) console.warn("[words] no picture", h, name);
  return f ? { src: f.src, alt: f.alt, w: f.w, h2: f.h, h } : null;
};
/* two studies share a title (three Hill Country rooms, two Fairview
   rooms): the room tells them apart */
const TITLES = {}; Object.values(H.studies).forEach((s) => { TITLES[s.t] = (TITLES[s.t] || 0) + 1; });
const title = (h) => { const s = BYH[h]; if (!s) return h; if (TITLES[s.t] < 2) return s.t;
  const room = String(s.s || "").replace(/^interior design,\s*/i, ""); return s.t + ", " + room; };

/* About is his comp's copy, as he wrote it there, and his comp's five
   pictures. The lines keep the board's sentences. */
const SECS = [
  { id: "about", word: "About",
    lead: "I solve problems in a number of mediums from technology, business workflow, organizational structure, marketing, creative and brand.",
    body: "With 20+ years of experience working across organizations large and small I help create campaigns, brands and use new tools and technology (like AI) to streamline the workflow and process around. I understand the data and analytics needed to solve these problems.",
    moves: [{ side: "left", held: ["robert-rodriguez", "neiman-marcus-robert-rodriguez-woman-model-pink-blazer"],
      col: [["arc", "rhs-arc-app-project-select-phone"], ["nordstrom-personalization", "rhs-nordstrom-personalization-laptop"], ["sally", "rhs-sally-os-asset-hub-laptop"]],
      bleed: ["ivy-park", "ivy-park-nordstrom-laptop-brand-experience"] }] },
  { id: "apps", tag: "app",
    moves: [{ side: "left", held: ["arc", "arc-app-tablet-kitchen-living-room"],
      col: [["dsc", "dsc-marketing-site-laptop-hero"], ["sizzle", "*reel"], ["dsc", "dsc-ai-scheduler-phone"]],
      bleed: ["arc", "arc-app-kitchen-project-selection"] }] },
  { id: "systems", tag: "systems",
    moves: [{ side: "left", held: ["sally", "sally-os-brand-brain"],
      col: [["nordstrom-framework", "nordstrom-content-framework-lockup-on-our-list"], ["nordstrom-personalization", "nordstrom-personalization-system-design-woman-model-blue-floral"], ["sally", "sally-os-utilities-marketplace"]],
      bleed: ["nordstrom-personalization", "nordstrom-personalization-homepage-laptop"] }] },
  { id: "digital", tag: "digital",
    moves: [{ side: "left", held: ["ivy-park", "ivy-park-campaign-assets-grid"],
      col: [["nordstrom-beauty", "nordstrom-beauty-tryon-iphone"], ["cosmo-prof", "cosmo-prof-photography-direction-hair-color-brushes"], ["jeffrey-ecommerce", "jeffrey-new-york-digital-flagship"]],
      bleed: ["you-by-sally", "you-by-sally-street-display-case"] },
    { side: "right", held: ["neiman-marcus", "neiman-marcus-insite-contemporary-art-magazine"],
      col: [["loved-by-nordstrom", "loved-by-nordstrom-iphone-instagram"], ["jeffrey-spring", "jeffrey-spring-campaign-hero-grid"], ["neiman-marcus", "neiman-marcus-insite-color-story-rainbow"]],
      bleed: ["loved-by-nordstrom", "loved-by-nordstrom-gallery-wall"] }] },
  { id: "campaigns", tag: "creative",
    moves: [{ side: "left", held: ["robert-rodriguez", "neiman-marcus-robert-rodriguez-woman-yellow-blazer-white-pants-coral"],
      col: [["robert-rodriguez", "robert-rodriguez-logo-typography-gradient"], ["capitan-boot-co", "capitan-boot-co-branding-system"], ["hill-country-oak", "hill-country-oakworks-mid-century-tree-silhouette-poster"]],
      bleed: ["capitan-boot-co", "capitan-boot-co-western-branding-desert-landscape-mountains-clouds"] },
    { side: "right", held: ["big-bend", "elena_wide"],
      col: [["big-bend", "chisos-range-panorama"], ["branding-graphics", "branding-graphics-inna-foil-zine"], ["branding-graphics", "branding-graphics-abc-123"]],
      bleed: ["hill-country-oak", "hill-country-oakworks-outdoor-banner"] }] },
  { id: "branding", tag: "branding",
    moves: [{ side: "left", held: ["amber-shockey-co", "amber-shockey-co-black-linework-geometric-plates"],
      col: [["black-white-type", "typography-patterns-stepper-poster"], ["amber-shockey-co", "amber-shockey-co-blue-florals-peony-wallpaper"], ["black-white-type", "typography-patterns-white-poster-gate"]],
      bleed: ["j-christianson", "j-christianson-storefront-tree-stripe"] }] },
  { id: "interiors", tag: "interiors",
    moves: [{ side: "left", held: ["hill-country-kitchen", "hill-country-kitchen-island-pendants"],
      col: [["hill-country-bath", "hill-country-bath-his-vanity"], ["hill-country-living", "hill-country-living-cognac-leather-sofa-open-kitchen"], ["floor-and-decor", "urban-southwest-primary-bath-exposed-brick"]],
      bleed: ["fairview-sitting", "fairview-sitting-stacked-stone"] },
    { side: "right", held: ["fairview-entry", "hero1"],
      col: [["fairview-suite", "fairview-suite-bedroom-sofa-chair"], ["chalet", "chalet-a-frame-ceiling"]],
      bleed: ["chalet", "chalet-living-room-a-frame-glass-doors"] }] },
];
SECS.forEach((sec) => {
  const L = sec.tag ? lineOf(sec.tag) : null;
  if (L) { sec.word = L.name; sec.lead = L.sentence; }
  /* the studies in the order the pictures show them, each once */
  const seen = [];
  sec.moves.forEach((m) => [m.held, ...m.col, m.bleed].forEach(([h]) => { if (!seen.includes(h)) seen.push(h); }));
  sec.studies = sec.tag ? seen : null;
});
/* the last word is the greeting his address opens with, and it is the
   one word short enough to land whole */
const END = { id: "hello", word: "Hello", end: true,
  lead: '<a href="mailto:' + esc(H.email) + '">' + esc(H.email) + "</a>",
  links: [["Book 30 minutes", "/book"], ["The daybook", "/daybook"]] };
const ALL = [...SECS, END];

/* ── THE LAYOUT ───────────────────────────────────────────────────── */
let VW = 0, VH = 0, TALL = false, S = null;
const probe = (font, txt) => {
  const s = el("span", null, esc(txt)); s.style.cssText = "position:absolute;left:-9999px;top:0;white-space:nowrap;font:" + font;
  const mark = el("span"); mark.style.cssText = "display:inline-block;width:0;height:0;vertical-align:baseline";
  s.appendChild(mark); document.body.appendChild(s);
  const r = { w: s.offsetWidth, base: mark.offsetTop }; s.remove(); return r;
};
const inkC = document.createElement("canvas").getContext("2d");
function typeMetrics(F) {
  const fam = getComputedStyle(document.documentElement).getPropertyValue("--serif");
  inkC.font = "700 100px " + fam;
  const cap = inkC.measureText("H").actualBoundingBoxAscent / 100 || 0.695;
  const base = probe("700 " + F + "px/1 " + fam, "H").base;
  return { cap, base, fam };
}

/* split a paragraph into its lines as it sets, each in its own slot */
function lines(p) {
  const words = p.textContent.split(/\s+/).filter(Boolean); p.textContent = "";
  const spans = words.map((w, i) => { const s = el("span", null, esc(w)); p.appendChild(s); if (i < words.length - 1) p.appendChild(document.createTextNode(" ")); return s; });
  const rows = []; let top = null;
  spans.forEach((s) => { if (s.offsetTop !== top) { top = s.offsetTop; rows.push([]); } rows[rows.length - 1].push(s.textContent); });
  p.textContent = "";
  return rows.map((ws) => { const ln = el("span", "ln"), inn = el("span", null, esc(ws.join(" "))); ln.appendChild(inn); p.appendChild(ln); return inn; });
}
function slot(node) { const ln = el("span", "ln"), inn = el("span"); while (node.firstChild) inn.appendChild(node.firstChild); ln.appendChild(inn); node.appendChild(ln); return inn; }

/* a picture box. Its image waits for the page to come near it */
function frame(p, x, y, w, h, kind) {
  const a = el("a", "fr " + kind); a.href = "/case-studies/" + p.h; a.dataset.h = p.h; a.dataset.cur = "Open";
  a.style.cssText = "left:" + x + "px;top:" + y + "px;width:" + w + "px;height:" + h + "px";
  const im = el("img"); im.alt = p.alt || ""; im.decoding = "async"; a.appendChild(im);
  const s = BYH[p.h]; a.appendChild(el("span", "cap", esc(title(p.h)) + (s ? "<i>" + s.y + "</i>" : "")));
  const f = { el: a, img: im, cap: a.lastChild, p, x, y, y0: y, w, h, kind, lum: null, armed: false, src: p.src || (p.reel && p.reel[0] && p.reel[0].src) };
  /* honest: never shown wider than half the file's own pixels */
  if (p.w && p.h2 && !p.reel) { const shown = Math.max(w, h * p.w / p.h2) * 1;
    if (p.w < shown * 2 * 0.97) console.info("[words] soft by " + Math.round((1 - p.w / (shown * 2)) * 100) + "%:", p.src.split("/").pop(), Math.round(shown) + "px shown"); }
  return f;
}

/* ── THE WINDOW: a word the pictures show through, then open ──────── */
const NS = "http://www.w3.org/2000/svg", clipDefs = document.querySelector("#clips defs");
/* how far each point of ink is from the paper, in thirds of a pixel:
   two passes of a 3-4 chamfer */
function chamfer(D, W, H) {
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const p = y * W + x; if (!D[p]) continue; let m = D[p];
    if (x > 0) m = Math.min(m, D[p - 1] + 3);
    if (y > 0) { m = Math.min(m, D[p - W] + 3); if (x > 0) m = Math.min(m, D[p - W - 1] + 4); if (x < W - 1) m = Math.min(m, D[p - W + 1] + 4); }
    D[p] = m;
  }
  for (let y = H - 1; y >= 0; y--) for (let x = W - 1; x >= 0; x--) {
    const p = y * W + x; if (!D[p]) continue; let m = D[p];
    if (x < W - 1) m = Math.min(m, D[p + 1] + 3);
    if (y < H - 1) { m = Math.min(m, D[p + W] + 3); if (x < W - 1) m = Math.min(m, D[p + W + 1] + 4); if (x > 0) m = Math.min(m, D[p + W - 1] + 4); }
    D[p] = m;

      const start = pg.i === 0 ? (k === 0 ? -1 : (k - 1) / n * 0.6) : k / n * 0.55;
      const e = REDUCE ? 1 : ease(clamp((t - start) / 0.32, 0, 1));
      const v = ((1 - e) * -106).toFixed(2);
      if (row.__v !== v) { row.__v = v; row.style.transform = "translate3d(0," + v + "%,0)"; }
    });
  });

  /* the mark names the section once its word is on, and takes the
     colour that reads */
  const i = st.b.k === "in" && st.t < 0.3 ? st.b.i - 1 : st.b.i, sec = ALL[i];
  if (sec !== lastSec) {
    lastSec = sec; document.getElementById("here").textContent = sec.word;
    if (!study.open && hashReady) history.replaceState(null, "", "#" + sec.id);
    document.querySelectorAll("#tocList button").forEach((b, k) => b.classList.toggle("here", k === i));
  }
  document.getElementById("mast").style.setProperty("--c", inkAt(60, 40, camX));
  document.getElementById("idx").style.setProperty("--c", inkAt(VW - 50, 40, camX));
  reelTick(camX);
}

/* ── LOADING: a set's pictures come in as the page nears them ─────── */
function arm(B) {
  B.frames.forEach((f) => {
    if (f.armed) return; f.armed = true;
    const im = f.img;
    im.onload = () => { im.classList.add("in"); if (!f.lum || f.p.reel) sample(f); };
    im.src = encodeURI(f.src);
    if (f.p.reel) f.p.reel.forEach((q) => { const pre = new Image(); pre.decoding = "async"; pre.src = encodeURI(q.src); });
  });
}
/* Faux Reel is a tool that cuts a reel from the work, so its box plays
   one: its own cover frames, cut while it is on the glass */
let lastTick = 0;
function reelTick(camX) {
  const now = performance.now(); if (REDUCE || now - lastTick < 90) return; lastTick = now;
  reels.forEach((r) => {
    const B = S.blocks.find((b) => b.frames.includes(r.f)); if (!B) return;
    const top = r.f.y - Math.max(0, B.cy), left = B.x - camX + r.f.x;
    const on = left < VW && left + r.f.w > 0 && top < VH && top + r.f.h > 0;
    if (on && !r.t) r.t = setInterval(() => { r.k = (r.k + 1) % r.f.p.reel.length; r.f.img.src = encodeURI(r.f.p.reel[r.k].src); }, 260);
    if (!on && r.t) { clearInterval(r.t); r.t = 0; }
  });
}

/* ── GOING PLACES ─────────────────────────────────────────────────── */
function goTo(i, now) {
  const b = S.beats.find((x) => x.k === "settle" && x.i === i); if (!b) return;
  R.to(stageTop() + b.s + b.S - 2, now); tocEl.classList.remove("on");
}
const tocEl = document.getElementById("toc");
function toc() {
  const ul = document.getElementById("tocList"); ul.textContent = "";
  SECS.forEach((s, k) => {
    const li = el("li"), b = el("button", null, esc(s.word.toUpperCase()) + (s.studies ? "<sup>(" + s.studies.length + ")</sup>" : ""));
    b.type = "button"; b.addEventListener("click", () => goTo(k)); li.appendChild(b); ul.appendChild(li);
  });
  const li = el("li"), b = el("button", null, "HELLO"); b.type = "button"; b.addEventListener("click", () => goTo(ALL.length - 1)); li.appendChild(b); ul.appendChild(li);
  document.getElementById("tocMail").innerHTML = '<a href="mailto:' + esc(H.email) + '">' + esc(H.email) + '</a><a href="/book">Book 30 minutes</a><a href="/daybook">The daybook</a>';
  lastSec = null;
}
document.getElementById("idx").addEventListener("click", () => tocEl.classList.add("on"));
tocEl.querySelector(".x").addEventListener("click", () => tocEl.classList.remove("on"));

/* ── A STUDY RISES FROM THE FOOT ──────────────────────────────────── */
const sheet = document.getElementById("study"), frameEl = sheet.querySelector("iframe"), ph = sheet.querySelector(".well img");
const study = { open: false, pushed: false };
function openStudy(h, src, push) {
  const s = BYH[h];
  sheet.querySelector(".t").innerHTML = esc(title(h)) + (s ? "<i>" + s.y + "</i>" : "");
  sheet.querySelector(".open").href = "/case-studies/" + h;
  sheet.classList.remove("ready"); ph.src = src ? encodeURI(src) : ""; ph.style.display = src ? "" : "none";
  frameEl.src = "/case-studies/" + h;
  sheet.classList.add("on"); study.open = true;
  if (R.lenis) R.lenis.stop(); document.documentElement.style.overflow = "hidden";
  if (push !== false) { history.pushState({ study: h }, "", "#" + (lastSec ? lastSec.id : "about") + "/" + h); study.pushed = true; }
}
function closeStudy(fromPop) {
  if (!study.open) return;
  study.open = false; sheet.classList.remove("on");
  if (R.lenis) R.lenis.start(); document.documentElement.style.overflow = "";
  setTimeout(() => { if (!study.open) { frameEl.src = "about:blank"; sheet.classList.remove("ready"); } }, 900);
  if (!fromPop && study.pushed) { study.pushed = false; history.back(); }
  if (lastSec) history.replaceState(null, "", "#" + lastSec.id);
}
frameEl.addEventListener("load", () => {
  if (!study.open) return;
  let path = "", doc = null; try { path = frameEl.contentWindow.location.pathname; doc = frameEl.contentDocument; } catch (e) { return; }
  if (path === "blank" || path === "") return;
  /* a link inside the study that leaves it takes the whole window */
  if (!path.startsWith("/case-studies/")) { location.href = frameEl.contentWindow.location.href; return; }
  /* the study's own Close closes the sheet, and its Next keeps the bar
     honest about which study is up */
  if (doc && !doc.__words) {
    doc.__words = true;
    doc.addEventListener("click", (e) => {
      if (e.target.closest && e.target.closest('[aria-label="Close the case study"]')) { e.preventDefault(); e.stopPropagation(); closeStudy(); return; }
      /* Next moves inside the app without a page load */
      setTimeout(syncBar, 900);
    }, true);
  }
  syncBar();
  sheet.classList.add("ready");
});
function syncBar() {
  let path = ""; try { path = frameEl.contentWindow.location.pathname; } catch (e) { return; }
  const h = path.split("/")[2], s = BYH[h];
  if (s) { sheet.querySelector(".t").innerHTML = esc(title(h)) + "<i>" + s.y + "</i>"; sheet.querySelector(".open").href = "/case-studies/" + h; }
}
sheet.querySelector(".x").addEventListener("click", () => closeStudy());
addEventListener("keydown", (e) => { if (e.key === "Escape") { if (study.open) closeStudy(); else tocEl.classList.remove("on"); } });
addEventListener("popstate", () => { if (study.open) { study.pushed = false; closeStudy(true); } });
document.addEventListener("click", (e) => {
  const a = e.target.closest && e.target.closest("a[data-h]"); if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  const f = S && S.blocks.flatMap((b) => b.frames).find((x) => x.el === a);
  const src = f ? f.src : ((P[a.dataset.h] || [])[0] || {}).src;
  openStudy(a.dataset.h, src);
});

/* ── START ────────────────────────────────────────────────────────── */
const HASH0 = location.hash;
build();
R.start({ pre: draw });
/* for the compare page and for testing: the beats, and a way along them */
window.WORDS = { get S() { return S; }, get cur() { return cur; },
  go: (i, k, f) => { const b = S.beats.find((x) => x.i === i && x.k === k); if (b) R.to(stageTop() + b.s + clamp(f || 0, 0, 1) * b.S, true); } };
/* an address opens the page on its section, and a study's opens it too */
const deep = () => {
  const [id, h] = HASH0.slice(1).split("/"); const i = ALL.findIndex((s) => s.id === id);
  if (i > 0 || (i === 0 && h)) goTo(i, true);
  if (h && BYH[h] && !study.open) openStudy(h, ((P[h] || [])[0] || {}).src, false);
};
if (HASH0.length > 1) { requestAnimationFrame(deep); setTimeout(() => { if (!study.open) deep(); hashReady = true; }, 400); }
else hashReady = true;
/* a rebuild keeps you on the same beat at the same point along it */
let rt = 0; const rebuild = () => {
  let keep = null;
  if (S) { const d = clamp(scrollY - stageTop(), 0, S.total), b = beatAt(d); keep = { n: S.beats.indexOf(b), k: b.S ? (d - b.s) / b.S : 0 }; }
  build(); R.remeasure();
  if (keep && S.beats[keep.n]) { const b = S.beats[keep.n]; R.to(stageTop() + b.s + keep.k * b.S, true); }
};
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(rebuild, 140); });
if (document.fonts) Promise.all([document.fonts.load('700 100px "RH Ogg"'), document.fonts.load('600 16px "Avenir Next"'), document.fonts.load('400 16px "Avenir Next"')]).then(rebuild, rebuild);
})();
</script>
</body>
