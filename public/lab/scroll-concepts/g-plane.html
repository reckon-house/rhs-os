<!-- ── CONCEPT G: THE PLANE, A AND E TOGETHER (25 Sept 2026) ──────────
     His ask: "what would a combo of A and E look like? what if we mix in
     some full bleed hero images too so it's a big scale play mix of
     large images in play? and would we transition a full case study
     'down' like the mini ivy park one so everything feels 'connected'?
     ... it never feels like you leave the page, ya know? just keep going
     up, down, left, right..."

     A's rows (a line as a field of its lead study's colour with its name
     on its side, then white with studies hung at different heights) laid
     out on E's plane, and E's camera flying one route over it. Mixed in
     at full bleed: a picture that fills the glass edge to edge, from a
     file with the pixels for it (3,000 wide or more, never stretched).
     At the end of a row the study it leads to starts as a small picture
     at the right of the glass and grows to full bleed as the camera
     arrives, and then the camera turns DOWN into the whole study: every
     section of src/data/<slug>-case-study.ts in order, his words, read as
     a normal page. At its foot the camera turns across into the next
     row, so nothing ever leaves.

     The route: across (Digital) · down (Ivy Park, the full study) ·
     across (Campaigns) · UP through Robert Rodriguez's campaign at full
     bleed · across (Interiors) · down (the Hill Country kitchen, the full
     study) · LEFT into the way to talk. Each leg slows into its corner
     and speeds out of it, and reads at the scroll's own speed between.
     A study keeps an address: entering one writes #ivy-park into the
     URL, and opening that URL opens the plane on it.

     Not ported: the studies' pressing choreography (pins, zooms,
     crossings). Their bespoke drawings (the hexagon device, the reach
     chart, the material charts) show as a note pointing to the live
     study. A phone reads the whole route downwards. -->

<script>
(function () {
const H = window.HOUSE, FULL = window.STUDIES_FULL, BLEEDS = window.BLEEDS, R = window.Ride, clamp = R.clamp, lerp = R.lerp, ease = R.ease;
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const stage = document.getElementById("stage"), plane = document.getElementById("plane"), map = document.getElementById("map");
const line = (tag) => H.lines.find((l) => l.tag === tag);
/* a board picture at a height, never wider than half its own pixels */
const fit = (s, h) => { let w = h * s.nat[0] / s.nat[1]; const m = R.honest(s); if (w > m) { h = h * m / w; w = m; } return { w, h }; };
let VW = 0, VH = 0, FLAT = false, G = null;
const rooms = [], drift = [], grows = [], words = [], timers = [];

/* ── ROOMS ─────────────────────────────────────────────────────────── */
function place(elm, x, y, w, h, ink, kind) {
  elm.classList.add("room");
  if (FLAT) { plane.appendChild(elm); const r = { el: elm, x: 0, y: 0, w: 0, h: 0, ink, kind }; rooms.push(r); return r; }
  elm.style.left = x + "px"; elm.style.top = y + "px"; elm.style.width = w + "px";
  if (h != null) elm.style.height = h + "px";
  plane.appendChild(elm);
  const r = { el: elm, x, y, w, h: h != null ? h : elm.offsetHeight, ink, kind };
  rooms.push(r); return r;
}
function opener() {
  const o = el("div", "opener paper");
  const m = H.statement.ink.match(/^(.*across) (brand,) (product,) (and place\.)$/);
  o.appendChild(el("div", "small", esc(m ? m[1] : H.statement.ink)));
  if (m) [m[2], m[3], m[4]].forEach((w, i) => { const b = el("div", "big b" + (i + 1), esc(w)); b.__drift = [0.05, 0.14, 0.26][i]; o.appendChild(b); });
  o.appendChild(el("p", "grey", esc(H.statement.grey)));
  return o;
}
function field(L) {
  const f = el("div", "field"); f.style.setProperty("--fill", L.color); f.style.setProperty("--fink", L.ink);
  const size = Math.min(0.26 * VH, 0.74 * VH / (L.name.length * 0.64));
  const sp = el("div", "spine", esc(L.name)); sp.style.fontSize = size + "px"; f.appendChild(sp);
  const thick = size * 0.8;
  const ct = el("div", "count", String(L.studies.length)); ct.style.left = (0.034 * VW + thick + 12) + "px"; f.appendChild(ct);
  const say = el("p", "say", esc(L.sentence)); say.style.left = (0.034 * VW + thick + 0.06 * VW) + "px"; f.appendChild(say);
  f.__w = 0.034 * VW + thick + 0.06 * VW + 0.24 * VW + 0.06 * VW;
  return f;
}
/* studies hung at three sizes, so a small one stands beside a big one */
function hang(ks) {
  const hg = el("div", "hang paper");
  const spots = [[0.58, 0.14, "up"], [0.26, 0.54, "left"], [0.4, 0.2, "down"]];
  let x = 0.06 * VW;
  ks.forEach((k, i) => {
    const s = H.studies[k], [hh, top, dir] = spots[i % 3], p = fit(s, hh * VH);
    const it = el("div", "it"); it.style.left = x + "px"; it.style.top = (top * VH) + "px";
    const pic = R.pic(s, p.w, p.h, { flip: dir }); pic.dataset.go = s.h; it.appendChild(pic);
    it.appendChild(el("span", "cap", esc(s.t) + " <span>" + esc(s.s) + "</span>"));
    hg.appendChild(it); x += p.w + 0.05 * VW;
  });
  hg.__w = x + 0.02 * VW;
  return hg;
}
/* a picture at full bleed, from a file with the pixels for it */
function bleed(src, label, sub, opts) {
  const o = opts || {};
  const b = el("div", "bleed" + (o.grow ? " grow" : ""));
  const clip = el("div", "clip"), im = el("div", "im"), img = el("img");
  img.alt = ""; img.decoding = "async"; img.loading = o.eager ? "eager" : "lazy"; img.src = encodeURI(src);
  im.appendChild(img); clip.appendChild(im); b.appendChild(clip);
  clip.appendChild(el("div", "shade"));
  if (label) clip.appendChild(el("div", "lab", esc(label) + (sub ? " <span>" + esc(sub) + "</span>" : "")));

  /* mid-study the map and the arrow step aside; they come back for the
     turns, and they leave for good once the mark has arrived */
  const reading = !!sg.hash && sg.hash !== "robert-rodriguez" && (d - sg.s) > 1.1 * VH && (sg.s + sg.S - d) > 1.1 * VH;
  document.body.classList.toggle("reading", reading);
  document.body.classList.toggle("home", sg === G.segs[G.segs.length - 1] && f > 0.7);
  document.getElementById("mk").style.setProperty("--c", inkAt(70, 60));
  crumb.style.setProperty("--c", inkAt(70, 100));
  document.getElementById("idx").style.setProperty("--c", inkAt(VW - 80, 64));
  way.style.setProperty("--c", inkAt(80, VH - 40));
  map.style.setProperty("--c", inkAt(VW - 120, VH - 80));
  const win = document.getElementById("mapWin"); if (win) { win.setAttribute("x", (cx * G.k).toFixed(1)); win.setAttribute("y", (cy * G.k).toFixed(1)); }
}

/* ── THE MAP ── the whole plane, the route, and the glass on it */
function drawMap() {
  const W = 190, Hm = 118, k = Math.min(W / G.PW, Hm / G.PH);
  let svg = '<svg viewBox="0 0 ' + W + " " + Hm + '">';
  rooms.forEach((r) => {
    const fill = r.kind === "field" ? getComputedStyle(r.el).getPropertyValue("--fill") : r.kind === "bleed" ? "rgba(128,128,128,0.55)" : r.kind === "black" ? "#000" : "rgba(128,128,128,0.18)";
    svg += '<rect x="' + (r.x * k).toFixed(1) + '" y="' + (r.y * k).toFixed(1) + '" width="' + Math.max(0.6, r.w * k).toFixed(1) + '" height="' + Math.max(0.6, r.h * k).toFixed(1) + '" fill="' + fill.trim() + '"/>';
  });
  svg += '<polyline fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2" points="' + G.pts.map((p) => ((p[0] + VW / 2) * k).toFixed(1) + "," + ((p[1] + VH / 2) * k).toFixed(1)).join(" ") + '"/>';
  svg += '<rect id="mapWin" width="' + (VW * k).toFixed(1) + '" height="' + (VH * k).toFixed(1) + '" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>';
  map.innerHTML = svg; G.k = k;
}

/* ── THE INDEX ── each entry flies the camera to its place on the route */
const sheet = document.getElementById("sheet");
function goTo(seg, pos, now) { const sg = G.segs[seg]; const d = sg.s + uFor(sg, clamp(pos, 0, sg.L)); R.to(stageTop() + d, now); sheet.classList.remove("on"); }
function index() {
  const nav = document.getElementById("lines"); nav.textContent = "";
  const entries = [
    [line("digital").name, 0, G.R0.field.x, false], [H.studies["ivy-park"].t, 1, 0, true],
    [line("creative").name, 2, G.F2.x - G.xI, false], [H.studies["robert-rodriguez"].t, 3, 0, true],
    [line("interiors").name, 4, G.F3.x - G.xR, false], [H.studies["hill-country-kitchen"].t, 5, 0, true],
    ["The way to talk", 6, G.We - VW, false]];
  entries.forEach(([txt, seg, pos, st]) => {
    const b = el("button", "ln" + (st ? " st" : ""), "<span>" + esc(txt) + "</span>"); b.type = "button";
    b.addEventListener("click", () => goTo(seg, pos)); nav.appendChild(b);
  });
  requestAnimationFrame(() => nav.querySelectorAll(".ln").forEach((b) => b.style.setProperty("--w", Math.round(b.firstChild.getBoundingClientRect().width) + "px")));
}
document.getElementById("idx").addEventListener("click", () => sheet.classList.add("on"));
sheet.querySelector(".x").addEventListener("click", () => sheet.classList.remove("on"));
/* a hung picture of a study on the route flies there; the rest open their study */
plane.addEventListener("click", (e) => {
  if (!G) return;
  const grow = e.target.closest(".bleed.grow");
  if (grow) { const seg = G.segs.findIndex((s) => s.hash === grow.dataset.to); if (seg >= 0) { goTo(seg, 0); return; } }
  const a = e.target.closest("a.pic"); if (!a) return;
  const seg = G.segs.findIndex((s) => s.hash === a.dataset.go);
  if (seg >= 0) { e.preventDefault(); goTo(seg, 0); }
});

build();
R.start({ pre: frame });
/* for the compare page and for testing: the route, and a way along it */
window.PLANE = { get G() { return G; }, go: (seg, frac) => { if (!G) return; const sg = G.segs[seg]; R.to(stageTop() + sg.s + clamp(frac, 0, 1) * sg.S, true); } };
/* a study's address opens the plane on it */
const deep = () => { if (!G || !location.hash) return; const seg = G.segs.findIndex((s) => s.hash === location.hash.slice(1)); if (seg >= 0) goTo(seg, 0, true); };
requestAnimationFrame(deep); setTimeout(deep, 300);
/* a rebuild keeps you on the same leg at the same point along it: the
   route's lengths change a little once the fonts land, so a fraction of
   the whole route would move you, off a corner and out of a study */
let rt = 0; const rebuild = () => {
  let keep = null;
  if (G && !FLAT) { const c = camera(clamp(scrollY - stageTop(), 0, G.S)); keep = { i: G.segs.indexOf(c.sg), k: c.sg.S ? c.u / c.sg.S : 0 }; }
  build(); R.remeasure();
  if (G && keep) { const sg = G.segs[keep.i]; R.to(stageTop() + sg.s + keep.k * sg.S, true); }
};
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(rebuild, 140); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(rebuild);
})();
</script>
