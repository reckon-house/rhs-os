<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Strips · scroll concepts · Reckon*House</title>
<!-- ── CONCEPT B: STRIPS (24 Sept 2026) ───────────────────────────────
     Akaru's opener and its turn, with the board's work. Half the glass
     is the mark, set as large as the half allows, with the statement and
     the lines under it, each line with a dot in its own colour. The
     other half is the work as strips, one per study, each in a colour
     from that study's own palette. Scrolling moves the strips left, and
     the one reaching the reading line opens to full width: its picture
     cutting through its frames, its name set big at its foot. Then the
     camera turns without a cut: the row rises off the top, all thirty
     studies run up as a film strip, and the board's ruled index stands
     beside them lighting the lines of the study in the middle of the
     glass. Last, black, and the wordmark rising letter by letter.
     Hover a line under the mark and the strips that are not on it dim. -->
<link rel="stylesheet" href="/lab/scroll-concepts/ride.css">
<style>
  #stage { position: relative; }
  #stage > .pin { position: sticky; top: 0; height: 100vh; overflow: hidden; }
  .cam { position: absolute; inset: 0; will-change: transform; }

  /* the opener: the mark as large as half the glass allows */
  .opener { position: absolute; left: 0; top: 0; width: 50vw; height: 100vh; padding: 44px var(--gut) 34px; display: flex; flex-direction: column; will-change: transform; background: var(--paper); z-index: 2; }
  .opener .nav { display: flex; flex-wrap: wrap; gap: 8px 26px; font-size: 13px; font-weight: 600; }
  .opener .nav button { display: inline-flex; align-items: center; gap: 9px; border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; }
  .opener .nav i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
  .opener .nav sup { font-size: 10px; color: var(--grey); }
  .opener .big { margin: auto 0 0; font-weight: 700; letter-spacing: -0.06em; line-height: 0.8; white-space: nowrap; }
  .opener .big i { font-style: normal; font-weight: 400; }
  .opener .st { margin: 3vh 0 0; max-width: 40em; font-size: 20px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.3; }
  .opener .st span { color: var(--grey); }
  .opener .ways { display: flex; justify-content: space-between; margin-top: 5vh; padding-top: 14px; border-top: 1px solid var(--ink); font-size: 12px; font-weight: 600; }

  /* the strips */
  .strip { position: absolute; top: 0; height: 100vh; overflow: hidden; background: var(--fill); color: var(--sink); will-change: transform, width; transition: opacity 0.4s ease; }
  .strip.dim { opacity: 0.18; }
  .strip .ph { position: absolute; left: 2.2vw; top: 13vh; }
  .strip .meta { position: absolute; left: 2.2vw; bottom: calc(6vh + var(--nmh, 7.4vw)); font-size: 12px; font-weight: 600; white-space: nowrap; opacity: 0.72; }
  .strip .nm { position: absolute; left: 2vw; bottom: 5vh; margin: 0; font-size: 7.2vw; font-weight: 600; letter-spacing: -0.055em; line-height: 1; white-space: nowrap; }
  .strip .no { position: absolute; left: 2.2vw; bottom: 2.2vh; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .strip .fact { position: absolute; top: 13vh; width: 21vw; font-size: 20px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.3; }
  .strip .fact span { opacity: 0.62; }
  .strip .go { display: inline-flex; margin-top: 22px; width: 46px; height: 46px; border: 1px solid currentColor; border-radius: 50%; align-items: center; justify-content: center; font-size: 16px; }

  /* after the turn: the film strip and the index beside it */
  .lower { position: absolute; left: 0; top: 100vh; width: 100vw; height: 100vh; }
  .film { position: absolute; left: var(--gut); top: 0; width: 40vw; display: flex; gap: 2.4vw; }
  .film .col { flex: 1 1 0; min-width: 0; will-change: transform; }
  .film .col:last-child { padding-top: 30vh; }
  .film .it { display: block; margin: 0 0 6vh; }
  .film .col:first-child .it:first-child { margin-top: 13vh; }
  .film .cap { font-size: 12px; }
  .side { position: absolute; left: calc(40vw + var(--gut) + 6vw); right: var(--gut); top: 0; height: 100vh; padding-top: 13vh; will-change: transform; }
  .side .lbl { font-size: 12px; font-weight: 600; color: var(--grey); margin: 0 0 18px; }
  .side .ln { position: relative; display: flex; gap: 4px; height: 42px; padding-top: 2px; font-size: 32px; font-weight: 700; letter-spacing: -0.05em; line-height: 1.2;
    color: rgba(0, 0, 0, 0.42); transition: color 0.35s ease; }
  .side .ln.here { color: var(--ink); }
  .side .ln sup { font-size: 10px; font-weight: 600; letter-spacing: 0; margin-top: 6px; }
  .side .ln::after { content: ""; position: absolute; left: -2vw; top: 100%; height: 1px; width: calc(2vw + var(--w, 0px)); background: rgba(0, 0, 0, 0.1); }
  .side .now { margin-top: 7vh; max-width: 30em; }
  .side .now h3 { margin: 0 0 12px; font-size: var(--st-fs); font-weight: 700; letter-spacing: -0.05em; line-height: 1.2; }
  .side .now p { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.3; }
  .side .now p span { color: var(--grey); }
  .side .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 12px; vertical-align: 2px; background: var(--c, #000); }

  .foot { position: relative; background: #000; color: #fff; padding: 22vh var(--gut) 0; overflow: hidden; }
  .foot .top { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 2vw; font-size: 12px; font-weight: 600; padding-bottom: 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.4); }
  .foot .top a, .foot .top span { display: block; line-height: 1.7; }
  .foot .top .g { color: rgba(255, 255, 255, 0.5); }
  .foot .pill { display: inline-flex; align-items: center; gap: 10px; height: 40px; padding: 0 18px; border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 20px; margin: 0 0 8vh; font-size: 13px; font-weight: 600; }
  .foot .pill i { width: 8px; height: 8px; border-radius: 50%; background: #E0552F; }
  .foot .word { display: block; margin-top: 3vh; font-size: 13.4vw; font-weight: 700; letter-spacing: -0.06em; line-height: 0.76; white-space: nowrap; }

  @media (max-width: 760px) {
    #stage { height: auto !important; } #stage > .pin { position: relative; height: auto; overflow: visible; }
    .cam, .opener, .strip, .lower, .film, .side { position: relative !important; transform: none !important; left: auto !important; top: auto !important; width: 100% !important; height: auto !important; }
    .opener { padding: 100px 20px 40px; } .strip { min-height: 90svh; } .strip .ph { position: relative; left: 20px; top: 80px; }
    .strip .fact { position: relative; left: 20px !important; width: auto; margin: 120px 20px 0 0; } .lower { display: none; }
  }
</style>
</head>
<body>
<section id="stage"><div class="pin"><div class="cam" id="cam"></div></div></section>
<footer class="foot" id="foot"></footer>
<script src="/lab/scroll-concepts/house.js"></script>
<script src="/lab/scroll-concepts/vendor/lenis.min.js"></script>
<script src="/lab/scroll-concepts/ride.js"></script>
<script>
(function () {
const H = window.HOUSE, R = window.Ride, clamp = R.clamp, lerp = R.lerp;
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const fit = (s, h, maxW) => { let w = h * s.nat[0] / s.nat[1]; const m = Math.min(R.honest(s), maxW || 1e9); if (w > m) { h = h * m / w; w = m; } return { w, h }; };
const stage = document.getElementById("stage"), cam = document.getElementById("cam"), foot = document.getElementById("foot");
const N = 12;                                    /* the first twelve, in the site's own order */
const OPEN_U = 0.8, STEP_U = 0.8, TURN_U = 1.1;  /* screens of scroll per phase */
let S = null;

function build() {
  cam.textContent = ""; foot.textContent = "";
  const VW = innerWidth, VH = innerHeight;
  const W = 0.58 * VW, n = 0.055 * VW;
  /* the opener */
  const op = el("div", "opener");
  const nav = el("nav", "nav");
  H.lines.forEach((L) => { const b = el("button", null, "<i></i>" + esc(L.name) + "<sup>" + L.studies.length + "</sup>"); b.type = "button"; b.style.setProperty("--c", L.color); b.dataset.line = L.tag; nav.appendChild(b); });
  op.appendChild(nav);
  const big = el("div", "big", "Reckon<br><i>*</i>House");
  big.style.fontSize = Math.min(0.29 * VH, (0.5 * VW - 100) / 3.55) + "px";
  op.appendChild(big);
  op.appendChild(el("p", "st", esc(H.statement.ink) + " <span>" + esc(H.statement.grey) + "</span>"));
  op.appendChild(el("div", "ways", H.links.map((l) => '<a href="' + esc(l.v) + '">' + esc(l.k) + "</a>").join("")));
  cam.appendChild(op);

  /* the strips */
  const ks = H.order.slice(0, N);
  const strips = ks.map((k, i) => {
    const s = H.studies[k];
    const st = el("div", "strip"); st.style.setProperty("--fill", s.fill); st.style.setProperty("--sink", s.ink); st.dataset.tags = s.tags.join(" ");
    const ph = fit(s, 0.56 * VH, W - 0.27 * VW);
    const wrap = el("div", "ph"); const pic = R.pic(s, ph.w, ph.h, { cur: "Open" }); pic.classList.add("playing"); wrap.appendChild(pic); st.appendChild(wrap);
    st.appendChild(el("div", "meta", s.y + " · " + esc(s.s)));
    const nm = el("h2", "nm", esc(s.t)); st.appendChild(nm);
    const nfs = Math.min(0.072 * VW, (W - 0.05 * VW) / Math.max(1, R.measureEm(s.t, 600, -0.055)));
    nm.style.fontSize = nfs + "px"; st.style.setProperty("--nmh", (nfs * 1.02) + "px");
    st.appendChild(el("div", "no", String(i + 1).padStart(2, "0")));
    const fact = el("div", "fact", esc(s.fact) + (s.rest ? " <span>" + esc(s.rest) + "</span>" : "")); fact.style.left = (0.034 * VW + ph.w + 0.03 * VW) + "px";
    const go = el("a", "go", "↗"); go.href = "/case-studies/" + s.h; fact.appendChild(el("br")); fact.appendChild(go);
    st.appendChild(fact);
    cam.appendChild(st);
    return { st, pic, s };
  });

  /* after the turn: the film strip, and the index beside it */
  const lower = el("div", "lower");
  const film = el("div", "film"), cols = [el("div", "col"), el("div", "col")];
  cols.forEach((c) => film.appendChild(c));
  const cw = (0.4 * VW - 0.024 * VW) / 2;
  H.order.forEach((k, i) => { const s = H.studies[k]; const p = fit(s, cw * s.nat[1] / s.nat[0], cw);
    const it = el("div", "it"); it.dataset.k = k; it.appendChild(R.pic(s, p.w, p.h)); it.appendChild(el("span", "cap", esc(s.t) + " <span>" + esc(s.s) + "</span>")); cols[i % 2].appendChild(it); });
  lower.appendChild(film);
  const side = el("div", "side");
  side.appendChild(el("p", "lbl", "All " + H.order.length + " studies"));
  H.lines.forEach((L) => { const d = el("div", "ln", "<span>" + esc(L.name) + "</span><sup>" + L.studies.length + "</sup>"); d.dataset.line = L.tag; side.appendChild(d); });
  const now = el("div", "now"); side.appendChild(now);
  lower.appendChild(side);
  cam.appendChild(lower);

  /* black, the ways in, and the wordmark rising */
  const top = el("div", "top");
  top.appendChild(el("div", null, '<span>Reckon*House</span><span class="g">' + H.practice.map(esc).join("<br>") + "</span>"));
  top.appendChild(el("div", null, '<span class="g">' + esc(H.book.lede) + "</span>"));
  top.appendChild(el("div", null, H.links.slice(2).map((l) => '<a href="' + esc(l.v) + '">' + esc(l.k) + "</a>").join("")));
  top.appendChild(el("div", null, '<a href="mailto:' + esc(H.email) + '">' + esc(H.email) + "</a>"));
  const pill = el("a", "pill", "<i></i>Book 30 minutes"); pill.href = "/book";
  foot.appendChild(pill); foot.appendChild(top);
  const word = el("div", "word", "Reckon*House"); word.dataset.rise = "letters"; foot.appendChild(word);

  /* the scroll each phase takes */
  const filmH = Math.max(cols[0].offsetHeight, cols[1].offsetHeight / 1.25);
  const turnLen = TURN_U * VH, filmLen = Math.max(0, filmH - VH * 0.72);
  const total = OPEN_U * VH + (N - 1) * STEP_U * VH + turnLen + filmLen;
  stage.style.height = (total + VH) + "px";
  S = { VW, VH, W, n, strips, op, lower, film, cols, side, now, total, turnLen, filmLen, ks };
  requestAnimationFrame(() => side.querySelectorAll(".ln").forEach((d) => d.style.setProperty("--w", Math.round(d.firstChild.getBoundingClientRect().width) + "px")));

  /* a line under the mark dims the strips not on it */
  nav.addEventListener("pointerover", (e) => { const b = e.target.closest("button"); if (!b) return; strips.forEach((x) => x.st.classList.toggle("dim", !x.st.dataset.tags.split(" ").includes(b.dataset.line))); });
  nav.addEventListener("pointerleave", () => strips.forEach((x) => x.st.classList.remove("dim")));
}

function layout(r) {
  if (!S || r.flat) return;
  const { VW, VH, W, n, strips } = S;
  const top = stage.getBoundingClientRect().top + scrollY;
  const y = clamp(r.y - top, 0, S.total);
  /* phase 0: the opener leaves and the strips take the glass */
  const k0 = R.ease(clamp(y / (OPEN_U * VH), 0, 1));
  const X0 = lerp(0.5 * VW, 0, k0);
  S.op.style.transform = "translate3d(" + (-k0 * 0.5 * VW) + "px,0,0)";
  /* phase 1: the strip at the reading line opens */
  const p = clamp((y - OPEN_U * VH) / (STEP_U * VH), 0, N - 1);
  const i0 = Math.min(N - 2, Math.floor(p)), f = p - i0;
  let x = X0 - (i0 > 0 ? 0 : 0);
  strips.forEach((o, i) => {
    let left, width;
    if (i < i0) { left = X0 - f * W - (i0 - i) * W; width = W; }
    else if (i === i0) { left = X0 - f * W; width = W; }
    else if (i === i0 + 1) { left = X0 - f * W + W; width = lerp(n, W, f); }
    else { left = null; width = n; }
    if (left == null) left = x;
    o.st.style.transform = "translate3d(" + left.toFixed(1) + "px,0,0)"; o.st.style.width = width.toFixed(1) + "px";
    x = left + width;
    const open = i === i0 ? 1 - f : i === i0 + 1 ? f : 0;
    const R0 = R.reel(o.pic); if (R0) { if (open > 0.9 && y < OPEN_U * VH + (N - 1) * STEP_U * VH + 10) R0.start(); else R0.stop(); }
  });
  /* phase 2: the turn. The row rises, the film strip comes up under it and
     runs on, and the index holds beside it */
  const y2 = y - (OPEN_U * VH + (N - 1) * STEP_U * VH);
  const camY = clamp(y2, 0, S.turnLen + S.filmLen);
  const turnK = R.ease(clamp(camY / S.turnLen, 0, 1));
  const liftAll = turnK * VH;
  strips.forEach((o) => { o.st.style.marginTop = (-liftAll).toFixed(1) + "px"; });
  S.op.style.marginTop = (-liftAll).toFixed(1) + "px";
  S.lower.style.transform = "translate3d(0," + (-liftAll).toFixed(1) + "px,0)";
  const filmY = clamp(camY - S.turnLen, 0, S.filmLen);
  /* the second column runs a little faster, so the strip has depth */
  S.cols[0].style.transform = "translate3d(0," + (-filmY).toFixed(1) + "px,0)";
  S.cols[1].style.transform = "translate3d(0," + (-filmY * 1.25).toFixed(1) + "px,0)";
  /* the study in the middle of the glass lights its lines */
  let mid = null, best = 1e9;
  S.film.querySelectorAll(".it").forEach((it) => { const b = it.getBoundingClientRect(); const d = Math.abs(b.top + b.height / 2 - VH / 2); if (d < best) { best = d; mid = it.dataset.k; } });
  if (mid && S.nowK !== mid) {
    S.nowK = mid; const s = H.studies[mid];
    S.side.querySelectorAll(".ln").forEach((d) => d.classList.toggle("here", s.tags.includes(d.dataset.line)));
    S.now.innerHTML = '<h3><span class="dot" style="--c:' + s.fill + '"></span>' + esc(s.t) + "</h3><p>" + esc(s.fact) + (s.rest ? " <span>" + esc(s.rest) + "</span>" : "") + "</p>";
  }
}

build();
R.start({ frame: layout, cursor: true });
let rt = 0; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { build(); R.frame(); }, 100); });
})();
</script>
</body>
</html>
