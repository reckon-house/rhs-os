<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Credits · six ways</title>
<link rel="stylesheet" href="field/base.css" />
<style>
  /* ── six credits blocks in a row, each on Info's own column ────────
     The board's Info column is 386px on a 1038 window, black, the
     statement register for prose and the note register for furniture.
     Each column here is that column from the "Worked with" line down,
     and only the thing named under its letter changes. The marks are
     the real files in /brands, inverted on black except DWR's, which
     already is. Haven has no mark and shows what the fallback is. */
  body { background: #e9e6e2; }
  .strip { display: flex; gap: 40px; padding: 60px 50px 80px; overflow-x: auto; align-items: flex-start; }
  .v { flex: none; width: 386px; }
  .v .tag { font-size: var(--note); letter-spacing: 0.04em; color: var(--grey); margin: 0 0 14px 17px; text-transform: uppercase; }
  .v .tag b { color: var(--ink); font-weight: 600; margin-right: 8px; }
  .col { height: 760px; overflow: hidden; padding: 60px 17px 60px; position: relative;
    background: #000; color: #fff; font-size: var(--stmt); font-weight: 600; line-height: 1.2; letter-spacing: -0.05em; }
  .g { color: rgba(255,255,255,0.5); }
  .csect { margin: 0 0 0.9em; }
  .hair { border-top: 1px solid rgba(255,255,255,0.28); }
  img.mk { display: block; width: 100%; height: 100%; object-fit: contain; }
  img.mk:not([src$="dwr.jpg"]) { filter: invert(1); }
  .word { display: grid; place-items: center; height: 100%; font-size: var(--note); letter-spacing: 0.04em; text-transform: uppercase; color: rgba(255,255,255,0.7); }

  /* ── A · one at a time, by an edge ──────────────────────────────── */
  .v-wipe .stage { height: 150px; border-top: 1px solid rgba(255,255,255,0.28); border-bottom: 1px solid rgba(255,255,255,0.28); position: relative; }
  .v-wipe .stage .cell { position: absolute; inset: 0; padding: 40px 56px; }
  .v-wipe .stage .cell.on { animation: wipe 2.6s cubic-bezier(0.2, 0.55, 0.2, 1) both; }
  @keyframes wipe {
    0%   { clip-path: inset(0 100% 0 0); }
    22%  { clip-path: inset(0 0 0 0); }
    78%  { clip-path: inset(0 0 0 0); }
    100% { clip-path: inset(0 0 0 100%); }
  }

  /* ── B · names, one lit ─────────────────────────────────────────── */
  .v-lit .run { color: rgba(255,255,255,0.32); }
  .v-lit .run .n { transition: color 0.45s ease; }
  .v-lit .run .n.on { color: #fff; }

  /* ── C · a grid, still ──────────────────────────────────────────── */
  /* marks hang from the cell's left edge, the way a caption does */
  .v-still img.mk { object-position: left center; }
  .v-still .word { justify-items: start; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid rgba(255,255,255,0.28); }
  .grid .cell { height: 84px; padding: 20px 22px; border-bottom: 1px solid rgba(255,255,255,0.28); }
  .grid .cell:nth-child(odd) { border-right: 1px solid rgba(255,255,255,0.28); }

  /* ── D · the grid, one lit ──────────────────────────────────────── */
  .v-glow .grid .cell { opacity: 0.3; transition: opacity 0.6s ease; }
  .v-glow .grid .cell.on { opacity: 1; }

  /* ── E · the grid, dealt ────────────────────────────────────────── */
  .v-deal .grid .cell { position: relative; }
  .v-deal .grid .cell > * { transition: opacity 0.45s ease, transform 0.55s cubic-bezier(0.2, 0.55, 0.2, 1); }
  .v-deal .grid .cell.out > * { opacity: 0; transform: translateY(-8px); }
  .v-deal .grid .cell.in > * { opacity: 0; transform: translateY(8px); transition: none; }

  /* ── F · the list, two columns ──────────────────────────────────── */
  .v-list .cols { display: grid; grid-template-columns: 1fr 1fr; column-gap: 20px; }
  .v-list .row { border-top: 1px solid rgba(255,255,255,0.28); padding: 11px 0 26px; font-size: var(--note); line-height: 1.35; letter-spacing: -0.004em; font-weight: 500; }
</style>
</head>
<body>
<div class="strip" id="strip"></div>
<script>
/* the board's own map, Haven included so the fallback shows */
const MARKS = { "Crate & Barrel": "/brands/crate-barrel.svg", "Nordstrom": "/brands/nordstrom.svg",
  "Ivy Park by Beyoncé": "/brands/ivy-park.svg", "Neiman Marcus": "/brands/neiman-marcus.svg",
  "Rejuvenation": "/brands/rejuvenation.png", "Lostine Home": "/brands/lostine.avif",
  "Visual Comfort": "/brands/visual-comfort.webp", "Floor & Decor": "/brands/floor-decor.svg",
  "Kingston Brass": "/brands/kingston-brass.webp", "Design Within Reach": "/brands/dwr.jpg",
  "Vivir Homes": "/brands/vivir-homes.webp" };
const NAMES = ["Crate & Barrel","Nordstrom","Ivy Park by Beyoncé","Neiman Marcus","Rejuvenation","Lostine Home",
  "Visual Comfort","Floor & Decor","Kingston Brass","Design Within Reach","Vivir Homes","Haven"];
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;

const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const mark = (name) => {
  if (MARKS[name]) { const i = el("img", "mk"); i.src = MARKS[name]; i.alt = name; return i; }
  return el("div", "word", name);
};
const VARIANTS = [
  ["A", "v-wipe", "one at a time, by an edge", "wiped in left to right, held, wiped out; never two"],
  ["B", "v-lit", "names, one lit", "the credits as a sentence, one name white at a time"],
  ["C", "v-still", "a grid, still", "two across, hairlines, no motion"],
  ["D", "v-glow", "the grid, one lit", "the wall at a third, one cell full at a time"],
  ["E", "v-deal", "the grid, dealt", "eight cells, eleven marks: a few re-deal every beat"],
  ["F", "v-list", "the list, two columns", "names as rows, the board's list grammar"],
];
const strip = document.getElementById("strip");
VARIANTS.forEach(([k, cls, name, what]) => {
  const v = el("div", "v");
  const tag = el("div", "tag"); tag.appendChild(el("b", null, k)); tag.appendChild(document.createTextNode(name + " · " + what));
  v.appendChild(tag);
  const col = el("div", "col " + cls);
  col.appendChild(el("div", "csect g", "Worked with, spotted by & featured in."));
  v.appendChild(col); strip.appendChild(v);
});

/* ── the six builders ─────────────────────────────────────────────── */
const build = {};

build["v-wipe"] = (col) => {
  const stage = el("div", "stage"); col.appendChild(stage);
  const withMarks = NAMES.filter((n) => MARKS[n]);
  let i = 0;
  const show = () => {
    stage.innerHTML = "";
    const cell = el("div", "cell"); cell.appendChild(mark(withMarks[i % withMarks.length]));
    stage.appendChild(cell);
    if (REDUCE) return;
    void cell.offsetWidth; cell.classList.add("on");
    cell.addEventListener("animationend", () => { i += 1; show(); }, { once: true });
  };
  show();
};

build["v-lit"] = (col) => {
  const run = el("div", "run"); col.appendChild(run);
  const spans = NAMES.map((n, i) => {
    const s = el("span", "n", n); run.appendChild(s);
    if (i < NAMES.length - 1) run.appendChild(document.createTextNode(", "));
    else run.appendChild(document.createTextNode("."));
    return s;
  });
  let i = 0;
  const step = () => { spans.forEach((s, k) => s.classList.toggle("on", k === i)); i = (i + 1) % spans.length; };
  step();
  if (!REDUCE) setInterval(step, 900);
};

const grid = (col, names) => {
  const g = el("div", "grid"); col.appendChild(g);
  return names.map((n) => { const c = el("div", "cell"); c.appendChild(mark(n)); g.appendChild(c); return c; });
};
build["v-still"] = (col) => { grid(col, NAMES); };

build["v-glow"] = (col) => {
  const cells = grid(col, NAMES);
  /* the order is dealt once, so the walk is not the reading order */
  const order = cells.map((c, i) => i).sort(() => Math.random() - 0.5);
  let i = 0;
  const step = () => { cells.forEach((c) => c.classList.remove("on")); cells[order[i]].classList.add("on"); i = (i + 1) % order.length; };
  step();
  if (!REDUCE) setInterval(step, 1100);
};

build["v-deal"] = (col) => {
  const withMarks = NAMES.filter((n) => MARKS[n]);   /* eleven */
  const SHOW = 8;
  let showing = withMarks.slice(0, SHOW), bench = withMarks.slice(SHOW);
  const cells = grid(col, showing);
  if (REDUCE) return;
  setInterval(() => {
    /* two cells go, two from the bench come; what left joins the bench */
    const picks = [];
    while (picks.length < 2) { const k = Math.floor(Math.random() * SHOW); if (!picks.includes(k)) picks.push(k); }
    picks.forEach((k, j) => {
      const cell = cells[k];
      cell.classList.add("out");
      setTimeout(() => {
        const leaving = showing[k]; const coming = bench.shift(); bench.push(leaving); showing[k] = coming;
        cell.innerHTML = ""; cell.appendChild(mark(coming));
        cell.classList.remove("out"); cell.classList.add("in");
        void cell.offsetWidth; cell.classList.remove("in");
      }, 480 + j * 120);
    });
  }, 2600);
};

build["v-list"] = (col) => {
  const wrap = el("div", "cols"); col.appendChild(wrap);
  const half = Math.ceil(NAMES.length / 2);
  [NAMES.slice(0, half), NAMES.slice(half)].forEach((side) => {
    const c = el("div"); side.forEach((n) => c.appendChild(el("div", "row", n))); wrap.appendChild(c);
  });
};

/* built after the builders exist */
document.querySelectorAll(".col").forEach((col) => {
  const cls = [...col.classList].find((c) => c.startsWith("v-"));
  if (!col.children[1]) build[cls](col);
});
</script>
</body>
</html>
