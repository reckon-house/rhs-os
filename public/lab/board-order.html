<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The board, in order</title>
<link rel="stylesheet" href="field/base.css" />
<style>
  /* ── where each picture is dealt, and in what order, by hand ───────
     The sweep sheet (board-sheet.html) decides WHAT the board deals.
     This decides WHERE. Two things, both written to
     scripts/lib/board-order.txt by Copy order:

     THE LINES A STUDY SITS ON — the grid at the top. Tick a line and
     the study is listed there (the head under that line's headline
     counts it, the rail counts it, the study's own bar names it). The
     first line, "deals on", is where its cover and any picture not
     placed by hand are dealt. ARC is an app, a site and a brand: three
     ticks.

     WHERE EACH PICTURE DEALS — the runs below. A picture sits on one
     line. Drag it to another run and it deals there, so ARC's phone
     can sit with Apps, its tablet with Digital and its mark with
     Branding. Drag within a run and the run re-orders.

     SWAP — on every card. Opens the study's own pictures, thumbed or
     not, so the one standing for the study on that line can be traded
     for a better one: a device in a room, a big single image. A picture
     with no thumb yet shows from its original and `npm run board`
     thumbs it once the file names it. The old one is held off.

     OFF THE FIELD — the last section. A study's pictures the cut left
     for its preview alone. Drag one into a run and it is dealt there
     (that is how a study gets a picture on every line it sits on when
     the cut left it none); drag a run's picture down here and it is
     held off the field, still in its preview. What you see here is
     worked out exactly as the board works it out, so what you drag is
     what it deals. `npm run board:page` reads the file; no thumbs are
     rebuilt. */
  body { background: #f3f1ee; padding: 0 0 80px; }
  .bar { position: sticky; top: 0; z-index: 5; background: #f3f1ee; border-bottom: 1px solid rgba(0,0,0,0.1);
    display: flex; gap: 18px; align-items: center; padding: 14px 28px; flex-wrap: wrap; }
  .bar h1 { font-size: var(--note); letter-spacing: 0.04em; text-transform: uppercase; margin: 0; font-weight: 600; }
  .bar .n { font-size: 12px; color: var(--grey); letter-spacing: 0.04em; }
  .bar button { font: inherit; font-size: 12px; letter-spacing: 0.02em; border: 0; background: rgba(0,0,0,0.06);
    border-radius: 10px; padding: 6px 12px; cursor: pointer; color: var(--ink); }
  .bar .sp { flex: 1; }
  .g { padding: 26px 28px 6px; }
  .g h2 { font-size: 15px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 12px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .g h2 span { font-size: 12px; font-weight: 400; color: var(--grey); letter-spacing: 0.04em; }
  .g h2 span.dirty { color: var(--ink); font-weight: 600; }
  /* the grid: a study to a row, a line to a column */
  table { border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 4px 14px 4px 0; border-bottom: 1px solid rgba(0,0,0,0.06); white-space: nowrap; }
  thead th { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--grey); font-weight: 500; padding-bottom: 8px; }
  tbody th { font-weight: 500; letter-spacing: -0.01em; padding-right: 22px; }
  tr.set th { font-weight: 700; }
  tbody th .sub { font-weight: 400; color: var(--grey); font-size: 11px; }
  td input { margin: 0; vertical-align: middle; cursor: pointer; }
  td select { font: inherit; font-size: 11px; border: 0; border-radius: 8px; padding: 2px 4px; background: rgba(0,0,0,0.06); cursor: pointer; }
  td.n { color: var(--grey); font-variant-numeric: tabular-nums; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; min-height: 60px; border-radius: 10px; }
  .row.over { box-shadow: inset 0 0 0 2px var(--ink); }
  figure { margin: 0; width: 150px; position: relative; border-radius: 8px; padding: 6px; background: #fff;
    border: 1px solid rgba(0,0,0,0.08); cursor: grab; transition: opacity 0.18s ease, transform 0.18s ease; }
  figure:active { cursor: grabbing; }
  figure img { display: block; width: 100%; height: 110px; object-fit: cover; background: #ece9e4; border-radius: 4px; pointer-events: none; }
  figcaption { font-size: 10px; line-height: 1.35; color: var(--grey); margin-top: 6px; letter-spacing: 0.01em; pointer-events: none; }
  figcaption b { display: block; color: var(--ink); font-weight: 500; }
  .num { position: absolute; left: 8px; top: 4px; z-index: 1; font-size: 9px; letter-spacing: 0.06em;
    color: var(--grey); font-variant-numeric: tabular-nums; }
  figure.cover { border-color: rgba(0,0,0,0.32); }
  figure.cover .num::after { content: " cover"; }
  figure.moved { border-color: var(--ink); }
  figure .swap { position: absolute; right: 6px; top: 6px; z-index: 2; font: inherit; font-size: 10px; letter-spacing: 0.04em;
    border: 0; border-radius: 8px; padding: 3px 7px; background: rgba(255,255,255,0.92); color: var(--ink); cursor: pointer; opacity: 0; }
  figure:hover .swap { opacity: 1; }
  figure.pseudo img { outline: 2px dashed rgba(0,0,0,0.25); outline-offset: -2px; }
  .picker { margin: 12px 0 6px; padding: 16px 18px 14px; background: #fff; border: 1px solid rgba(0,0,0,0.1); border-radius: 12px; }
  .picker h3 { margin: 0 0 10px; font-size: 13px; font-weight: 600; letter-spacing: -0.01em; display: flex; gap: 12px; align-items: baseline; }
  .picker h3 span { font-size: 11px; font-weight: 400; color: var(--grey); }
  .picker h3 button { margin-left: auto; font: inherit; font-size: 11px; border: 0; background: rgba(0,0,0,0.06); border-radius: 8px; padding: 4px 9px; cursor: pointer; }
  .picker .cands { display: flex; flex-wrap: wrap; gap: 8px; }
  .cand { width: 132px; padding: 5px; border-radius: 8px; border: 1px solid rgba(0,0,0,0.08); background: #fafaf8; cursor: pointer; }
  .cand:hover { border-color: var(--ink); }
  .cand.now { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
  .cand img { display: block; width: 100%; height: 92px; object-fit: cover; border-radius: 4px; background: #ece9e4; }
  .cand small { display: block; font-size: 9px; line-height: 1.3; color: var(--grey); margin-top: 4px; word-break: break-word; }
  .cand small b { color: var(--ink); font-weight: 500; }
  .cand.none { display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--grey); min-height: 92px; }
  figure.over { transform: translateX(6px); box-shadow: -3px 0 0 0 var(--ink); }
  td.n .gap { color: #b3261e; }
  section[data-run="off"] { background: rgba(0,0,0,0.035); border-radius: 14px; margin: 26px 28px 0; padding: 22px 28px 20px; }
  section[data-run="off"] figure { opacity: 0.78; }
  textarea { position: fixed; left: -9999px; top: 0; }
</style>
</head>
<body>
<div class="bar">
  <h1>The board, in order</h1>
  <span class="n" id="count"></span>
  <span class="sp"></span>
  <button id="copy">Copy order</button>
  <button id="reset">Reload the file</button>
</div>
<section class="g" id="lines">
  <h2>Where each study sits <span>tick a line to list the study there · "deals on" is where its cover and unplaced pictures go</span></h2>
  <table><thead id="mhead"></thead><tbody id="matrix"></tbody></table>
</section>
<div id="sheet"></div>
<textarea id="ta" aria-hidden="true"></textarea>
<script src="/lab/board-data.js"></script>
<script>
const KEY = "board-order";
const RUNS = [["open", "The opener"], ["digital", "Digital"], ["app", "Apps"],
  ["creative", "Campaigns"], ["branding", "Branding"], ["interiors", "Interiors"], ["staples", "Staples"],
  ["off", "Off the field"]];
const LINES = RUNS.filter(([t]) => t !== "open" && t !== "staples");
const labelOf = (t) => (RUNS.find(([x]) => x === t) || [t, t])[1];
/* the board's own rule for a home when none is set: the narrowest line */
const NARROW = ["app", "branding", "creative", "interiors", "digital"];
const OPENER = 6;
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const keyOf = (it) => it.k || it.t.replace(/^\/lab\/board-thumbs\//, "").replace(/\.webp$/, "");

/* every picture with a study, on the field or not: a cut plate is
   marked x and kept for the preview (see build-board-thumbs), and it
   is dealt after all if a run names it */
const onField = new Set((window.BOARD_ITEMS || []).filter((i) => !i.x).map((i) => keyOf(i)));
/* one item per thumb, the field's own first (Big Bend's hero is its
   cover and one of its plates) */
const items = (window.BOARD_ITEMS || []).filter((i) => !(i.x && onField.has(keyOf(i))));
/* every picture a study uses, with its role, from npm run board:roles;
   the picker offers these whether or not the board has a thumb */
let ROLES = {};
fetch("/lab/board-roles.json").then((r) => (r.ok ? r.json() : {})).catch(() => ({})).then((j) => {
  ROLES = (j && j.roles) || {};
  /* a pseudo item made before the roles arrived guessed its extension;
     now it can know */
  let fixed = 0;
  for (const it of items) if (it.pseudo) { const f = fileFor(it.k); if (f && it.t !== "/case-studies/" + f) { it.t = "/case-studies/" + f; fixed += 1; } }
  if (fixed) draw();
});
const fileFor = (key) => Object.keys(ROLES).find((k) => !/\/\._/.test(k) && k.replace(/\.[^.]+$/, "") === key);
const filesOf = (folder) => Object.keys(ROLES)
  /* the volume is exFAT and macOS leaves a ._ fork beside every file;
     the roles walk sees them, the picker must not */
  .filter((k) => k.startsWith(folder + "/") && !/\/\._/.test(k) && /\.(jpe?g|png|webp)$/i.test(k) && !/-2x\.[^.]+$/.test(k) && !/\/reel\//.test(k))
  .map((k) => ({ file: k, key: k.replace(/\.[^.]+$/, ""), role: ROLES[k] }));
/* a picture named in a run before the board has thumbed it shows from
   its original; the next npm run board makes the thumb */
const pseudo = (key) => {
  const file = fileFor(key);
  return { t: "/case-studies/" + (file || key + ".jpg"), k: key, g: key.split("/")[0], w: 0, h: 0, x: 1, pseudo: true };
};
const itemFor = (key) => items.find((it) => keyOf(it) === key) || (() => { const p = pseudo(key); items.push(p); return p; })();
const GROUPS = window.BOARD_GROUPS || {};
const studies = Object.keys(GROUPS).filter((k) => items.some((i) => i.g === k));
const native = (k) => ((GROUPS[k] || {}).tags || []).filter((t) => LINES.some(([l]) => l === t));
const linesOf = (k) => homes[k] || native(k);
const homeOf = (k) => (homes[k] && homes[k][0]) || NARROW.find((t) => native(k).includes(t)) || "digital";

/* ── the deal, worked out the way the board works it out ─────────── */
const covers = items.filter((i) => i.c != null && !i.x).sort((a, b) => a.c - b.c);
const seat = (k) => { const c = covers.find((i) => i.g === k); return c ? c.c : 1e6; };
const dealt = {}, placeIs = {};
const applyOrder = (list, rank) => {
  if (!rank || !rank.length) return list.slice();
  const at = new Map(rank.map((k, i) => [k, i]));
  return list.map((it, i) => [it, at.has(keyOf(it)) ? at.get(keyOf(it)) : rank.length + i])
    .sort((a, b) => a[1] - b[1]).map(([it]) => it);
};
function deal() {
  const PLACE = new Map();
  for (const [run, keys] of Object.entries(state)) {
    if (run === "off") continue;
    for (const key of keys || []) if (!PLACE.has(key)) PLACE.set(key, run);
  }
  const OFF = new Set(state.off || []);
  for (const key of PLACE.keys()) itemFor(key);
  /* on the field: named under a run, or not cut and not held off */
  const field = items.filter((it) => PLACE.has(keyOf(it)) || (!it.x && !OFF.has(keyOf(it))));
  const opener = [];
  for (const it of covers) if (PLACE.get(keyOf(it)) === "open") opener.push(it);
  for (const it of covers) { if (opener.length >= OPENER) break; if (!PLACE.has(keyOf(it)) && !OFF.has(keyOf(it))) opener.push(it); }
  const openerKeys = new Set(opener.map(keyOf));
  const placeOf = (it) => PLACE.get(keyOf(it))
    || (it.g === "inspiration" ? "staples" : !GROUPS[it.g] ? null
      : openerKeys.has(keyOf(it)) ? "open" : homeOf(it.g));
  for (const it of items) placeIs[keyOf(it)] = PLACE.has(keyOf(it)) || OFF.has(keyOf(it));
  for (const [tag] of RUNS) {
    if (tag === "off") {
      dealt.off = items.filter((it) => GROUPS[it.g] && !field.includes(it))
        .sort((a, b) => seat(a.g) - seat(b.g));
      continue;
    }
    const run = field.filter((it) => placeOf(it) === tag);
    if (tag !== "staples")
      run.sort((a, b) => (seat(a.g) - seat(b.g)) || ((a.c != null ? 0 : 1) - (b.c != null ? 0 : 1)));
    dealt[tag] = applyOrder(run, state[tag]);
  }
}

/* an authored order, from this browser or from the repo's own file */
const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { return null; } };
const save = (o) => { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} };

/* the repo's own order, written beside the board by the assembler, so
   this page opens on what the board is dealing rather than on nothing.
   Work in progress in this browser sits over it until it is pasted
   into the file, or dropped with "Reload the file". */
let state = {}, homes = {}, fileState = null;
const fromFile = () => {
  state = JSON.parse(JSON.stringify((fileState && fileState.order) || {}));
  homes = JSON.parse(JSON.stringify((fileState && fileState.homes) || {}));
};
fetch("/lab/board-order.json")
  .then((r) => (r.ok ? r.json() : {}))
  .catch(() => ({}))
  .then((repo) => {
    fileState = repo;
    const mine = load();
    if (mine) { state = mine.order || {}; homes = mine.homes || {}; }
    else fromFile();
    /* an older sheet wrote a single line; a list is what it means now */
    for (const k of Object.keys(homes)) if (!Array.isArray(homes[k])) homes[k] = [homes[k]];
    deal(); draw();
  });

/* ── the grid ────────────────────────────────────────────────────── */
function setLines(k, lines, home) {
  const ordered = [home, ...NARROW.filter((t) => t !== home && lines.includes(t))];
  const nat = native(k), natHome = NARROW.find((t) => nat.includes(t)) || "digital";
  const same = ordered.length === nat.length && ordered.every((t) => nat.includes(t)) && home === natHome;
  if (same) delete homes[k]; else homes[k] = ordered;
  /* a picture placed on a line the study has just left goes home */
  for (const [run] of LINES) if (!ordered.includes(run) && state[run])
    state[run] = state[run].filter((key) => !items.some((it) => keyOf(it) === key && it.g === k));
  save({ order: state, homes }); deal(); draw();
}
function drawMatrix() {
  const head = document.getElementById("mhead"), body = document.getElementById("matrix");
  head.innerHTML = ""; body.innerHTML = "";
  const tr = el("tr"); tr.appendChild(el("th", null, "Study")); tr.appendChild(el("th", null, "Deals on"));
  for (const [, l] of LINES) tr.appendChild(el("th", null, l));
  tr.appendChild(el("th", null, "Pictures"));
  head.appendChild(tr);
  for (const k of studies.slice().sort((a, b) => seat(a) - seat(b))) {
    const row = el("tr", homes[k] ? "set" : null);
    const th = el("th", null, GROUPS[k].t);
    /* three Hill Country rooms share a title; the study's own line tells them apart */
    if (GROUPS[k].s) th.appendChild(el("span", "sub", " " + GROUPS[k].s));
    row.appendChild(th);
    const td0 = el("td"); const sel = document.createElement("select");
    for (const t of linesOf(k)) { const o = document.createElement("option"); o.value = t; o.textContent = labelOf(t); o.selected = t === homeOf(k); sel.appendChild(o); }
    sel.addEventListener("change", () => setLines(k, linesOf(k), sel.value));
    td0.appendChild(sel); row.appendChild(td0);
    for (const [t] of LINES) {
      const td = el("td"); const cb = document.createElement("input"); cb.type = "checkbox";
      cb.checked = linesOf(k).includes(t);
      cb.addEventListener("change", () => {
        const cur = linesOf(k).slice();
        const next = cb.checked ? [...cur, t] : cur.filter((x) => x !== t);
        if (!next.length) { cb.checked = true; return; }
        setLines(k, next, next.includes(homeOf(k)) ? homeOf(k) : NARROW.find((x) => next.includes(x)));
      });
      td.appendChild(cb); row.appendChild(td);
    }
    /* where its pictures actually are, and any line it sits on
       with nothing to show there */
    const td = el("td", "n");
    const where = LINES.concat([["open", "opener"]]).map(([t, l]) => [dealt[t].filter((it) => it.g === k).length, l])
      .filter(([n]) => n).map(([n, l]) => n + " " + l).join(" · ");
    td.appendChild(document.createTextNode(where));
    const gaps = linesOf(k).filter((t) => !dealt[t].some((it) => it.g === k));
    if (gaps.length) td.appendChild(el("span", "gap", (where ? " · " : "") + "none on " + gaps.map(labelOf).join(", ")));
    row.appendChild(td);
    body.appendChild(row);
  }
}

/* ── the runs ────────────────────────────────────────────────────── */
const sheet = document.getElementById("sheet");
function draw() {
  drawMatrix();
  sheet.innerHTML = "";
  for (const [tag, label] of RUNS) {
    const list = dealt[tag];
    const sec = el("section", "g"); sec.dataset.run = tag;
    const h = el("h2", null, label);
    h.appendChild(el("span", null, list.length + (list.length === 1 ? " picture" : " pictures")));
    if (tag === "off") h.appendChild(el("span", null, "drag one into a run to deal it; drag a run's picture here to hold it off"));
    else if (state[tag] && state[tag].length) h.appendChild(el("span", "dirty", " · set by hand"));
    sec.appendChild(h);
    const row = el("div", "row");
    list.forEach((it, i) => {
      const g = GROUPS[it.g];
      const f = el("figure"); f.draggable = true; f.dataset.key = keyOf(it);
      if (it.c != null) f.classList.add("cover");
      if (placeIs[keyOf(it)]) f.classList.add("moved");
      if (it.pseudo) f.classList.add("pseudo");
      f.appendChild(el("span", "num", String(i + 1)));
      if (tag !== "staples" && tag !== "off" && GROUPS[it.g]) {
        const sw = el("button", "swap", "swap"); sw.type = "button";
        sw.addEventListener("click", (e) => { e.stopPropagation(); openPicker(sec, tag, it); });
        f.appendChild(sw);
      }
      const im = el("img"); im.loading = "lazy"; im.alt = "";
      im.src = it.pseudo ? it.t : (it.r && it.r.includes(384)) ? it.t.replace(/\.webp$/, "@384.webp") : it.t;
      f.appendChild(im);
      const cap = el("figcaption");
      cap.appendChild(el("b", null, g ? g.t : it.g));
      cap.appendChild(document.createTextNode(keyOf(it).split("/").pop().replace(new RegExp("^" + it.g + "-"), "")));
      f.appendChild(cap);
      row.appendChild(f);
    });
    sec.appendChild(row); sheet.appendChild(sec);
  }
  count();
}

/* ── swap: the study's pictures for this line ─────────────────────── */
function openPicker(sec, run, cur) {
  sec.querySelectorAll(".picker").forEach((p) => p.remove());
  const k = cur.g, curKey = keyOf(cur);
  const box = el("div", "picker");
  const h = el("h3", null, GROUPS[k].t + " on " + labelOf(run));
  h.appendChild(el("span", null, "pick the picture that stands for it here"));
  const x = el("button", null, "Close"); x.addEventListener("click", () => box.remove()); h.appendChild(x);
  box.appendChild(h);
  const cands = el("div", "cands");
  /* where each of the study's pictures is right now */
  const at = {};
  for (const [t] of RUNS) for (const it of dealt[t] || []) if (it.g === k && t !== "off") at[keyOf(it)] = t;
  const list = filesOf(k);
  /* the study's field pictures the roles file does not list (a cover under hp/) */
  for (const it of items) if (it.g === k && !list.some((c) => c.key === keyOf(it)))
    list.push({ file: it.t, key: keyOf(it), role: it.c != null ? "cover" : "" });
  for (const c of list) {
    const d = el("div", "cand" + (c.key === curKey ? " now" : ""));
    const it = items.find((i) => keyOf(i) === c.key);
    const im = el("img"); im.loading = "lazy"; im.alt = "";
    im.src = it && !it.pseudo ? ((it.r && it.r.includes(384)) ? it.t.replace(/\.webp$/, "@384.webp") : it.t) : "/case-studies/" + c.file;
    d.appendChild(im);
    const s = el("small");
    s.appendChild(el("b", null, (c.role || "") + (at[c.key] ? (c.role ? " · " : "") + "on " + labelOf(at[c.key]) : "")));
    s.appendChild(document.createTextNode((c.role || at[c.key] ? " " : "") + c.key.split("/").slice(1).join("/").replace(new RegExp("^" + k + "-"), "")));
    d.appendChild(s);
    d.addEventListener("click", () => { if (c.key !== curKey) swap(run, curKey, c.key); box.remove(); });
    cands.appendChild(d);
  }
  const none = el("div", "cand none", "none · hold it off");
  none.addEventListener("click", () => { swap(run, curKey, null); box.remove(); });
  cands.appendChild(none);
  box.appendChild(cands);
  sec.insertBefore(box, sec.querySelector(".row"));
  box.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function swap(run, oldKey, newKey) {
  if (!state[run] || !state[run].length) state[run] = dealt[run].map(keyOf);
  const oldIt = items.find((i) => keyOf(i) === oldKey);
  const i = state[run].indexOf(oldKey);
  if (newKey) {
    for (const r of Object.keys(state)) if (r !== "off") state[r] = (state[r] || []).filter((x) => x !== newKey);
    if (i >= 0) state[run].splice(i, 0, newKey); else state[run].push(newKey);
    state[run] = state[run].filter((x) => x !== oldKey);
    if (state.off) state.off = state.off.filter((x) => x !== newKey);
    itemFor(newKey);
  } else state[run] = state[run].filter((x) => x !== oldKey);
  /* the old one leaves the board: a field picture is held off, a cut
     plate is off by itself once unnamed */
  dropOff(oldKey, oldIt);
  save({ order: state, homes }); deal(); draw();
}

let dragging = null;
const runOf = (node) => { const s = node && node.closest("section[data-run]"); return s ? s : null; };
sheet.addEventListener("dragstart", (e) => {
  const f = e.target.closest("figure"); if (!f) return;
  dragging = f; f.classList.add("drag");
  e.dataTransfer.effectAllowed = "move";
  try { e.dataTransfer.setData("text/plain", f.dataset.key); } catch (err) {}
});
sheet.addEventListener("dragend", () => {
  if (dragging) dragging.classList.remove("drag");
  sheet.querySelectorAll(".over").forEach((x) => x.classList.remove("over"));
  dragging = null;
});
/* a pull is a pull and a study's picture is a study's picture: the
   two do not cross, and everything else can go anywhere */
const mayDrop = (from, to) => from && to && ((from.dataset.run === "staples") === (to.dataset.run === "staples"));
const dropOff = (key, it) => {
  for (const run of Object.keys(state)) if (run !== "off") state[run] = (state[run] || []).filter((k) => k !== key);
  /* a cut plate is off by itself; only a field picture needs holding */
  if (it && !it.x) state.off = [...new Set([...(state.off || []), key])];
  else if (state.off) state.off = state.off.filter((k) => k !== key);
};
sheet.addEventListener("dragover", (e) => {
  if (!dragging) return;
  const to = runOf(e.target); if (!mayDrop(runOf(dragging), to)) return;
  e.preventDefault();
  const f = e.target.closest("figure");
  sheet.querySelectorAll(".over").forEach((x) => x.classList.remove("over"));
  (f && f !== dragging ? f : to.querySelector(".row")).classList.add("over");
});
sheet.addEventListener("drop", (e) => {
  if (!dragging) return;
  const from = runOf(dragging), to = runOf(e.target); if (!mayDrop(from, to)) return;
  e.preventDefault();
  const f = e.target.closest("figure"), row = to.querySelector(".row");
  if (f && f !== dragging) {
    const all = [...row.children];
    row.insertBefore(dragging, from === to && all.indexOf(dragging) < all.indexOf(f) ? f.nextSibling : f);
  } else if (!f) row.appendChild(dragging);
  else return;
  const key = dragging.dataset.key, it = items.find((x) => keyOf(x) === key);
  if (to.dataset.run === "off") dropOff(key, it);
  else {
    state[to.dataset.run] = [...row.children].map((x) => x.dataset.key);
    if (from !== to && state[from.dataset.run])
      state[from.dataset.run] = state[from.dataset.run].filter((k) => k !== key);
    if (state.off) state.off = state.off.filter((k) => k !== key);
  }
  save({ order: state, homes });
  deal(); draw();
});
function count() {
  const set = RUNS.filter(([t]) => t !== "off" && state[t] && state[t].length).map(([, l]) => l);
  const moved = Object.keys(homes).length, held = (state.off || []).length;
  /* what the board deals, which is every picture with a study; a
     picture in a folder no study claims is thumbed but never dealt */
  const n = RUNS.reduce((a, [t]) => a + (t === "off" ? 0 : (dealt[t] || []).length), 0);
  const same = fileState && JSON.stringify({ o: state, h: homes }) === JSON.stringify({ o: fileState.order || {}, h: fileState.homes || {} });
  document.getElementById("count").textContent =
    (same ? "" : "unsaved here · ") + n + " pictures · " + (set.length ? set.join(", ") + " set by hand" : "all in the deal's order")
    + (moved ? " · " + moved + (moved === 1 ? " study re-lined" : " studies re-lined") : "")
    + (held ? " · " + held + " held off" : "");
}
document.getElementById("reset").addEventListener("click", () => {
  /* drop this browser's work and show what the file deals */
  try { localStorage.removeItem(KEY); } catch (e) {}
  fromFile(); deal(); draw();
});
document.getElementById("copy").addEventListener("click", async (e) => {
  /* held before the await: currentTarget is null once the handler
     yields, which is the whole of this listener */
  const b = e.currentTarget;
  const out = [];
  for (const [tag, label] of RUNS) {
    if (!state[tag] || !state[tag].length) continue;
    out.push("# " + tag + "   (" + label + ")");
    out.push(...(tag === "off" ? state.off : dealt[tag].map(keyOf)));
    out.push("");
  }
  const lined = Object.entries(homes);
  if (lined.length) {
    out.push("# homes");
    for (const [k, lines] of lined) out.push(k + " = " + lines.join(", "));
    out.push("");
  }
  const text = out.join("\n");
  try { await navigator.clipboard.writeText(text); }
  catch (err) { const ta = document.getElementById("ta"); ta.value = text; ta.select(); document.execCommand("copy"); }
  b.textContent = "Copied " + out.filter((l) => l && !l.startsWith("#")).length;
  setTimeout(() => { b.textContent = "Copy order"; }, 1500);
});
</script>
