<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sally demo — Jim, agentic turn</title>
<link rel="stylesheet" href="sally-demo.css">
<style>
  /* lab-only page chrome — the RHS page provides its own ground */
  body { margin: 0; padding: 48px 20px; background: #f4f0ea; }
</style>
</head>
<body>

<div class="sd-demo" id="jimDemo">
  <div class="sd-window">
    <div class="sd-titlebar">
      <span class="sd-dot"></span><span class="sd-dot"></span><span class="sd-dot"></span>
      <span class="sd-title"><strong>Sally Marketing Portal</strong> · Jim</span>
    </div>
    <div class="sd-body">
      <div class="sd-rail" aria-hidden="true">
        <span class="on"><svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.6L20 10l-6.1 1.4L12 17l-1.9-5.6L4 10l6.1-1.4z"/></svg></span>
        <span><svg viewBox="0 0 24 24"><path d="M4 17l5-6 4 3 7-8"/></svg></span>
        <span><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 15l5-4 4 3 3-2 4 3"/></svg></span>
        <span><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg></span>
        <span><svg viewBox="0 0 24 24"><path d="M12 4l8 4-8 4-8-4z"/><path d="M4 12l8 4 8-4"/><path d="M4 16l8 4 8-4"/></svg></span>
      </div>

      <div class="jc-main" data-stage>
        <div class="jc-head">
          <span class="jc-avatar">J</span>
          <div>
            <div class="jc-head-name">Jim</div>
            <div class="jc-head-sub">AI strategy partner</div>
          </div>
          <span class="jc-live"></span>
        </div>

        <div class="jc-chat"></div>

        <div class="jc-dock">
          <div class="jc-input">
            <span class="jc-clip"><svg viewBox="0 0 24 24"><path d="M20 11.5l-7.8 7.8a5 5 0 01-7-7l8.5-8.5a3.3 3.3 0 014.7 4.7l-8.5 8.5a1.7 1.7 0 01-2.4-2.4l7.8-7.8"/></svg></span>
            <span class="jc-input-text"></span>
            <span class="jc-send"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <p class="sd-caption">Scripted replay of a real Jim workflow — all data staged for demo.</p>
</div>

<script src="sally-demo-kit.js"></script>
<script>
new SallyDemo(document.getElementById("jimDemo"), async function (t) {
  var MSG = "What are customers saying about bond repair — and do we have assets to act on it?";

  var chat = t.$(".jc-chat");
  var input = t.$(".jc-input-text");
  t.scrollEl = chat;

  // 1 — the question types itself
  await t.wait(900);
  await t.type(input, MSG, 32);
  await t.wait(260);
  await t.press(t.$(".jc-send"));

  // 2 — it lands in the thread
  input.textContent = "";
  var user = t.el("div", "jc-msg jc-user", MSG);
  chat.appendChild(user);
  t.reveal(user);
  await t.wait(550);

  // 3 — Jim thinks
  var think = t.el("div", "jc-think");
  think.appendChild(t.el("i")); think.appendChild(t.el("i")); think.appendChild(t.el("i"));
  chat.appendChild(think);
  t.reveal(think);
  await t.wait(1050);
  think.remove();

  // 4 — tool calls fire, one by one
  var chips = t.el("div", "jc-chips");
  chat.appendChild(chips);

  var c1 = t.chip(chips, "search_customer_insights", "“bond repair”");
  await t.wait(1000);
  c1.resolve("142 mentions · 78% positive");
  await t.wait(430);

  var c2 = t.chip(chips, "get_signal_history", "“bond repair”");
  await t.wait(950);
  c2.resolve("recurring 11 weeks · never actioned");
  await t.wait(430);

  var c3 = t.chip(chips, "search_dam", "“bond repair”");
  await t.wait(900);
  c3.resolve("3 assets · campaign-ready");
  await t.wait(550);

  // 5 — the answer streams in
  var jim = t.el("div", "jc-msg jc-jim");
  chat.appendChild(jim);
  t.reveal(jim);
  await t.stream(jim, [
    "Bond repair is the strongest unanswered signal on the board. **142 mentions** in the last 90 days, **78% positive** — the recurring story is damage from repeat bleaching, and shoppers name bond-building as the fix they want.",
    "It has trended **11 straight weeks** without a play citing it. The DAM already holds **3 tagged assets** — enough for an email + social test with zero new production.",
    "Want me to draft the play?"
  ], 24);
  await t.wait(420);

  // 6 — and proposes the action
  var card = t.el("div", "jc-card");
  card.appendChild(t.el("div", "jc-card-eyebrow", "PROPOSED PLAY"));
  card.appendChild(t.el("div", "jc-card-title", "Bond Repair — email + social test"));
  card.appendChild(t.el("div", "jc-card-meta", "3 DAM assets · 2 channels · ready to brief"));
  card.appendChild(t.el("span", "jc-card-btn", "Draft it →"));
  chat.appendChild(card);
  t.reveal(card);

  await t.wait(1200);
});
</script>

</body>
</html>
