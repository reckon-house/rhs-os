<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sally Marketing OS · a live demo on a photographed laptop</title>
<meta name="robots" content="noindex">
<!-- A live demo on one of his photographed laptops (3 Oct 2026, Jeremy:
     "here are two mockups we can use...maybe on some of the sally os screen
     we just made fake mockups?"). ?shot=console (the record console) or
     ?shot=oak (the oak desk), and ?demo= any replay in this folder. His
     photographs are cropped in close around the laptop, near square (his
     "let's crop in tighter here so the screen is visible - it's kinda tiny
     now. we can make the image taller if needed too!"; the first crops
     were wide, 2048 by 1720, and the screen was under half the width); the
     screen's four corners were measured off each one (every edge fitted
     where its brightness falls halfway to the bezel's, then crossed), and
     ../device.js maps the demo onto them. The demo opens with fill=1, so its
     window fills a viewport sized to the screen's own proportion (both
     screens are within a percent of the portal window's), and the notch is
     drawn back on top. The room's pause (data-paused on this page) is
     handed to the demo's host, the element its engine reads. -->
<style>
  html, body { margin: 0; background: transparent; }
  .dev { position: relative; overflow: hidden; border-radius: 4px; background: #CEC6BF; }
  .dev > img { display: block; width: 100%; height: auto; }
  .glass { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  /* a black ground just past the screen's edge, so no seam ever shows the photo's blank screen */
  .under { position: absolute; inset: -3px; border-radius: 17px 17px 3px 3px; background: #0C0C0D; }
  .screen { position: absolute; inset: 0; overflow: hidden; border-radius: 14px 14px 0 0; background: #fff; }
  .screen iframe { display: block; border: 0; pointer-events: none; }
  /* the glass: a faint sheen and the bezel's soft edge */
  .screen::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(120deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0) 40%);
    box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.22); }
  .notch { position: absolute; background: #0B0B0C; }
</style>
</head>
<body>
<div class="dev" id="dev">
  <img id="photo" alt="" width="1388" height="1480">
  <div class="glass" id="glass">
    <i class="under" aria-hidden="true"></i>
    <div class="screen"><iframe id="page" tabindex="-1" aria-hidden="true"></iframe></div>
  </div>
  <i class="notch" id="notch" aria-hidden="true"></i>
</div>
<script src="../device.js"></script>
<script>
(() => {
  /* measured off his originals (2048 by 3072) and given here in the crop's
     own pixels (1388 by 1480, cut at x 330, y 940), TL TR BR BL */
  const SHOTS = {
    console: {
      src: "/case-studies/sally-os/sally-os-mockup-laptop-record-console.jpg",
      alt: "on a laptop standing on a walnut record console",
      corners: [[200.4, 249.0], [1189.5, 249.2], [1186.1, 917.4], [198.9, 917.6]],
      notch: { x: 636, y: 248, w: 120, h: 22, r: 6 },
    },
    oak: {
      src: "/case-studies/sally-os/sally-os-mockup-laptop-oak-desk.jpg",
      alt: "on a laptop on an oak desk",
      corners: [[201.4, 254.1], [1189.0, 254.7], [1187.7, 931.1], [198.7, 932.2]],
      notch: { x: 636, y: 253, w: 119, h: 22, r: 6 },
    },
  };
  const q = new URLSearchParams(location.search);
  const S = SHOTS[q.get("shot")] || SHOTS.console;
  const demo = (q.get("demo") || "trends-page").replace(/[^a-z0-9-]/g, "");
  const dist = (p, r) => Math.hypot(p[0] - r[0], p[1] - r[1]);
  const c = S.corners, aspect = (dist(c[0], c[1]) + dist(c[3], c[2])) / (dist(c[0], c[3]) + dist(c[1], c[2]));
  const VW = 1120, VH = Math.round(VW / aspect);
  const photo = document.getElementById("photo"), glass = document.getElementById("glass"), frame = document.getElementById("page");
  photo.src = S.src; photo.alt = "The Sally Marketing OS " + S.alt;
  glass.style.width = VW + "px"; glass.style.height = VH + "px";
  frame.style.width = VW + "px"; frame.style.height = VH + "px";
  frame.title = "A Sally Marketing OS demo";
  Device.place({
    box: document.getElementById("dev"), glass, photoW: 1388, view: [VW, VH], corners: c,
    marks: [{ el: document.getElementById("notch"), x: S.notch.x, y: S.notch.y, w: S.notch.w, h: S.notch.h, r: S.notch.r, round: "bottom" }],
  });
  frame.src = demo + ".html?framed=1&fill=1";
  /* the room pauses this page; the demo's engine reads data-paused on its host */
  const root = document.documentElement;
  const host = () => { try { const d = frame.contentDocument, st = d && d.querySelector("[data-stage]"); return st ? st.closest("body > *") : null; } catch (e) { return null; } };
  const sync = () => { const h = host(); if (!h) return; if (root.dataset.paused) h.dataset.paused = "true"; else delete h.dataset.paused; };
  new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ["data-paused"] });
  frame.addEventListener("load", sync);
})();
</script>
</body>
</html>
