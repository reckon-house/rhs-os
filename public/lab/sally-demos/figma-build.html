<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sally demo — Jim → Figma, batch build</title>
<link rel="stylesheet" href="sally-demo.css">
<link rel="stylesheet" href="sally-portal-chrome.css">
<link rel="stylesheet" href="sally-figma-plugin.css">
<style>
  body { margin: 0; padding: 48px 20px; background: #f4f0ea; }
</style>
</head>
<body>

<div id="figDemo">
  <!-- data-stage wraps BOTH the canvas and the panel: the kit scopes t.$()
       to the stage and restores its innerHTML on each loop, so anything the
       script writes to must live inside it. -->
  <div class="fg-frame" data-stage>

    <!-- canvas: neutral work surface, NOT a clone of Figma's UI -->
    <div class="fg-canvas">
      <div class="fg-canvas-label">Sally · CRM 2026 — August</div>
      <div class="fg-boards"></div>
    </div>

    <!-- the Sally OS plugin panel — the product's own design -->
    <aside class="fg-plugin">
      <div class="header">
        <div class="header-logo">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3l2.1 6.2L20 10.5l-5.9 1.3L12 18l-2.1-6.2L4 10.5l5.9-1.3z" fill="#fff"/></svg>
        </div>
        <div class="header-title">Sally OS</div>
        <div class="header-sub">v2.4</div>
      </div>

      <div class="url-bar">
        <input value="August 2026 · CRM / Email" readonly>
        <span class="btn-load">Load</span>
      </div>

      <div class="scroll-area">
        <div class="build-all-bar">
          <button class="btn-build-all" id="fgBuildBtn">✦ Build all visible (CRM)</button>
          <div class="build-all-sub" id="fgBuildSub">
            <strong>4</strong> ready to build · 1 skipped (no copy yet)
          </div>
          <div class="build-all-progress" id="fgProgress"></div>
        </div>

        <div class="section-label">Requests · 5</div>
        <div id="fgCards"></div>
      </div>
    </aside>

  </div>
  <p class="sp-caption">Live replay of the Sally OS Figma plugin — panel reproduced from the plugin's own interface code, progress lines verbatim from its build log. The artboards render the real generated email.</p>
</div>

<script src="sally-demo-kit.js"></script>
<script>
new SallyDemo(document.getElementById("figDemo"), async function (t) {
  var boards = t.$(".fg-boards");
  var prog   = t.$("#fgProgress");
  var cards  = t.$("#fgCards");

  // The four requests the plugin would batch-build. Names + eyebrows are the
  // campaign's real August story lines; heroes are real DAM shots — so the four
  // artboards read as four different emails rather than one repeated.
  var REQS = [
    { name: "Your best hair color. No salon required.", type: "Multicategory", status: "submitted",
      eyebrow: "COLORFEST", headline: "Your boldest color starts right here",
      hero: "assets/em-hero.jpg" },
    { name: "Keep your color looking vibrant & healthy.", type: "Single Category", status: "submitted",
      eyebrow: "COLOR CARE", headline: "Keep every shade vivid for longer",
      hero: "assets/lifestyle-teal.jpg" },
    { name: "COLORfest — A celebration of hair & nails", type: "Promo", status: "submitted",
      eyebrow: "COLORFEST", headline: "A celebration of hair & nails",
      hero: "assets/lifestyle-bixie.jpg" },
    // Expert keeps the red-lip shot: her manicured hand is up by her face,
    // which is the right frame for the nails story.
    { name: "Easy salon-quality nails. No salon required.", type: "Expert", status: "submitted",
      eyebrow: "SALLY EXPERT", headline: "Salon-quality nails, minus the salon",
      hero: "assets/lifestyle-hero.jpg" }
  ];

  // The real generated email — same fragment the Requests demo renders,
  // produced by sally-portal/email_components.py.
  var emailHTML = await fetch("assets/email-multicategory.html")
    .then(function (r) { return r.text(); });

  function logLine(html) {
    var d = t.el("div");
    d.innerHTML = html;
    prog.appendChild(d);
    prog.scrollTop = prog.scrollHeight;
    return d;
  }

  // ---- panel fills with the request cards ----
  for (var i = 0; i < REQS.length; i++) {
    var c = t.el("div", "request-card");
    c.innerHTML =
      '<div class="request-header">' +
        '<div class="request-name">' + REQS[i].name + '</div>' +
        '<span class="status-chip ' + REQS[i].status + '">' + REQS[i].status + '</span>' +
      '</div>' +
      '<div class="request-meta">' +
        '<span class="meta-pill">CRM / Email</span>' +
        '<span class="meta-pill">' + REQS[i].type + '</span>' +
      '</div>';
    cards.appendChild(c);
    t.reveal(c);
    await t.wait(150);
  }

  // The canvas starts EMPTY. The plugin calls m.clone() per email, so each
  // artboard is created when its turn comes — none pre-exist.
  boards.classList.add("settled");
  await t.wait(500);

  // ---- Build All ----
  await t.press(t.$("#fgBuildBtn"));
  prog.classList.add("visible");
  await t.wait(400);

  // progress lines are the plugin's real log strings
  logLine("⧉ Skipped 1 duplicate (identical copy)");
  await t.wait(500);
  logLine("✉ Email phase — 4 to build…");
  await t.wait(600);
  logLine("🔎 Auto-detected master: 2026 Digital Templates");
  await t.wait(700);

  // ---- each artboard builds the way the plugin actually builds it ----
  //   1. m.clone()          → master lands whole: structure, template copy,
  //                           grey image rects (the plugin's greyPlaceholder)
  //   2. populateTemplate() → copy is written in
  //   3.                    → images place one at a time (imagesPlaced++)
  // Copy placeholders below are the real `placeholder` strings from
  // CR_EMAIL_TEMPLATES['Multicategory'] in index.html.
  var TMPL_COPY = [
    ['td[style*="font-size:16px"]', "NEW IN"],              // hero eyebrow (mono)
    ['td[style*="font-size:60px"]', "Headline copy\nmore copy"],
    ['td[style*="font-size:26px"]', "Supporting subcopy"],
    ['td[style*="font-size:42px"]', "Section header copy"], // section headers
    ['td[style*="font-size:32px"]', "Product name"],        // product names
    ['td[style*="font-size:20px"]', "Product description"]
  ];

  for (var b = 0; b < REQS.length; b++) {
    // m.clone() — the artboard is created now, named `${label} — US`
    var slot = t.el("div", "fg-slot");
    slot.appendChild(t.el("div", "fg-slot-label", REQS[b].type + " — 0" + (b + 1)));
    var board = t.el("div", "fg-board");
    slot.appendChild(board);
    boards.appendChild(slot);
    t.reveal(slot);

    var inner = t.el("div", "fg-board-inner");
    inner.innerHTML = emailHTML;

    // hero swap so each artboard is its own email
    var heroImg = inner.querySelector('img');
    if (heroImg) heroImg.setAttribute("src", REQS[b].hero);

    // --- state 1: m.clone() — placeholder copy + grey image rects ---
    var realText = new Map();
    for (var c = 0; c < TMPL_COPY.length; c++) {
      var nodes = inner.querySelectorAll(TMPL_COPY[c][0]);
      for (var n = 0; n < nodes.length; n++) {
        realText.set(nodes[n], nodes[n].textContent);
        nodes[n].textContent = TMPL_COPY[c][1];
        nodes[n].classList.add("fg-tmpl");
      }
    }
    var imgs = inner.querySelectorAll('img');
    for (var im = 0; im < imgs.length; im++) {
      imgs[im].dataset.ph = "1";
      var cell = imgs[im].closest('td') || imgs[im].parentNode;
      if (cell) cell.classList.add("fg-ph");
    }
    board.appendChild(inner);
    board.classList.add("sel");
    await t.wait(420);

    // helper: write one text node (the plugin sets characters in one shot —
    // the sequence across nodes is what's real, not per-character typing)
    async function writeNode(node, text, hold) {
      if (!node) return;
      node.classList.add("fg-writing");
      node.textContent = text;
      node.classList.remove("fg-tmpl");
      await t.wait(hold || 110);
      node.classList.remove("fg-writing");
    }

    // --- state 2: IMAGES FIRST. populateTemplate() places each slot's image,
    //     then immediately writes that slot's product copy via
    //     setProductCopyNearNode() — so image and its copy interleave. ---
    for (var p = 0; p < imgs.length; p++) {
      var host = imgs[p].closest('td') || imgs[p].parentNode;
      if (host) host.classList.add("fg-writing");
      imgs[p].removeAttribute("data-ph");
      if (host) host.classList.remove("fg-ph");
      await t.wait(190);
      if (host) host.classList.remove("fg-writing");

      // product cells are width="300" in the renderer; hero/inspiration
      // images carry no productData, so nothing follows them.
      var pcell = imgs[p].closest('td[width="300"]');
      if (pcell) {
        var copyNodes = pcell.querySelectorAll(
          'td[style*="font-size:16px"],td[style*="font-size:32px"],td[style*="font-size:20px"]');
        for (var q = 0; q < copyNodes.length; q++) {
          await writeNode(copyNodes[q], realText.get(copyNodes[q]), 90);
        }
      }
    }

    // --- state 3: section-level text last — populateSectionTextByAnchor()
    //     walks hero + section headers after every image is in. ---
    var heroTbl = inner.querySelector('.em-sec[data-sec="email_hero"]') || inner;
    await writeNode(heroTbl.querySelector('td[style*="font-size:16px"]'), REQS[b].eyebrow, 120);
    await writeNode(heroTbl.querySelector('td[style*="font-size:60px"]'), REQS[b].headline, 200);
    var subNode = heroTbl.querySelector('td[style*="font-size:26px"]');
    await writeNode(subNode, realText.get(subNode), 150);
    var hdrs = inner.querySelectorAll('td[style*="font-size:42px"]');
    for (var h = 0; h < hdrs.length; h++) {
      await writeNode(hdrs[h], realText.get(hdrs[h]), 140);
    }

    logLine("✉ " + (b + 1) + "/4 — " + REQS[b].name.slice(0, 26) + "… (" +
            imgs.length + "/" + imgs.length + " images)");
    board.classList.remove("sel");
    await t.wait(160);
  }

  await t.wait(300);
  logLine("<strong>Emails done — 4 built.</strong>");
  t.$("#fgBuildSub").innerHTML = "<strong>4</strong> artboards built from approved copy";

  await t.wait(2600);
});
</script>

</body>
</html>
