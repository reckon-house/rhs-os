<!-- ── THE TIMELINE VIEW, A MOCK (20 Sept 2026) ───────────────────────
     His idea: a toggle on the board, Projects | Timeline, the same
     work sorted by time, "because there's no story it's just
     projects". This page is the mock he asked for before it is built
     into the board. It is standalone on purpose: the board's engine is
     not touched, and nothing here is wired to it.

     The grammar is the board's (the mark, the tight ruled rail at the
     statement's size, hairlines, 12px captions, a name on its side)
     and the chart's is from his references: a time axis with a rule
     at every year, jobs as bars whose length is their duration, his
     own practice as a bar running under all of them, notes hung off
     leaders with the year stacked in two lines, case studies as small
     reels that play under the hand and open their study.

     DATES ARE LINKEDIN'S (his call), with one exception he confirmed:
     Neiman Marcus starts in 2006, as the résumé has it. LinkedIn only
     lists it from Aug 2009. The first job is Applied Media Resources
     (LinkedIn's "Applied Media", the résumé's "AMR Inc."); the rail
     says AMR because the full name is wider than the rail.
     A study's year is its own `published` field. Every note is a fact
     from his résumé or LinkedIn; the intro's sentence and the legend
     are placeholders of mine.

     THE MAIN AXIS IS SPACED BY WHAT HAPPENED, NOT BY THE CALENDAR: a
     year with eight studies is wider than a year with none, as the
     Tate and Charleroi references are. The strip at the foot is the
     honest one, true to scale, and it is also the scrubber. -->

  { id: "am", lane: 0, kind: "job", org: "Applied Media Resources", title: "Visual Designer", s: [2002, 8], e: [2006, 11], era: "AMR" },
  { id: "nm0", lane: 0, kind: "job", org: "Neiman Marcus", title: "Digital Designer", s: [2006, 11], e: [2009, 8], era: "Neiman Marcus" },
  { id: "nm", lane: 0, kind: "job", org: "Neiman Marcus", title: "Senior Visual Designer", s: [2009, 8], e: [2012, 5] },
  { id: "jcp", lane: 0, kind: "job", org: "JCPenney", title: "Senior Art Director", s: [2012, 5], e: [2013, 4], era: "JCPenney" },
  { id: "n1", lane: 0, kind: "job", org: "Nordstrom", title: "Design Manager", s: [2013, 4], e: [2014, 4], era: "Nordstrom" },
  { id: "n2", lane: 0, kind: "job", org: "Nordstrom", title: "Associate Creative Director", s: [2014, 4], e: [2018, 6] },
  { id: "n3", lane: 0, kind: "job", org: "Nordstrom", title: "Creative Design Director", s: [2018, 6], e: [2021, 4] },
  { id: "s1", lane: 0, kind: "job", org: "Sally Beauty", title: "Director of Creative Services", s: [2021, 4], e: [2022, 5], era: "Sally Beauty" },
  { id: "ah", lane: 0, kind: "job", org: "At Home", title: "Senior Digital Designer", s: [2022, 11], e: [2024, 2], era: "At Home" },
  { id: "ps", lane: 0, kind: "job", org: "PetSmart", title: "Senior Creative Manager", s: [2024, 2], e: [2025, 6], era: "PetSmart" },
  { id: "s2", lane: 0, kind: "job", org: "Sally Beauty", title: "Creative Director", s: [2025, 6], e: NOW, era: "Sally Beauty" },
  { id: "hm", lane: 1, kind: "line", org: "Custom homes", title: "Lead Interior Designer", s: [2021, 10], e: [2023, 6], era: "Homes" },
  { id: "rh", lane: 2, kind: "line", org: "Reckon House", title: "Principal, my own practice", s: [2012, 4], e: NOW, era: "Reckon House" },
];
/* every one a fact from his résumé or LinkedIn */
const NOTES = [
  { r: "edu", at: [1998, 9], t: "<b>UT Dallas.</b> A degree in management information systems." },
  { r: "am", at: [2002, 8], t: "<b>One of six at a startup.</b> All of the digital and print design." },
  { r: "am", at: [2004, 1], t: "Designed and coded the front-end UI for a custom CMS. Hand-coded CSS and JavaScript." },
  { r: "nm0", at: [2006, 11], t: "<b>Neiman Marcus.</b> Design across site, email and print for a luxury retailer." },
  /* the company's centennial was 2007, so that year's book is the one */
  { r: "nm0", at: [2007, 10], t: "The cover of the 100th Anniversary Christmas Book." },
  { r: "nm", at: [2009, 8], t: "Led the design and technical execution of InSite, its editorial hub." },
  { r: "nm", at: [2011, 1], t: "A complete homepage redesign." },
  { r: "jcp", at: [2012, 5], t: "<b>JCPenney.</b> Recruited for the Ron Johnson transformation. Design language and photo direction." },
  { r: "n1", at: [2013, 4], t: "<b>Nordstrom.</b> A team of 12 on the daily homepage, landing pages and email." },
  { r: "n2", at: [2014, 6], t: "A team of 27 across site, email and apps." },
  { r: "n2", at: [2015, 4], t: "Nordstrom's first personalization design logic." },
  { r: "n2", at: [2016, 4], t: "<b>Ivy Park by Beyoncé.</b> Six weeks from concept to live." },
  { r: "n3", at: [2018, 6], t: "<b>A new CMS with engineering.</b> $3M saved over four years." },
  { r: "n3", at: [2019, 6], t: "Rebrand of the digital design system. Concept-to-web time down 35%, engagement up 22%." },
  { r: "rh", at: [2012, 4], t: "<b>Reckon House.</b> My own practice starts: brand identity, interiors, and later the tools." },
  { r: "s1", at: [2021, 4], t: "<b>Sally Beauty.</b> Built the in-house creative teams and a new operating model. Execution efficiency up 27%." },
  { r: "hm", at: [2021, 10], t: "<b>Custom homes.</b> Interior design and selections on $1-3M builds." },
  { r: "hm", at: [2023, 3], t: "Designer of the Quarter, Floor & Decor." },
  { r: "ah", at: [2022, 11], t: "<b>At Home.</b> The brand story redesign for the corporate site, presented to the CEO." },
  { r: "ps", at: [2024, 2], t: "<b>PetSmart.</b> AI product photography. Creative output up 30%, channel demand up 12%." },
  { r: "rh", at: [2024, 8], t: "<b>A.R.C.</b> An iPhone app designed and coded end to end. Heading to the App Store." },
  { r: "s2", at: [2025, 6], t: "<b>Sally OS.</b> Conceived and built it, pitched it to the board. Campaigns go from request to execution in hours instead of weeks." },
  { r: "rh", at: [2025, 10], t: "Dallas Sport Collective: booking by talking to an AI, with the scheduling kept deterministic." },
  { r: "s2", at: [2026, 3], t: "Fleet stores to a new boutique store experience." },
];

/* ── the axis is spaced by what happened ── */
const Y0 = 1998, Y1 = 2026, INTRO = 470, TAIL = 260;
const per = {}; STUDIES.forEach((s) => { per[s.y] = (per[s.y] || 0) + 1; });
const perN = {}; NOTES.forEach((n) => { perN[n.at[0]] = (perN[n.at[0]] || 0) + 1; });
/* a year is as wide as what happened in it: two rows of pictures, two
   rows of notes, and a quiet year passes quickly */
/* school passes in a few columns, so the first job, and the CMS he
   coded there, stand on the opening screen */
const yw = (y) => y < 2002 ? 72 : Math.max(100, per[y] ? Math.ceil(per[y] / 2) * 168 + 24 : 0, perN[y] ? perN[y] * 140 + 40 : 0);
const YX = {}; { let x = INTRO; for (let y = Y0; y <= Y1 + 1; y++) { YX[y] = x; x += yw(y); } }
const X = (d) => YX[d[0]] + ((d[1] - 1) / 12) * yw(d[0]);
const WORLD_W = X(NOW) + TAIL;
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const world = document.getElementById("world"), stage = document.getElementById("stage");
world.style.width = WORLD_W + "px";

/* rows, from the head band down. A tall window takes them at full pitch.
   A shorter one tightens every pitch a step at a time, until the lowest
   note clears the scale at the foot: his own laptop's window is about
   770 tall, and at full pitch the last row of notes ran under it. */
const TOP = 114, V = {}, placed = [];
const pitch = (t) => {
  const mix = (a, b) => Math.round(a + (b - a) * t);
  V.pic = mix(96, 84); V.row = mix(150, 132); V.axis = TOP + 2 * V.row - 2;
  V.laneH = mix(28, 24); V.lane = V.laneH + mix(8, 6); V.lane0 = V.axis + mix(36, 30);
  V.note0 = V.lane0 + 3 * V.lane + mix(20, 12); V.noteRow = mix(100, 92);
  world.style.setProperty("--pic-h", V.pic + "px"); world.style.setProperty("--lane-h", V.laneH + "px");
  placed.forEach((fn) => fn());
};

/* the opening column */
const intro = el("div", "intro", '<div class="spine">Timeline</div><div class="body"><p class="lede">Everything on this site, in the order it happened.</p>'
  + '<ul class="key"><li><b class="k1"></b>A job, as long as it lasted</li><li><b class="k2"></b>My own practice, alongside</li>'
  + '<li><b class="k0"></b>School</li><li><b class="k3"></b>A case study. Rest on it to play, press to open.</li></ul></div>');
world.appendChild(intro);

/* a rule at every year, and the axis */
for (let y = Y0; y <= Y1 + 1; y++) {
  const r = el("i", "yr"); r.style.left = YX[y] + "px"; world.appendChild(r);
  if (y <= Y1) { const l = el("span", "yl", String(y)); l.style.left = YX[y] + "px"; placed.push(() => { l.style.top = (V.axis + 8) + "px"; }); world.appendChild(l); }
}
const axis = el("i"); axis.id = "axis"; axis.style.cssText = "left:" + YX[Y0] + "px;width:" + (X(NOW) - YX[Y0]) + "px"; placed.push(() => { axis.style.top = V.axis + "px"; }); world.appendChild(axis);

{ const n = el("span", "now", "Now"); n.style.left = X(NOW) + "px"; placed.push(() => { n.style.top = (V.axis - 8) + "px"; }); world.appendChild(n); }

/* the jobs */
const byId = {};
ROLES.forEach((r) => {
  const b = el("div", "bar " + r.kind, "<em>" + r.org + " <span>" + r.title + "</span></em>");
  const x0 = X(r.s), x1 = X(r.e);
  b.style.cssText = "left:" + x0 + "px;width:" + Math.max(8, x1 - x0 - 2) + "px";
  placed.push(() => { b.style.top = (V.lane0 + r.lane * V.lane) + "px"; });
  b.dataset.r = r.id; byId[r.id] = { r, b, x0, x1, lab: b.firstChild };
  world.appendChild(b);
});

/* the notes, packed in two rows so none stands on another */
{ const ends = [0, 0];
  NOTES.slice().sort((a, b) => X(a.at) - X(b.at)).forEach((n) => {
    const x = X(n.at) + 2;
    let row = ends[0] <= x ? 0 : (ends[1] <= x ? 1 : (ends[0] <= ends[1] ? 0 : 1));
    const nx = Math.max(x, ends[row]);
    ends[row] = nx + 236 + 22;
    const y = String(n.at[0]);
    const d = el("div", "note", '<div class="y">' + y.slice(0, 2) + "<br>" + y.slice(2) + "</div><p>" + n.t + "</p>");
    const lane = byId[n.r].r.lane;
    d.style.left = nx + "px";
    placed.push(() => {
      const top = V.note0 + row * V.noteRow, from = V.lane0 + lane * V.lane + V.laneH;
      d.style.top = top + "px"; d.style.setProperty("--lead", (row ? 12 : Math.max(0, top - from - 8)) + "px");
    });
    d.dataset.r = n.r; world.appendChild(d);
  });
}

/* the studies, packed in two rows over the axis */
{ const ends = [0, 0], W = 152, order = [1, 0];
  const byYear = {}; STUDIES.forEach((s) => { (byYear[s.y] = byYear[s.y] || []).push(s); });
  Object.keys(byYear).map(Number).sort((a, b) => a - b).forEach((y) => {
    const list = byYear[y];
    list.forEach((s, i) => {
      const want = YX[y] + ((i + 0.5) / list.length) * yw(y) - W / 2;
      let row = order[i % 2];
      if (ends[row] > want) row = ends[0] <= ends[1] ? 0 : 1;
      const x = Math.max(want, ends[row]);
      ends[row] = x + W + 16;
      const a = el("a", "st", '<span class="pic"><img alt="" loading="lazy" decoding="async" src="' + encodeURI(s.frames[0] || "") + '"></span>'
        + '<span class="cap">' + s.t + ' <span data-full="' + s.s + '">' + s.s + "</span></span>");
      a.href = "/case-studies/" + s.h;
      a.style.left = x + "px";
      placed.push(() => {
        const top = TOP + row * V.row;
        a.style.top = top + "px"; a.style.setProperty("--lead", Math.max(0, V.axis - (top + V.pic + 6 + 32) - 8) + "px");
      });
      /* a faux reel in miniature: the study's own frames, cut while the hand rests */
      let t = 0, k = 0; const im = a.querySelector("img");
      a.addEventListener("pointerenter", () => {
        if (s.frames.length < 2) return;
        s.frames.forEach((f) => { const p = new Image(); p.src = encodeURI(f); });
        clearInterval(t); t = setInterval(() => { k = (k + 1) % s.frames.length; im.src = encodeURI(s.frames[k]); }, 620);
      });
      a.addEventListener("pointerleave", () => { clearInterval(t); k = 0; im.src = encodeURI(s.frames[0]); });
      world.appendChild(a);
    });
  });
}

/* a bar under the hand lights its own notes */
world.addEventListener("pointerover", (e) => {
  const b = e.target.closest(".bar, .note"); if (!b) return;
  const id = b.dataset.r;
  world.classList.add("dim");
  world.querySelectorAll(".bar, .note").forEach((n) => n.classList.toggle("lit", n.dataset.r === id));
});
world.addEventListener("pointerout", (e) => { if (e.target.closest(".bar, .note")) { world.classList.remove("dim"); world.querySelectorAll(".lit").forEach((n) => n.classList.remove("lit")); } });

/* ── the rail: the eras, in order ── */
const eras = document.getElementById("eras");
const ERAS = []; ROLES.forEach((r) => { if (r.era) ERAS.push(r); });
ERAS.sort((a, b) => X(a.s) - X(b.s));
const go = (x) => stage.scrollTo({ left: Math.max(0, x - 60), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
ERAS.forEach((r) => {
  const b = el("button", "era", "<span>" + r.era + "</span><sup>" + r.s[0] + "</sup>"); b.type = "button";
  b.addEventListener("click", () => go(X(r.s)));
  eras.appendChild(b); r.btn = b;
});
["About", "Connect", "Ask"].forEach((n) => { const a = el("a", "era door", "<span>" + n + "</span>"); a.href = "/"; eras.appendChild(a); });
const fitRules = () => document.querySelectorAll(".era").forEach((b) => b.style.setProperty("--w", Math.round(b.firstChild.getBoundingClientRect().width) + "px"));
/* a caption is two lines and never ends on a comma: a discipline gives up
   its last phrase, whole, until what is left fits */
const fitCaps = () => world.querySelectorAll(".st .cap").forEach((c) => {
  const d = c.querySelector("span"); if (!d) return;
  const parts = d.dataset.full.split(", ");
  d.textContent = parts.join(", ");
  while (parts.length && c.scrollHeight > c.clientHeight + 1) { parts.pop(); d.textContent = parts.join(", "); }
});
fitRules(); fitCaps(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fitRules(); fitCaps(); });

/* ── the foot: true to scale, and the scrubber ── */
const map = document.getElementById("map");
const T = (d) => d[0] + (d[1] - 1) / 12, T0 = T([Y0, 8]), T1 = T(NOW) + 0.35;
const mapX = (t) => ((t - T0) / (T1 - T0)) * map.clientWidth;
/* the world's x back to a time: the inverse of X */
const timeAt = (x) => { for (let y = Y0; y <= Y1; y++) if (x < YX[y + 1]) return y + Math.max(0, (x - YX[y]) / yw(y)); return T(NOW); };
const xAt = (t) => { const y = Math.min(Y1, Math.max(Y0, Math.floor(t))); return YX[y] + (t - y) * yw(y); };
const win = el("div", "win");
const drawMap = () => {
  map.textContent = "";
  ROLES.forEach((r) => { const m = el("i", "mb " + r.kind); m.style.cssText = "left:" + mapX(T(r.s)) + "px;width:" + Math.max(2, mapX(T(r.e)) - mapX(T(r.s)) - 1) + "px;top:" + (r.lane * 8) + "px"; map.appendChild(m); });
  for (let y = 2000; y <= Y1; y += 2) { const l = el("span", "ml", String(y)); l.style.left = mapX(y) + "px"; map.appendChild(l); }
  map.appendChild(win); onScroll();
};
const range = document.getElementById("range");
function onScroll() {
  const a = timeAt(stage.scrollLeft), b = timeAt(stage.scrollLeft + stage.clientWidth);
  const l = Math.max(0, mapX(Math.max(T0, a))), r = Math.min(map.clientWidth, mapX(b));
  win.style.left = l + "px"; win.style.width = Math.max(10, r - l) + "px";
  range.textContent = stage.scrollLeft < INTRO - 120 ? "1998 to " + Math.floor(b) : Math.floor(a) + " to " + Math.min(Y1, Math.floor(b));
  /* a long bar's name stays on the glass while the bar crosses it */
  Object.values(byId).forEach((o) => {
    const room = (o.x1 - o.x0) - o.lab.offsetWidth - 24;
    const off = Math.min(Math.max(0, stage.scrollLeft - o.x0 + 4), Math.max(0, room));
    o.lab.style.transform = "translateX(" + off + "px)";
  });
  /* in ink: the job under the near third of the glass */
  /* at the far end there is no further to pan, so the last job takes the ink */
  const atEnd = stage.scrollLeft + stage.clientWidth >= stage.scrollWidth - 40;
  const t = atEnd ? T(NOW) : timeAt(stage.scrollLeft + stage.clientWidth * 0.3);
  let front = null; ERAS.forEach((r) => { if (r.lane === 0 && T(r.s) <= t) front = r; });
  ERAS.forEach((r) => r.btn.classList.toggle("front", r === front && stage.scrollLeft > INTRO - 300));
}
const fitV = () => {
  const foot = map.getBoundingClientRect().top - 18;
  for (let i = 0; i <= 5; i++) {
    pitch(i / 5);
    let low = 0; world.querySelectorAll(".note").forEach((n) => { low = Math.max(low, n.offsetTop + n.offsetHeight); });
    if (low <= foot) break;
  }
};
stage.addEventListener("scroll", onScroll, { passive: true });
addEventListener("resize", () => { drawMap(); fitV(); }, { passive: true });
drawMap(); fitV();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitV);
const scrub = (e) => { const r = map.getBoundingClientRect(); const t = T0 + ((e.clientX - r.left) / r.width) * (T1 - T0); stage.scrollLeft = xAt(t) - stage.clientWidth / 2; };
let scrubbing = false;
map.addEventListener("pointerdown", (e) => { scrubbing = true; map.setPointerCapture(e.pointerId); scrub(e); });
map.addEventListener("pointermove", (e) => { if (scrubbing) scrub(e); });
map.addEventListener("pointerup", () => { scrubbing = false; });

/* a wheel either way pans the world; arrows too */
stage.addEventListener("wheel", (e) => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { e.preventDefault(); stage.scrollLeft += e.deltaY; } }, { passive: false });
addEventListener("keydown", (e) => { if (e.key === "ArrowRight") stage.scrollLeft += 240; if (e.key === "ArrowLeft") stage.scrollLeft -= 240; });
</script>
</body>
</html>
