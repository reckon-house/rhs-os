<title>Timeline view, a mock · Reckon*House</title>
<!-- ── THE TIMELINE VIEW, A MOCK (20 Sept 2026) ───────────────────────
     His idea: a toggle on the board, Projects | Timeline, the same
     work sorted by time, "because there's no story it's just
     projects". Then, the same day: "a timeline meets a small book
     with chapters, narration type of thing". This page is the mock he
     asked for before any of it is built into the board. It is
     standalone on purpose: the board's engine is not touched, and
     nothing here is wired to it.

     THE CHART. The grammar is the board's (the mark, the tight ruled
     rail at the statement's size, hairlines, 12px captions, a name on
     its side) and the chart's is from his references: a rule at every
     year, jobs as bars whose length is their duration, his own
     practice as a bar running under all of them, notes hung off
     leaders with the year stacked in two lines, case studies as small
     reels that play under the hand and open their study.

     THE BOOK. Eight chapters. A chapter opens on a PAGE laid over the
     timeline at the date it starts: a numeral, the years, the name, one
     big first sentence, then a few paragraphs. The page is paper, so a
     bar that runs through a chapter's start (his practice, from 2012)
     goes under it and comes out the other side. A page is as wide as
     its words: the text flows into columns of one measure at the
     window's height, and the page takes as many as it needs. The rail
     is the contents. Between pages the notes carry the voice.

     THE WORDS ARE HIS, STITCHED. Every sentence on a page is from his
     LinkedIn, his résumé or what he typed in the session, edited for
     spelling, length and order and nothing else (VOICE.md: "Get his
     raw words first... Edit lightly... Do not restate"). Nothing says
     WHY he moved or WHAT a job taught him, because he has not said.
     Each page ends on "Yours to write" with the question that gap
     needs. Those blocks are notes to him and come out before this
     ships anywhere.

     ONE FACT, ONE HOME. A page tells what a stretch was; a note pins
     one fact to a date. No fact is in both. Facts with no date of
     their own sit at the start of the role LinkedIn lists them under,
     or where they fit inside it. He knows the placement is
     approximate.

     DATES ARE LINKEDIN'S (his call), with one exception he confirmed:
     Neiman Marcus starts in 2006, as the résumé has it. LinkedIn only
     lists it from Aug 2009. The first job is Applied Media Resources
     (LinkedIn's "Applied Media", the résumé's "AMR Inc."); the rail
     says AMR because the full name is wider than the rail.
     A study's year is its own `published` field, and a year's studies
     are spread across it, except where the chapter a study belongs to
     is plain (STUDY_AT).

     IT READS BACKWARDS (21 Sept 2026, his call): "starting with where i
     am and reading how i got there might make for a quicker 'oh he has
     these skills'". So Now is the first page and the glass pans back
     to 1998, the way a résumé runs: newest job first, each job still
     told forwards. A chapter's page stands at the head of its own
     stretch, which in this direction is its END, so a job that starts
     on a chapter's date ends the stretch at the page after it. Notes
     hang towards the later side of their date, which is now the left,
     and are mirrored so the year and the leader stand on the date. The
     true-scale strip at the foot runs the same way, or its window
     would walk left as the glass pans right. Chapters are numbered in
     the order they are read. `?order=old` lays it out from 1998
     forwards, which is how it was first built, to compare.

     THE MAIN AXIS IS SPACED BY WHAT HAPPENED, NOT BY THE CALENDAR: the
     axis is cut at every new year and at every page, and each stretch
     is as wide as the pictures, notes and bar labels in it need, with
     a floor so a quiet year still passes. The strip at the foot is
     the honest one, true to scale, and it is also the scrubber. -->
<style>
  @font-face { font-family: 'Avenir Next'; src: url('/fonts/AvenirNext-Regular.woff2') format('woff2'), url('/fonts/AvenirNext-Regular.woff') format('woff'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Avenir Next'; src: url('/fonts/AvenirNext-Medium.woff') format('woff'); font-weight: 500; font-display: swap; }
  @font-face { font-family: 'Avenir Next'; src: url('/fonts/AvenirNext-DemiBold.woff') format('woff'); font-weight: 600; font-display: swap; }
  @font-face { font-family: 'Avenir Next'; src: url('/fonts/AvenirNext-Bold.woff') format('woff'); font-weight: 700; font-display: swap; }
  :root { --ink: #000; --paper: #fff; --grey: rgba(0, 0, 0, 0.42); --hair: rgba(0, 0, 0, 0.13); --rule: rgba(0, 0, 0, 0.1);
    --gut: 50px; --rail: 200px; --gap: 73px; --air: 50px; --band: 64px;
    --st-fs: clamp(20px, 2.4vw, 32px);
    --sans: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; }

    font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }

  /* the head line: the mark, and what is on the glass */

  #mark i { font-style: normal; font-weight: 400; }
  #range { position: fixed; z-index: 5; right: var(--gut); top: calc(var(--air) + 2px);
    font-size: 12px; font-weight: 500; letter-spacing: 0.04em; color: var(--grey); }

  /* the rail: the board's own, with the view's switch over it */
  #rail { position: fixed; z-index: 4; left: 0; top: calc(var(--air) + var(--band));
    width: calc(var(--gut) + var(--rail)); padding-left: var(--gut); bottom: 24px; }
  .switch { display: flex; gap: 14px; font-size: 12px; font-weight: 600; letter-spacing: -0.004em; margin: 0 0 14px; }
  .switch a { color: var(--grey); transition: color 0.3s ease; }
  .switch a:hover { color: var(--ink); }
  .switch .on { border-bottom: 1px solid var(--ink); padding-bottom: 2px; }
  .era { position: relative; display: flex; align-items: flex-start; gap: 4px; width: 100%; height: var(--pitch, 42px);
    padding: 1px 0 0; margin: 0; border: 0; background: none; cursor: pointer; text-align: left;
    font: inherit; font-size: var(--st-fs); font-weight: 700; letter-spacing: -0.05em; line-height: 1.2;

  .era::after { content: ""; position: absolute; top: 100%; left: calc(-1 * var(--gut)); height: 1px;
    width: calc(var(--gut) + var(--w, 0px)); background: var(--rule); }
  .era.front, .era:hover { color: var(--ink); }
  .era sup { font-size: 10px; font-weight: 600; letter-spacing: 0; line-height: 1; margin-top: 5px; font-variant-numeric: tabular-nums; }
  .era.door { cursor: pointer; }

  /* the stage: one long world, panned sideways */
  #stage { position: fixed; left: calc(var(--gut) + var(--rail) + var(--gap)); right: 0;
    top: 0; bottom: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  #stage::-webkit-scrollbar { display: none; }
  #world { position: relative; height: 100%; }
  .yr { position: absolute; top: 96px; bottom: 88px; width: 1px; background: var(--hair); }
  .yr.edge { background: var(--hair); }
  .yl { position: absolute; font-size: 12px; font-weight: 600; letter-spacing: 0.02em; color: var(--grey);

  #axis { position: absolute; left: 0; height: 1px; background: var(--ink); }

  /* the opening column: the view's name on its side, as a run's is */
  .intro { position: absolute; left: 0; top: calc(var(--air) + var(--band)); width: 400px; }
  .spine { position: absolute; left: 0.03em; top: 0; writing-mode: vertical-rl; transform: rotate(180deg);
    font-size: 112px; font-weight: 700; letter-spacing: -0.04em; line-height: 0.8; text-transform: uppercase;
    white-space: nowrap; user-select: none; }
  .intro .body { margin-left: 118px; }
  .lede { font-size: var(--st-fs); font-weight: 600; letter-spacing: -0.05em; line-height: 1.2; margin: 0 0 22px; }
  .key { font-size: 12px; font-weight: 500; line-height: 1.45; color: var(--grey); margin: 0; padding: 0; list-style: none; }
  .key li { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; }
  .key b { flex: none; width: 34px; height: 12px; border-radius: 3px; }
  .key .k1 { background: var(--ink); } .key .k2 { border: 1px solid var(--ink); }
  .key .k3 { height: 22px; border-radius: 5px; background: rgba(0, 0, 0, 0.12); }
  .key .k0 { background: rgba(0, 0, 0, 0.1); }

  /* a case study: a small reel on a leader, with the board's caption */
  .st { position: absolute; width: 152px; display: block; }
  .st .pic { display: block; width: 152px; height: var(--pic-h, 96px); border-radius: 12px; overflow: hidden; background: #EDE7E2; }
  .st img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .st .cap { display: block; margin-top: 6px; font-size: 12px; font-weight: 600; letter-spacing: -0.004em; line-height: 1.3;
    max-height: 2.6em; overflow: hidden; }
  .st .cap span { color: var(--grey); }
  .st::after { content: ""; position: absolute; left: 50%; top: calc(100% + 4px); width: 1px; height: var(--lead, 0px); background: var(--hair); }
  .st:hover .pic { outline: 1px solid var(--ink); outline-offset: 2px; }

  /* the jobs: a bar is as long as the job was */
  .bar { position: absolute; height: var(--lane-h, 28px); border-radius: 4px; padding: 0 9px; display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; letter-spacing: -0.004em; white-space: nowrap; overflow: hidden; }
  .bar em { font-style: normal; display: flex; gap: 6px; will-change: transform; }
  .bar span { font-weight: 500; opacity: 0.62; }
  .bar.job { background: var(--ink); color: #fff; }
  .bar.line { border: 1px solid var(--ink); color: var(--ink); background: var(--paper); }
  .bar.soft { background: rgba(0, 0, 0, 0.28); color: #fff; }
  .bar.edu { background: rgba(0, 0, 0, 0.08); color: var(--ink); }

  /* a note: the year stacked in two, the fact beside it */
  .note { position: absolute; width: 236px; display: flex; gap: 10px; align-items: flex-start; }
  .note .y { flex: none; font-size: var(--st-fs); font-weight: 700; letter-spacing: -0.05em; line-height: 0.86;
    font-variant-numeric: tabular-nums; }
  .note p { margin: 1px 0 0; font-size: 12px; font-weight: 500; letter-spacing: -0.004em; line-height: 1.45; }
  .note p b { font-weight: 600; }
  .note::before { content: ""; position: absolute; left: var(--lx, 0px); bottom: calc(100% + 6px); width: 1px; height: var(--lead, 0px); background: var(--hair); }
  .now { position: absolute; font-size: 12px; font-weight: 600; padding-left: 10px; }
  /* read backwards, later is to the left: a note hangs that way from its
     date, so its year and its leader stand at its right-hand end */
  #world.rev .note { flex-direction: row-reverse; }
  #world.rev .now { padding-left: 0; }

  /* a chapter's page: paper laid over the timeline, the height of the
     year rules, as wide as its words. The measure is one column; the
     text flows into more of them to the right and the page is widened

  .pg { position: absolute; z-index: 2; top: 96px; bottom: 88px; box-sizing: border-box; background: var(--paper);
    border-left: 1px solid var(--hair); border-right: 1px solid var(--hair); padding: 18px 40px 14px 28px; }
  .pg .flow { width: 360px; height: 100%; column-width: 360px; column-gap: 40px; column-fill: auto; }
  .pg .head { break-inside: avoid; }
  .pg .num { font-size: 72px; font-weight: 700; letter-spacing: -0.06em; line-height: 0.8; margin: 0 0 20px -0.03em;
    font-variant-numeric: tabular-nums; }
  .pg .when { font-size: 12px; font-weight: 600; letter-spacing: 0.02em; color: var(--grey); margin: 0 0 4px; }
  .pg h2 { font-size: var(--st-fs); font-weight: 700; letter-spacing: -0.05em; line-height: 1.1; margin: 0 0 14px; }
  .pg .lede { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.3; margin: 0 0 16px; }
  .pg p { font-size: 16px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.5; margin: 0 0 12px;
    color: rgba(0, 0, 0, 0.8); orphans: 2; widows: 2; }
  .pg p.lede { color: var(--ink); }
  /* a note to him, not to a visitor: the question only he can answer */
  .pg .yours { break-inside: avoid; margin-top: 18px; padding-top: 10px; border-top: 1px solid var(--hair);
    font-size: 12px; font-weight: 500; letter-spacing: -0.004em; line-height: 1.45; color: var(--grey); }

  /* the foot: the whole of it to scale, and the way through it */
  #map { position: fixed; z-index: 4; left: calc(var(--gut) + var(--rail) + var(--gap)); right: var(--gut); bottom: 24px; height: 44px;
    cursor: pointer; }

  #map .mb.line { background: none; border: 1px solid var(--ink); }

<body>
<a id="mark" href="/">Reckon<i>*</i>House</a>
<div id="range" aria-live="off"></div>
<aside id="rail" aria-label="Index">
  <div class="switch"><a href="/">Projects</a><span class="on">Timeline</span></div>
  <nav id="eras"></nav>
</aside>
<main id="stage"><div id="world"></div></main>
<div id="map" aria-hidden="true"></div>

<script src="/lab/timeline-data.js"></script>
<script>
/* the facts live in /lab/timeline-data.js, shared with the looks */
const { STUDIES, ROLES, CHAPTERS, NOTES, NOW, STUDY_AT } = window.TL;
/* newest first unless asked otherwise (?order=old) */
const REV = new URLSearchParams(location.search).get("order") !== "old";



/* ── time and place ── */
const Y0 = 1998, Y1 = 2026, INTRO = 470, TAIL = 260, W_ST = 152, W_NOTE = 236, COL_W = 360, COL_GAP = 40, PG_L = 28, PG_R = 40;
const T = (d) => Array.isArray(d) ? d[0] + (d[1] - 1) / 12 : d;
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const world = document.getElementById("world"), stage = document.getElementById("stage"), map = document.getElementById("map"),
  range = document.getElementById("range"), eras = document.getElementById("eras");

/* a study's moment: STUDY_AT pins the few whose chapter is plain; the rest
   are spread across their year */
{ const byYear = {}; STUDIES.forEach((s) => { (byYear[s.y] = byYear[s.y] || []).push(s); });
  Object.values(byYear).forEach((list) => list.forEach((s, i) => { s.at = STUDY_AT[s.k] ? T(STUDY_AT[s.k]) : s.y + (i + 0.5) / list.length; })); }

/* THE AXIS IS SPACED BY WHAT HAPPENED. It is cut at every new year and at
   every page, and each stretch is as wide as what is in it needs: two rows
   of pictures, two rows of notes, the label of any bar that lives in it,
   and a floor so a quiet year still passes. School passes quickest. */
let SPANS = [], SEQ = [], PAGES = [];
const NOW_ROOM = 44;
const ink = document.createElement("canvas").getContext("2d");
const labelNeed = (r) => { ink.font = '600 12px "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif'; const a = ink.measureText(r.org).width;
  ink.font = '500 12px "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif'; return a + 6 + ink.measureText(r.title).width + 18 + 14; };
const layoutX = () => {
  /* the axis ends at now, not at the year's end: read backwards, the rest
     of this year would be an empty stretch before anything had happened */
  const cuts = new Set(); for (let y = Y0; y <= Y1; y++) cuts.add(y);
  cuts.add(T(NOW));
  PAGES.forEach((p) => cuts.add(p.t));
  const ts = [...cuts].sort((a, b) => a - b);
  SPANS = [];
  for (let i = 0; i < ts.length - 1; i++) {
    const t0 = ts[i], t1 = ts[i + 1];
    const st = STUDIES.filter((s) => s.at >= t0 && s.at < t1).length, no = NOTES.filter((n) => T(n.at) >= t0 && T(n.at) < t1).length;
    const w = Math.max((t1 - t0) * (t0 < 2002 ? 72 : 100), st ? Math.ceil(st / 2) * (W_ST + 16) + 24 : 0, no ? Math.max(no * 140 + 40, W_NOTE + 40) : 0);
    SPANS.push({ t0, t1, w, x: 0 });
  }
  /* a bar is never shorter than its own label: the stretches it lives in
     are let out, in proportion, until the name fits */
  ROLES.forEach((r) => {
    const s = T(r.s), e = T(r.e), inside = SPANS.map((sp) => Math.max(0, Math.min(e, sp.t1) - Math.max(s, sp.t0)));
    const have = SPANS.reduce((a, sp, i) => a + sp.w * inside[i] / (sp.t1 - sp.t0), 0), need = labelNeed(r), dur = inside.reduce((a, b) => a + b, 0);
    if (have < need && dur > 0) SPANS.forEach((sp, i) => { if (inside[i]) sp.w += (need - have) * (inside[i] / dur) * ((sp.t1 - sp.t0) / inside[i]); });
  });
  /* a page stands at the head of its chapter's stretch as it is READ: at
     the chapter's start going forwards, at its end going back */
  const asc = PAGES.slice().sort((a, b) => a.t - b.t);
  asc.forEach((p, i) => { p.tEnd = i < asc.length - 1 ? asc[i + 1].t : Infinity; });
  SEQ = REV ? SPANS.slice().reverse() : SPANS.slice();
  let x = INTRO;
  SEQ.forEach((sp, i) => {
    const pg = REV ? PAGES.find((p) => p.tEnd === sp.t1 || (i === 0 && p.tEnd === Infinity)) : PAGES.find((p) => p.t === sp.t0);
    /* read backwards, the axis STARTS at now, hard against the first page:
       a little more room there, for the word that says so */
    if (pg) { x += i ? 16 : 0; pg.x = x; x += pg.w + 24 + (REV && !i ? NOW_ROOM : 0); }
    sp.x = x; x += sp.w;
  });
};
const spanFrom = (t) => SPANS.find((s) => t >= s.t0 && t < s.t1) || SPANS[SPANS.length - 1];
const spanTo = (t) => SPANS.find((s) => t > s.t0 && t <= s.t1) || SPANS[0];
const at = (sp, t) => { const f = (Math.min(Math.max(t, sp.t0), sp.t1) - sp.t0) / (sp.t1 - sp.t0); return sp.x + (REV ? 1 - f : f) * sp.w; };
/* where a thing STARTS, and where one ENDS: at a page's date they differ,
   one after the page and one before it */
const XS = (d) => at(spanFrom(T(d)), T(d)), XE = (d) => at(spanTo(T(d)), T(d));
const timeAt = (x) => { for (const sp of SEQ) { if (x < sp.x) return REV ? sp.t1 : sp.t0;
  if (x <= sp.x + sp.w) { const f = (x - sp.x) / sp.w; return sp.t0 + (REV ? 1 - f : f) * (sp.t1 - sp.t0); } } return REV ? Y0 : T(NOW); };
/* a thing that would stand on a page goes to the side its own moment is
   on: back before the page when that is where it belongs and there is
   room, past it otherwise. Which side is which does not depend on the
   direction the glass reads in. */
const clearOfPages = (x, w, floor, anchor) => { for (let moved = true; moved;) { moved = false;
  PAGES.forEach((p) => { if (x < p.x + p.w + 16 && x + w > p.x - 16) {
    const back = p.x - 16 - w;
    if (anchor < p.x + p.w / 2 && back >= floor) x = back; else { x = p.x + p.w + 16; moved = true; }
  } }); } return x; };

/* rows, from the head band down. A tall window takes them at full pitch.
   A shorter one tightens every pitch a step at a time, until the lowest
   note clears the scale at the foot: his own laptop's window is about
   770 tall, and at full pitch the last row of notes ran under it. */
const TOP = 114, V = {}, placed = [], byId = {};
const pitch = (t) => {
  const mix = (a, b) => Math.round(a + (b - a) * t);
  V.pic = mix(96, 84); V.row = mix(150, 132); V.axis = TOP + 2 * V.row - 2;
  V.laneH = mix(28, 24); V.lane = V.laneH + mix(8, 6); V.lane0 = V.axis + mix(36, 30);
  V.note0 = V.lane0 + 3 * V.lane + mix(20, 12); V.noteRow = mix(100, 92);
  world.style.setProperty("--pic-h", V.pic + "px"); world.style.setProperty("--lane-h", V.laneH + "px");
  placed.forEach((fn) => fn());
};
const fitV = () => {
  const foot = map.getBoundingClientRect().top - 18;
  for (let i = 0; i <= 5; i++) {
    pitch(i / 5);
    let low = 0; world.querySelectorAll(".note").forEach((n) => { low = Math.max(low, n.offsetTop + n.offsetHeight); });
    if (low <= foot) break;
  }
};
const go = (x) => stage.scrollTo({ left: Math.max(0, x), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
const fitRules = () => document.querySelectorAll(".era").forEach((b) => b.style.setProperty("--w", Math.round(b.firstChild.getBoundingClientRect().width) + "px"));
/* a caption is two lines and never ends on a comma: a discipline gives up
   its last phrase, whole, until what is left fits */
const fitCaps = () => world.querySelectorAll(".st .cap").forEach((c) => {
  const d = c.querySelector("span"); if (!d) return;
  const parts = d.dataset.full.split(", ");
  d.textContent = parts.join(", ");
  while (parts.length && c.scrollHeight > c.clientHeight + 1) { parts.pop(); d.textContent = parts.join(", "); }
});

/* ── the build. It runs again when the window changes, because a page is
   as wide as its words at THIS height, and everything after a page
   stands where the page ends. ── */
const build = () => {
  const keep = SPANS.length ? timeAt(stage.scrollLeft + stage.clientWidth / 2) : null, wasAt = stage.scrollLeft;
  world.textContent = ""; eras.textContent = ""; placed.length = 0; Object.keys(byId).forEach((k) => delete byId[k]);

  /* the cover: the view's name on its side, as a run's is. The sentence is
     his, from LinkedIn. */
  world.appendChild(el("div", "intro", '<div class="spine">Timeline</div><div class="body"><p class="lede">Different mediums but the same attention given to all of it, because I really do love the work.</p>'
    + '<ul class="key"><li><b class="k1"></b>A job, as long as it lasted</li><li><b class="k2"></b>My own practice, alongside</li>'
    + '<li><b class="k0"></b>School</li><li><b class="k3"></b>A case study. Rest on it to play, press to open.</li></ul></div>'));

  world.classList.toggle("rev", REV);
  /* the pages first: their words decide how wide they are. They are
     numbered in the order they are read. */
  const ORDER = CHAPTERS.slice().sort((a, b) => (T(a.at) - T(b.at)) * (REV ? -1 : 1));
  ORDER.forEach((c, i) => { c.no = String(i + 1).padStart(2, "0"); });
  PAGES = ORDER.map((c) => {
    const pg = el("section", "pg", '<div class="flow"><div class="head"><div class="num">' + c.no + '</div><div class="when">' + c.when + "</div><h2>" + c.title
      + '</h2><p class="lede">' + c.lede + "</p></div>" + c.body.map((t) => "<p>" + t + "</p>").join("")
      + '<div class="yours"><b>Yours to write</b>' + c.yours + "</div></div>");
    world.appendChild(pg);
    return { c, el: pg, t: T(c.at), x: 0, w: 0 };
  });
  PAGES.forEach((p) => {
    const flow = p.el.firstChild, left = flow.getBoundingClientRect().left;
    let right = left; [...flow.children].forEach((k) => { right = Math.max(right, k.getBoundingClientRect().right); });
    const cols = Math.max(1, Math.ceil((right - left - 2) / (COL_W + COL_GAP)));
    p.w = PG_L + cols * COL_W + (cols - 1) * COL_GAP + PG_R; p.cols = cols;
    /* more than one column is a spread: the words are shared out between
       them, so a page never carries one full column and one stray line */
    if (cols > 1) { flow.style.width = (cols * COL_W + (cols - 1) * COL_GAP) + "px"; flow.style.columnFill = "balance"; }
  });
  layoutX();
  PAGES.forEach((p) => { p.el.style.left = p.x + "px"; p.el.style.width = p.w + "px"; });
  const LEFT = SEQ[0].x, RIGHT = SEQ[SEQ.length - 1].x + SEQ[SEQ.length - 1].w;
  world.style.width = (RIGHT + TAIL) + "px";

  /* a rule where a year turns, unless it would stand just ahead of a page's
     edge, and the year's name at the head of the first stretch of it that
     has room for a name: a year that turns just before a page is named
     after the page, where the chart picks up again */
  for (let y = Y0; y <= Y1; y++) {
    const x = XS(y);
    if (!PAGES.some((p) => p.x - x >= 0 && p.x - x < 30)) { const r = el("i", "yr"); r.style.left = x + "px"; world.appendChild(r); }
    const mine = SEQ.filter((sp) => Math.floor(sp.t0 + 1e-9) === y), sp = mine.find((q) => q.w >= 44) || mine[0];
    if (sp) { const l = el("span", "yl", String(y)); l.style.left = sp.x + "px"; placed.push(() => { l.style.top = (V.axis + 8) + "px"; }); world.appendChild(l); }
  }
  const axis = el("i"); axis.id = "axis"; axis.style.cssText = "left:" + LEFT + "px;width:" + (RIGHT - LEFT) + "px"; placed.push(() => { axis.style.top = V.axis + "px"; }); world.appendChild(axis);
  /* "Now" stands off the end of the axis that is now: after it going
     forwards, ahead of it going back */
  { const n = el("span", "now", "Now"); n.style.left = (REV ? LEFT - NOW_ROOM : RIGHT) + "px"; placed.push(() => { n.style.top = (V.axis - 8) + "px"; }); world.appendChild(n); }

  /* the jobs */
  ROLES.forEach((r) => {
    const b = el("div", "bar " + r.kind, "<em>" + r.org + " <span>" + r.title + "</span></em>");
    const xa = XS(r.s), xb = XE(r.e), x0 = Math.min(xa, xb), x1 = Math.max(xa, xb);
    b.style.cssText = "left:" + x0 + "px;width:" + Math.max(8, x1 - x0 - 2) + "px";
    placed.push(() => { b.style.top = (V.lane0 + r.lane * V.lane) + "px"; });
    b.dataset.r = r.id; byId[r.id] = { r, b, x0, x1, lab: b.firstChild };
    world.appendChild(b);
  });

  /* the notes, packed in two rows so none stands on another, or on a page.
     A note hangs towards the later side of its date, under its own bar:
     to the right going forwards, to the left going back. */
  { const ends = [0, 0];
    NOTES.map((n) => { const anchor = XS(n.at), bar = byId[n.r];
      return { n, anchor, x: REV ? Math.max(anchor - W_NOTE, bar.x0) : anchor + 2 }; })
      .sort((a, b) => a.x - b.x).forEach(({ n, anchor, x }) => {
      const row = ends[0] <= x ? 0 : (ends[1] <= x ? 1 : (ends[0] <= ends[1] ? 0 : 1));
      const nx = clearOfPages(Math.max(x, ends[row]), W_NOTE, Math.max(ends[row], LEFT), anchor);
      ends[row] = nx + W_NOTE + 22;
      const y = String(n.at[0]);
      const d = el("div", "note", '<div class="y">' + y.slice(0, 2) + "<br>" + y.slice(2) + "</div><p>" + n.t + "</p>");
      const lane = byId[n.r].r.lane;
      d.style.left = nx + "px";
      /* the leader stands on the date, wherever the note had to sit */
      d.style.setProperty("--lx", Math.max(0, Math.min(W_NOTE - 1, anchor - nx - (REV ? 1 : 0))) + "px");
      placed.push(() => {
        const top = V.note0 + row * V.noteRow, from = V.lane0 + lane * V.lane + V.laneH;
        d.style.top = top + "px"; d.style.setProperty("--lead", (row ? 12 : Math.max(0, top - from - 8)) + "px");
      });
      d.dataset.r = n.r; world.appendChild(d);
    });
  }

  /* the studies, packed in two rows over the axis */
  { const ends = [0, 0], order = [1, 0], seen = {};
    STUDIES.slice().sort((a, b) => (a.at - b.at) * (REV ? -1 : 1)).forEach((s) => {
      const i = seen[s.y] = (seen[s.y] == null ? 0 : seen[s.y] + 1);
      const mid = XS(s.at), want = mid - W_ST / 2;
      let row = order[i % 2];
      if (ends[row] > want) row = ends[0] <= ends[1] ? 0 : 1;
      const x = clearOfPages(Math.max(want, ends[row], LEFT), W_ST, Math.max(ends[row], LEFT), mid);
      ends[row] = x + W_ST + 16;
      const a = el("a", "st", '<span class="pic"><img alt="" loading="lazy" decoding="async" src="' + encodeURI(s.frames[0] || "") + '"></span>'
        + '<span class="cap">' + s.t + ' <span data-full="' + s.s + '">' + s.s + "</span></span>");
      a.href = "/case-studies/" + s.h;
      a.style.left = x + "px";
      placed.push(() => {
        const top = TOP + row * V.row;
        a.style.top = top + "px"; a.style.setProperty("--lead", Math.max(0, V.axis - (top + V.pic + 6 + 32) - 8) + "px");
      });
      /* a faux reel in miniature: the study's own frames, cut while the hand rests */
      let t = 0, k = 0; const im = a.querySelector("img");
      a.addEventListener("pointerenter", () => {
        if (s.frames.length < 2) return;
        s.frames.forEach((f) => { const p = new Image(); p.src = encodeURI(f); });
        clearInterval(t); t = setInterval(() => { k = (k + 1) % s.frames.length; im.src = encodeURI(s.frames[k]); }, 620);
      });
      a.addEventListener("pointerleave", () => { clearInterval(t); k = 0; im.src = encodeURI(s.frames[0]); });
      world.appendChild(a);
    });
  }

  /* the rail is the contents */
  PAGES.forEach((p) => {
    const b = el("button", "era", "<span>" + p.c.name + "</span><sup>" + p.c.no + "</sup>"); b.type = "button";
    b.addEventListener("click", () => go(p.x));
    eras.appendChild(b); p.btn = b;
  });
  ["About", "Connect", "Ask"].forEach((n) => { const a = el("a", "era door", "<span>" + n + "</span>"); a.href = "/"; eras.appendChild(a); });

  fitRules(); fitCaps(); drawMap(); fitV();
  if (keep != null) stage.scrollLeft = wasAt < 40 ? 0 : XS(keep) - stage.clientWidth / 2;
  /* ?at=2016.5 opens on that moment, as the looks do, so the compare page
     can frame today's version beside them */
  else { const q = new URLSearchParams(location.search).get("at"); if (q) stage.scrollLeft = Math.max(0, XS(+q) - stage.clientWidth * 0.18); }
  onScroll();
};

/* a bar under the hand lights its own notes */
world.addEventListener("pointerover", (e) => {
  const b = e.target.closest(".bar, .note"); if (!b) return;
  const id = b.dataset.r;
  world.classList.add("dim");
  world.querySelectorAll(".bar, .note").forEach((n) => n.classList.toggle("lit", n.dataset.r === id));
});
world.addEventListener("pointerout", (e) => { if (e.target.closest(".bar, .note")) { world.classList.remove("dim"); world.querySelectorAll(".lit").forEach((n) => n.classList.remove("lit")); } });

/* ── the foot: true to scale, and the scrubber. A tick where a chapter opens. ── */
const T0 = T([Y0, 8]), T1 = T(NOW) + 0.35;
const mapX = (t) => ((REV ? T1 - t : t - T0) / (T1 - T0)) * map.clientWidth;
const win = el("div", "win");
function drawMap() {
  map.textContent = "";
  ROLES.forEach((r) => { const m = el("i", "mb " + r.kind), a = mapX(T(r.s)), b = mapX(T(r.e)); m.style.cssText = "left:" + Math.min(a, b) + "px;width:" + Math.max(2, Math.abs(b - a) - 1) + "px;top:" + (r.lane * 8) + "px"; map.appendChild(m); });
  PAGES.forEach((p) => { const m = el("i", "mt"); m.style.left = Math.min(map.clientWidth - 1, Math.max(0, mapX(Math.max(T0, p.t)))) + "px"; map.appendChild(m); });
  for (let y = 2000; y <= Y1; y += 2) { const l = el("span", "ml", String(y)); l.style.left = mapX(y) + "px"; map.appendChild(l); }
  map.appendChild(win);
}
function onScroll() {
  if (!SPANS.length) return;
  const L = stage.scrollLeft, a = timeAt(L), b = timeAt(L + stage.clientWidth);
  const ma = mapX(Math.max(T0, a)), mb = mapX(Math.max(T0, b)), l = Math.max(0, Math.min(ma, mb)), r = Math.min(map.clientWidth, Math.max(ma, mb));
  win.style.left = l + "px"; win.style.width = Math.max(10, r - l) + "px";
  /* the chapter under the near third of the glass; at the far end there is
     no further to pan, so the last one takes the ink */
  const atEnd = L + stage.clientWidth >= stage.scrollWidth - 40, probe = L + stage.clientWidth * 0.3;
  let front = null; PAGES.forEach((p) => { if (p.x <= probe) front = p; }); if (atEnd) front = PAGES[PAGES.length - 1];
  PAGES.forEach((p) => p.btn.classList.toggle("front", p === front));
  /* the years on the glass, in the order the glass shows them */
  const yr = (t) => Math.min(Y1, Math.max(Y0, Math.floor(t - 1e-6))), y0 = yr(a), y1 = yr(b);
  range.textContent = (front ? front.c.no + " " + front.c.name + " · " : "") + (y0 === y1 ? y0 : y0 + " to " + y1);
  /* a long bar's name stays on the glass while the bar crosses it, and
     steps out from under a page rather than reading through it */
  Object.values(byId).forEach((o) => {
    const lw = o.lab.offsetWidth, room = Math.max(0, (o.x1 - o.x0) - lw - 24);
    let lx = Math.max(o.x0 + 9, L + 13);
    PAGES.forEach((p) => { if (lx < p.x + p.w + 12 && lx + lw > p.x - 12) lx = p.x + p.w + 12; });
    o.lab.style.transform = "translateX(" + Math.min(Math.max(0, lx - o.x0 - 9), room) + "px)";
  });
}
stage.addEventListener("scroll", onScroll, { passive: true });
{ let t = 0; addEventListener("resize", () => { clearTimeout(t); t = setTimeout(build, 140); }, { passive: true }); }
build();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
const scrub = (e) => { const r = map.getBoundingClientRect(), f = (e.clientX - r.left) / r.width; const t = REV ? T1 - f * (T1 - T0) : T0 + f * (T1 - T0); stage.scrollLeft = XS(Math.min(Math.max(t, Y0), T(NOW))) - stage.clientWidth / 2; };
let scrubbing = false;
map.addEventListener("pointerdown", (e) => { scrubbing = true; map.setPointerCapture(e.pointerId); scrub(e); });
map.addEventListener("pointermove", (e) => { if (scrubbing) scrub(e); });
map.addEventListener("pointerup", () => { scrubbing = false; });

/* a wheel either way pans the world; arrows too */
stage.addEventListener("wheel", (e) => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { e.preventDefault(); stage.scrollLeft += e.deltaY; } }, { passive: false });
addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") stage.scrollLeft += 240; if (e.key === "ArrowLeft") stage.scrollLeft -= 240;
  /* Page Down and Page Up turn to the next chapter and the last */
  if (e.key === "PageDown" || e.key === "PageUp") { e.preventDefault(); const L = stage.scrollLeft, fwd = e.key === "PageDown";
    const to = fwd ? PAGES.find((p) => p.x > L + 8) : PAGES.slice().reverse().find((p) => p.x < L - 8); go(to ? to.x : (fwd ? stage.scrollWidth : 0)); }
});
</script>
</body>
