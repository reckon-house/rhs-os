<!-- ── THE TIMELINE VIEW, A MOCK (20 Sept 2026) ───────────────────────
     His idea: a toggle on the board, Projects | Timeline, the same
     work sorted by time, "because there's no story it's just
     projects". Then, the same day: "a timeline meets a small book
     with chapters, narration type of thing". This page is the mock he
     asked for before any of it is built into the board. It is
     standalone on purpose: the board's engine is not touched, and
     nothing here is wired to it.

     THE CHART. The grammar is the board's (the mark, the tight ruled
     rail at the statement's size, hairlines, 12px captions, a name on
     its side) and the chart's is from his references: a rule at every
     year, jobs as bars whose length is their duration, his own
     practice as a bar running under all of them, notes hung off
     leaders with the year stacked in two lines, case studies as small
     reels that play under the hand and open their study.

     THE BOOK. Eight chapters. A chapter opens on a PAGE laid over the
     timeline at the date it starts: a numeral, the years, the name, one
     big first sentence, then a few paragraphs. The page is paper, so a
     bar that runs through a chapter's start (his practice, from 2012)
     goes under it and comes out the other side. A page is as wide as
     its words: the text flows into columns of one measure at the
     window's height, and the page takes as many as it needs. The rail
     is the contents. Between pages the notes carry the voice.

     THE WORDS ARE HIS, STITCHED. Every sentence on a page is from his
     LinkedIn, his résumé or what he typed in the session, edited for
     spelling, length and order and nothing else (VOICE.md: "Get his
     raw words first... Edit lightly... Do not restate"). Nothing says
     WHY he moved or WHAT a job taught him, because he has not said.
     Each page ends on "Yours to write" with the question that gap
     needs. Those blocks are notes to him and come out before this
     ships anywhere.

     ONE FACT, ONE HOME. A page tells what a stretch was; a note pins
     one fact to a date. No fact is in both. Facts with no date of
     their own sit at the start of the role LinkedIn lists them under,
     or where they fit inside it. He knows the placement is
     approximate.

     DATES ARE LINKEDIN'S (his call), with one exception he confirmed:
     Neiman Marcus starts in 2006, as the résumé has it. LinkedIn only
     lists it from Aug 2009. The first job is Applied Media Resources
     (LinkedIn's "Applied Media", the résumé's "AMR Inc."); the rail
     says AMR because the full name is wider than the rail.
     A study's year is its own `published` field, and a year's studies
     are spread across it, except where the chapter a study belongs to
     is plain (STUDY_AT).

     THE MAIN AXIS IS SPACED BY WHAT HAPPENED, NOT BY THE CALENDAR: the
     axis is cut at every new year and at every page, and each stretch
     is as wide as the pictures, notes and bar labels in it need, with
     a floor so a quiet year still passes. The strip at the foot is
     the honest one, true to scale, and it is also the scrubber. -->

  world.style.setProperty("--pic-h", V.pic + "px"); world.style.setProperty("--lane-h", V.laneH + "px");
  placed.forEach((fn) => fn());
};
const fitV = () => {
  const foot = map.getBoundingClientRect().top - 18;
  for (let i = 0; i <= 5; i++) {
    pitch(i / 5);
    let low = 0; world.querySelectorAll(".note").forEach((n) => { low = Math.max(low, n.offsetTop + n.offsetHeight); });
    if (low <= foot) break;
  }
};
const go = (x) => stage.scrollTo({ left: Math.max(0, x), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
const fitRules = () => document.querySelectorAll(".era").forEach((b) => b.style.setProperty("--w", Math.round(b.firstChild.getBoundingClientRect().width) + "px"));
/* a caption is two lines and never ends on a comma: a discipline gives up
   its last phrase, whole, until what is left fits */
const fitCaps = () => world.querySelectorAll(".st .cap").forEach((c) => {
  const d = c.querySelector("span"); if (!d) return;
  const parts = d.dataset.full.split(", ");
  d.textContent = parts.join(", ");
  while (parts.length && c.scrollHeight > c.clientHeight + 1) { parts.pop(); d.textContent = parts.join(", "); }
});

/* ── the build. It runs again when the window changes, because a page is
   as wide as its words at THIS height, and everything after a page
   stands where the page ends. ── */
const build = () => {
  const keep = SPANS.length ? timeAt(stage.scrollLeft + stage.clientWidth / 2) : null, wasAt = stage.scrollLeft;
  world.textContent = ""; eras.textContent = ""; placed.length = 0; Object.keys(byId).forEach((k) => delete byId[k]);

  /* the cover: the view's name on its side, as a run's is. The sentence is
     his, from LinkedIn. */
  world.appendChild(el("div", "intro", '<div class="spine">Timeline</div><div class="body"><p class="lede">Different mediums but the same attention given to all of it, because I really do love the work.</p>'
    + '<ul class="key"><li><b class="k1"></b>A job, as long as it lasted</li><li><b class="k2"></b>My own practice, alongside</li>'
    + '<li><b class="k0"></b>School</li><li><b class="k3"></b>A case study. Rest on it to play, press to open.</li></ul></div>'));

  /* the pages first: their words decide how wide they are */
  PAGES = CHAPTERS.map((c) => {
    const pg = el("section", "pg", '<div class="flow"><div class="head"><div class="num">' + c.no + '</div><div class="when">' + c.when + "</div><h2>" + c.title
      + '</h2><p class="lede">' + c.lede + "</p></div>" + c.body.map((t) => "<p>" + t + "</p>").join("")
      + '<div class="yours"><b>Yours to write</b>' + c.yours + "</div></div>");
    world.appendChild(pg);
    return { c, el: pg, t: T(c.at), x: 0, w: 0 };
  });
  PAGES.forEach((p) => {
    const flow = p.el.firstChild, left = flow.getBoundingClientRect().left;
    let right = left; [...flow.children].forEach((k) => { right = Math.max(right, k.getBoundingClientRect().right); });
    const cols = Math.max(1, Math.ceil((right - left - 2) / (COL_W + COL_GAP)));
    p.w = PG_L + cols * COL_W + (cols - 1) * COL_GAP + PG_R; p.cols = cols;
    /* more than one column is a spread: the words are shared out between
       them, so a page never carries one full column and one stray line */
    if (cols > 1) { flow.style.width = (cols * COL_W + (cols - 1) * COL_GAP) + "px"; flow.style.columnFill = "balance"; }
  });
  layoutX();
  PAGES.forEach((p) => { p.el.style.left = p.x + "px"; p.el.style.width = p.w + "px"; });
  const END = XE(NOW);
  world.style.width = (END + TAIL) + "px";

  /* a rule at every year, and the axis. A year that turns just before a
     page is named after it, where the chart picks up again. */
  for (let y = Y0; y <= Y1 + 1; y++) {
    const x = XS(y), pg = PAGES.find((p) => p.x - x >= 0 && p.x - x < 48);
    if (!pg) { const r = el("i", "yr"); r.style.left = x + "px"; world.appendChild(r); }
    if (y <= Y1) { const l = el("span", "yl", String(y)); l.style.left = (pg ? pg.x + pg.w + 24 : x) + "px"; placed.push(() => { l.style.top = (V.axis + 8) + "px"; }); world.appendChild(l); }
  }
  const axis = el("i"); axis.id = "axis"; axis.style.cssText = "left:" + SPANS[0].x + "px;width:" + (END - SPANS[0].x) + "px"; placed.push(() => { axis.style.top = V.axis + "px"; }); world.appendChild(axis);
  { const n = el("span", "now", "Now"); n.style.left = END + "px"; placed.push(() => { n.style.top = (V.axis - 8) + "px"; }); world.appendChild(n); }

  /* the jobs */
  ROLES.forEach((r) => {
    const b = el("div", "bar " + r.kind, "<em>" + r.org + " <span>" + r.title + "</span></em>");
    const x0 = XS(r.s), x1 = XE(r.e);
    b.style.cssText = "left:" + x0 + "px;width:" + Math.max(8, x1 - x0 - 2) + "px";
    placed.push(() => { b.style.top = (V.lane0 + r.lane * V.lane) + "px"; });
    b.dataset.r = r.id; byId[r.id] = { r, b, x0, x1, lab: b.firstChild };
    world.appendChild(b);
  });

  /* the notes, packed in two rows so none stands on another, or on a page */
  { const ends = [0, 0];
    NOTES.slice().sort((a, b) => T(a.at) - T(b.at)).forEach((n) => {
      const x = XS(n.at) + 2;
      const row = ends[0] <= x ? 0 : (ends[1] <= x ? 1 : (ends[0] <= ends[1] ? 0 : 1));
      const nx = clearOfPages(Math.max(x, ends[row]), W_NOTE, Math.max(ends[row], SPANS[0].x), W_NOTE - 24);
      ends[row] = nx + W_NOTE + 22;
      const y = String(n.at[0]);
      const d = el("div", "note", '<div class="y">' + y.slice(0, 2) + "<br>" + y.slice(2) + "</div><p>" + n.t + "</p>");
      const lane = byId[n.r].r.lane;
      d.style.left = nx + "px";
      /* the leader stands on the date, wherever the note had to sit */
      d.style.setProperty("--lx", Math.max(0, Math.min(W_NOTE - 8, x - 2 - nx)) + "px");
      placed.push(() => {
        const top = V.note0 + row * V.noteRow, from = V.lane0 + lane * V.lane + V.laneH;
        d.style.top = top + "px"; d.style.setProperty("--lead", (row ? 12 : Math.max(0, top - from - 8)) + "px");
      });
      d.dataset.r = n.r; world.appendChild(d);
    });
  }

  /* the studies, packed in two rows over the axis */
  { const ends = [0, 0], order = [1, 0], seen = {};
    STUDIES.slice().sort((a, b) => a.at - b.at).forEach((s) => {
      const i = seen[s.y] = (seen[s.y] == null ? 0 : seen[s.y] + 1);
      const want = XS(s.at) - W_ST / 2;
      let row = order[i % 2];
      if (ends[row] > want) row = ends[0] <= ends[1] ? 0 : 1;
      const x = clearOfPages(Math.max(want, ends[row], SPANS[0].x), W_ST, Math.max(ends[row], SPANS[0].x), W_ST * 2);
      ends[row] = x + W_ST + 16;
      const a = el("a", "st", '<span class="pic"><img alt="" loading="lazy" decoding="async" src="' + encodeURI(s.frames[0] || "") + '"></span>'
        + '<span class="cap">' + s.t + ' <span data-full="' + s.s + '">' + s.s + "</span></span>");
      a.href = "/case-studies/" + s.h;
      a.style.left = x + "px";
      placed.push(() => {
        const top = TOP + row * V.row;
        a.style.top = top + "px"; a.style.setProperty("--lead", Math.max(0, V.axis - (top + V.pic + 6 + 32) - 8) + "px");
      });
      /* a faux reel in miniature: the study's own frames, cut while the hand rests */
      let t = 0, k = 0; const im = a.querySelector("img");
      a.addEventListener("pointerenter", () => {
        if (s.frames.length < 2) return;
        s.frames.forEach((f) => { const p = new Image(); p.src = encodeURI(f); });
        clearInterval(t); t = setInterval(() => { k = (k + 1) % s.frames.length; im.src = encodeURI(s.frames[k]); }, 620);
      });
      a.addEventListener("pointerleave", () => { clearInterval(t); k = 0; im.src = encodeURI(s.frames[0]); });
      world.appendChild(a);
    });
  }

  /* the rail is the contents */
  PAGES.forEach((p) => {
    const b = el("button", "era", "<span>" + p.c.name + "</span><sup>" + p.c.no + "</sup>"); b.type = "button";
    b.addEventListener("click", () => go(p.x));
    eras.appendChild(b); p.btn = b;
  });
  ["About", "Connect", "Ask"].forEach((n) => { const a = el("a", "era door", "<span>" + n + "</span>"); a.href = "/"; eras.appendChild(a); });

  fitRules(); fitCaps(); drawMap(); fitV();
  if (keep != null) stage.scrollLeft = wasAt < 40 ? 0 : XS(keep) - stage.clientWidth / 2;
  onScroll();
};

/* a bar under the hand lights its own notes */
world.addEventListener("pointerover", (e) => {
  const b = e.target.closest(".bar, .note"); if (!b) return;
  const id = b.dataset.r;
  world.classList.add("dim");
  world.querySelectorAll(".bar, .note").forEach((n) => n.classList.toggle("lit", n.dataset.r === id));
});
world.addEventListener("pointerout", (e) => { if (e.target.closest(".bar, .note")) { world.classList.remove("dim"); world.querySelectorAll(".lit").forEach((n) => n.classList.remove("lit")); } });

/* ── the foot: true to scale, and the scrubber. A tick where a chapter opens. ── */
const T0 = T([Y0, 8]), T1 = T(NOW) + 0.35;
const mapX = (t) => ((t - T0) / (T1 - T0)) * map.clientWidth;
const win = el("div", "win");
function drawMap() {
  map.textContent = "";
  ROLES.forEach((r) => { const m = el("i", "mb " + r.kind); m.style.cssText = "left:" + mapX(T(r.s)) + "px;width:" + Math.max(2, mapX(T(r.e)) - mapX(T(r.s)) - 1) + "px;top:" + (r.lane * 8) + "px"; map.appendChild(m); });
  PAGES.forEach((p) => { const m = el("i", "mt"); m.style.left = Math.max(0, mapX(p.t)) + "px"; map.appendChild(m); });
  for (let y = 2000; y <= Y1; y += 2) { const l = el("span", "ml", String(y)); l.style.left = mapX(y) + "px"; map.appendChild(l); }
  map.appendChild(win);
}
function onScroll() {
  if (!SPANS.length) return;
  const L = stage.scrollLeft, a = timeAt(L), b = timeAt(L + stage.clientWidth);
  const l = Math.max(0, mapX(Math.max(T0, a))), r = Math.min(map.clientWidth, mapX(b));
  win.style.left = l + "px"; win.style.width = Math.max(10, r - l) + "px";
  /* the chapter under the near third of the glass; at the far end there is
     no further to pan, so the last one takes the ink */
  const atEnd = L + stage.clientWidth >= stage.scrollWidth - 40, probe = L + stage.clientWidth * 0.3;
  let front = null; PAGES.forEach((p) => { if (p.x <= probe) front = p; }); if (atEnd) front = PAGES[PAGES.length - 1];
  PAGES.forEach((p) => p.btn.classList.toggle("front", p === front));
  const y0 = L < INTRO - 120 ? Y0 : Math.floor(a), y1 = Math.min(Y1, Math.floor(b));
  range.textContent = (front ? front.c.no + " " + front.c.name + " · " : "") + (y0 === y1 ? y0 : y0 + " to " + y1);
  /* a long bar's name stays on the glass while the bar crosses it, and
     steps out from under a page rather than reading through it */
  Object.values(byId).forEach((o) => {
    const lw = o.lab.offsetWidth, room = Math.max(0, (o.x1 - o.x0) - lw - 24);
    let lx = Math.max(o.x0 + 9, L + 13);
    PAGES.forEach((p) => { if (lx < p.x + p.w + 12 && lx + lw > p.x - 12) lx = p.x + p.w + 12; });
    o.lab.style.transform = "translateX(" + Math.min(Math.max(0, lx - o.x0 - 9), room) + "px)";
  });
}
stage.addEventListener("scroll", onScroll, { passive: true });
{ let t = 0; addEventListener("resize", () => { clearTimeout(t); t = setTimeout(build, 140); }, { passive: true }); }
build();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
const scrub = (e) => { const r = map.getBoundingClientRect(); const t = T0 + ((e.clientX - r.left) / r.width) * (T1 - T0); stage.scrollLeft = XS(Math.min(Math.max(t, Y0), T(NOW))) - stage.clientWidth / 2; };
let scrubbing = false;
map.addEventListener("pointerdown", (e) => { scrubbing = true; map.setPointerCapture(e.pointerId); scrub(e); });
map.addEventListener("pointermove", (e) => { if (scrubbing) scrub(e); });
map.addEventListener("pointerup", () => { scrubbing = false; });

/* a wheel either way pans the world; arrows too */
stage.addEventListener("wheel", (e) => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { e.preventDefault(); stage.scrollLeft += e.deltaY; } }, { passive: false });
addEventListener("keydown", (e) => { if (e.key === "ArrowRight") stage.scrollLeft += 240; if (e.key === "ArrowLeft") stage.scrollLeft -= 240; });
</script>
</body>
