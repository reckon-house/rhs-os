<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Timeline, the poster · Reckon*House</title>
<!-- ── LOOK B: THE POSTER (22 Sept 2026) ──────────────────────────────
     Swiss, and loud where it counts. A job is a black slab as long as
     the job was, its employer set white inside it at the statement's
     size; a gap between jobs is white paper. His practice runs under it
     as a cream band. Each year is its number, stacked in two and set
     huge: the stacked year the notes already use, made the page's one
     graphic device instead of being repeated nineteen times at 32px.
     The pictures are squares in a single row along the foot, in black
     and white as the Pressing C skin desaturates its photography, and
     they come back to colour under the hand. There is no scale strip at
     the foot: the slabs are the scale. -->
<link rel="stylesheet" href="/lab/timeline-looks/base.css">
<style>
  :root { --pg-foot: 40px; }
  #map { display: none; }

  /* a year: its number stacked in two, huge */
  .yh { position: absolute; display: flex; align-items: flex-start; gap: 28px; will-change: transform; }
  .n2 { flex: none; font-size: 128px; font-weight: 700; letter-spacing: -0.05em; line-height: 0.8;
    font-variant-numeric: tabular-nums; will-change: transform; }
  .n2.q { font-size: 32px; line-height: 0.86; color: rgba(0, 0, 0, 0.28); }
  .pn { flex: none; width: 236px; margin: 4px 0 0; font-size: 14px; font-weight: 500; line-height: 1.45; letter-spacing: -0.006em; }
  .pn b { font-weight: 700; }

  /* the jobs: black slabs; what ran alongside, cream */
  .sl { position: absolute; background: var(--ink); color: #fff; overflow: hidden; }
  .sl.edu { background: #E6E6E6; color: var(--ink); }
  .sl.line { background: var(--cream); color: var(--ink); }
  .slin { position: absolute; left: 0; top: 0; padding: 14px 16px; white-space: nowrap; will-change: transform; }
  .slin b { display: block; font-size: 32px; font-weight: 700; letter-spacing: -0.05em; line-height: 1; margin-bottom: 8px; }
  .slin span { display: block; font-size: 12px; font-weight: 500; letter-spacing: -0.004em; opacity: 0.62; }
  .sl.line .slin { padding: 0 10px; line-height: 20px; }
  .sl.line .slin b { display: inline; font-size: 12px; font-weight: 700; letter-spacing: -0.004em; margin: 0 6px 0 0; }
  .sl.line .slin span { display: inline; opacity: 0.55; }

  /* the pictures: squares along the foot, black and white until the hand rests */
  .sq { position: absolute; display: block; }
  .sq .pic { display: block; border-radius: 12px; overflow: hidden; background: var(--cream); }
  .sq img { display: block; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.08);
    transition: filter 0.45s ease; }
  .sq:hover img { filter: none; }
  .sq .cap { display: block; margin-top: 8px; font-size: 12px; font-weight: 600; letter-spacing: -0.004em; line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .key .kj { height: 12px; background: var(--ink); }
  .key .kc { height: 12px; background: var(--cream); }
  .key .kp { width: 22px; height: 22px; border-radius: 5px; background: #D8D8D8; margin-right: 12px; }
</style>
</head>
<body>
<a id="mark" href="/">Reckon<i>*</i>House</a>
<div id="range" aria-live="off"></div>
<aside id="rail" aria-label="Index">
  <div class="switch"><a href="/">Projects</a><span class="on">Timeline</span></div>
  <nav id="eras"></nav>
</aside>
<main id="stage"><div id="world"></div></main>
<div id="map" aria-hidden="true"></div>
<a id="look" href="/lab/timeline-looks/index.html">B · The poster<span>All looks →</span></a>
<script src="/lab/timeline-data.js"></script>
<script src="/lab/timeline-looks/engine.js"></script>
<script>
(function () {
const NUM = 128, NOTE_W = 236, NOTE_GAP = 28, SQ_GAP = 24, MARGIN = 64;
const geo = (H) => {
  const top = 114, slab = top + 232, pic = slab + 96 + 8 + 20 + 8 + 20 + 24;
  return { top, slab, l1: slab + 104, l2: slab + 132, pic, sq: Math.max(96, Math.min(176, H - pic - 50)) };
};
const numW = (api, y) => Math.max(api.textW("20", NUM, 700, -0.05), api.textW(String(y).slice(2), NUM, 700, -0.05));

TLE.start({
  key: '<li><b class="kj"></b>A job, as long as it lasted</li><li><b class="kc"></b>My own practice, alongside</li>'
    + '<li><b class="kp"></b>A case study, in black and white until you rest on it. Press to open.</li>',
  prepare(api) {
    const seen = new Set();
    api.SEQ.forEach((sp) => { sp.numeral = false; sp.quiet = false; });
    api.SEQ.forEach((sp) => { if (!seen.has(sp.year) && (sp.studies.length || sp.notes.length)) { sp.numeral = true; seen.add(sp.year); } });
    api.SEQ.forEach((sp) => { if (!seen.has(sp.year) && sp.t1 - sp.t0 >= 0.5) { sp.quiet = true; seen.add(sp.year); } });
    /* every slab names its employer: a long one read from its middle
       still says whose it is */
    api.ROLES.forEach((r) => { r.showName = true; });
  },
  need(sp, api) {
    const G = geo(api.H);
    const sq = sp.studies.length ? sp.studies.length * (G.sq + SQ_GAP) - SQ_GAP : 0;
    const nw = sp.notes.length ? sp.notes.length * NOTE_W + (sp.notes.length - 1) * NOTE_GAP : 0;
    const top = sp.numeral ? numW(api, sp.year) + (nw ? 28 + nw : 0) : nw;
    const content = Math.max(sq, top);
    const floor = (sp.t1 - sp.t0) * (sp.t0 < 2002 ? 64 : 110);
    return content ? Math.max(content + MARGIN, floor) : floor;
  },
  labelNeed(r, api) {
    if (r.lane === 0) return Math.max(r.showName ? api.textW(r.org, 32, 700, -0.05) : 0, api.textW(r.title, 12, 500)) + 40;
    return api.textW(r.org, 12, 700) + 6 + api.textW(r.title, 12, 500) + 30;
  },
  render(api) {
    const G = geo(api.H), W = api.world, el = api.el;
    /* the slabs */
    api.ROLES.forEach((r) => {
      const xa = api.XS(r.s), xb = api.XE(r.e), x0 = Math.min(xa, xb), x1 = Math.max(xa, xb) - 3;
      const y = r.lane === 0 ? G.slab : r.lane === 1 ? G.l1 : G.l2, h = r.lane === 0 ? 96 : 20;
      const sl = el("div", "sl " + r.kind); sl.dataset.r = r.id;
      sl.style.cssText = "left:" + x0 + "px;top:" + y + "px;width:" + Math.max(3, x1 - x0) + "px;height:" + h + "px";
      const inn = el("div", "slin", (r.lane > 0 || r.showName ? "<b>" + r.org + "</b>" : "") + "<span>" + r.title + "</span>");
      sl.appendChild(inn); W.appendChild(sl);
      /* the name rides inside its slab (onScroll below) */
      inn.__slab = x0;
    });
    /* the years, and what each holds beside its number */
    api.SEQ.forEach((sp) => {
      const y2 = String(sp.year);
      /* the year's head: its number and what it holds, one block that stays
         on the glass while the year crosses it, so a long year (2023 is
         eight pictures wide) never leaves the top of the poster empty */
      if (sp.numeral || sp.quiet || sp.notes.length) {
        const yh = el("div", "yh"); yh.style.cssText = "left:" + sp.x + "px;top:" + G.top + "px";
        if (sp.numeral || sp.quiet) yh.appendChild(el("div", "n2" + (sp.quiet ? " q" : ""), y2.slice(0, 2) + "<br>" + y2.slice(2)));
        sp.notes.forEach((n) => { const p = el("p", "pn", n.t); p.dataset.r = n.r; yh.appendChild(p); });
        W.appendChild(yh);
        if (sp.numeral) api.stick(yh, sp.x, sp.x + sp.w - MARGIN / 2, 0);
      }
      /* the squares, along the foot */
      let x = sp.x;
      sp.studies.forEach((s) => {
        const a = el("a", "sq"); a.href = "/case-studies/" + s.h;
        a.style.cssText = "left:" + x + "px;top:" + G.pic + "px;width:" + G.sq + "px";
        const pic = el("span", "pic"); pic.style.height = G.sq + "px";
        const im = api.picture(s, G.sq); pic.appendChild(im); a.appendChild(pic);
        a.appendChild(el("span", "cap", s.t)); api.reel(a, s, im); W.appendChild(a);
        x += G.sq + SQ_GAP;
      });
    });
  },
  /* the stick helper keeps world coordinates; a slab's name lives inside
     its slab, so its coordinates are the slab's own */
  onScroll(api, L) {
    api.world.querySelectorAll(".slin").forEach((inn) => {
      const x0 = inn.__slab, w = inn.parentNode.offsetWidth, lw = inn.offsetWidth;
      let lx = Math.max(x0, L + 13);
      api.PAGES.forEach((p) => { if (lx < p.x + p.w + 12 && lx + lw > p.x - 12) lx = p.x + p.w + 12; });
      inn.style.transform = "translateX(" + Math.min(Math.max(0, lx - x0), Math.max(0, w - lw)) + "px)";
    });
  },
});
})();
</script>
</body>
</html>
