<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Timeline looks · Reckon*House</title>
<!-- ── THE LOOKS, SIDE BY SIDE (22 Sept 2026) ─────────────────────────
     His ask: "is there a way to make the graph maybe a little more
     editorial looking - more graphic? editorial meets minimal with some
     negative space?... should we do some visual concepts to look at some
     options?" Today's mock and four looks, each live in a frame at his
     laptop's size and scrollable in place, all moved to the same moment
     by the buttons. Every look reads the same facts in the same order;
     only the chart differs. -->
<style>
  @font-face { font-family: 'Avenir Next'; src: url('/fonts/AvenirNext-Medium.woff') format('woff'); font-weight: 500; font-display: swap; }
  @font-face { font-family: 'Avenir Next'; src: url('/fonts/AvenirNext-DemiBold.woff') format('woff'); font-weight: 600; font-display: swap; }
  @font-face { font-family: 'Avenir Next'; src: url('/fonts/AvenirNext-Bold.woff') format('woff'); font-weight: 700; font-display: swap; }
  :root { --ink: #000; --paper: #fff; --grey: rgba(0, 0, 0, 0.42); --hair: rgba(0, 0, 0, 0.13); --gut: 50px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  header { padding: 50px var(--gut) 28px; display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 20px; }
  .mark { font-size: 32px; font-weight: 700; letter-spacing: -0.05em; line-height: 1.2; }
  .mark i { font-style: normal; font-weight: 400; }
  h1 { margin: 34px 0 6px; font-size: 32px; font-weight: 700; letter-spacing: -0.05em; line-height: 1.2; }
  .sub { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.3; color: var(--grey); max-width: 34em; }
  .at { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .at span { font-size: 12px; font-weight: 600; color: var(--grey); margin-right: 6px; align-self: center; }
  .at button { border: 0; margin: 0; padding: 7px 12px; border-radius: 12px; background: rgba(0, 0, 0, 0.045); color: var(--ink);
    font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; transition: background-color 0.3s ease; }
  .at button:hover { background: rgba(0, 0, 0, 0.09); }
  .at button.on { background: var(--ink); color: #fff; }
  main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 44px 40px; padding: 8px var(--gut) 80px; }
  .card .frame { position: relative; width: 100%; overflow: hidden; border: 1px solid var(--hair); border-radius: 12px; background: var(--paper); }
  .card iframe { position: absolute; left: 0; top: 0; width: 1512px; height: 770px; border: 0; transform-origin: 0 0; }
  .card h2 { margin: 14px 0 4px; font-size: 20px; font-weight: 700; letter-spacing: -0.03em; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .card h2 a { font-size: 12px; font-weight: 600; letter-spacing: -0.004em; color: var(--grey); white-space: nowrap; transition: color 0.3s ease; }
  .card h2 a:hover { color: var(--ink); }
  .card p { margin: 0; font-size: 14px; font-weight: 500; line-height: 1.45; color: rgba(0, 0, 0, 0.72); max-width: 44em; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } header { grid-template-columns: 1fr; } .at { justify-content: flex-start; } }
</style>
</head>
<body>
<header>
  <div>
    <a class="mark" href="/">Reckon<i>*</i>House</a>
    <h1>The timeline, drawn five ways</h1>
    <p class="sub">The same facts, the same chapters, the same order in all of them. Only the chart changes. Each frame scrolls.</p>
  </div>
  <div class="at" id="at"><span>Show them all at</span></div>
</header>
<main id="cards"></main>
<script>
const LOOKS = [
  { name: "Today", href: "/lab/timeline.html", line: "What you have now: a rule at every year, jobs as bars, two rows of small pictures, the notes under them." },
  { name: "A · The wall", href: "/lab/timeline-looks/a-wall.html", line: "One line is the career, and the years hang off it, set big. The pictures hang above like prints, at two sizes, so the work the site leads with leads here too." },
  { name: "B · The poster", href: "/lab/timeline-looks/b-poster.html", line: "Jobs as black slabs, each year a huge stacked number, the pictures square and in black and white until you rest on one." },
  { name: "C · The chronology", href: "/lab/timeline-looks/c-chronology.html", line: "A column for each year, like the back pages of a monograph: the year over a heavy rule, which months each job held, then what happened, listed." },
  { name: "D · The spreads", href: "/lab/timeline-looks/d-spreads.html", line: "Each chapter is a spread: the page, one big picture, the notes in a margin, then the rest. The chart moves to the foot, like page numbers." },
];
const MOMENTS = [["The opening", null], ["2025", 2025.2], ["2023", 2023.6], ["2016", 2016.6], ["2009", 2009.5]];
const cards = document.getElementById("cards"), atBar = document.getElementById("at");
let at = 2016.6;
const frames = LOOKS.map((L) => {
  const c = document.createElement("section"); c.className = "card";
  c.innerHTML = '<div class="frame"><iframe loading="lazy" title="' + L.name + '"></iframe></div><h2><span>' + L.name + '</span><a href="' + L.href + '">Open it full size →</a></h2><p>' + L.line + "</p>";
  cards.appendChild(c);
  return { L, box: c.querySelector(".frame"), f: c.querySelector("iframe") };
});
const load = () => frames.forEach(({ L, f }) => { f.src = L.href + (at != null ? "?at=" + at : ""); });
const fit = () => frames.forEach(({ box, f }) => { const s = box.clientWidth / 1512; f.style.transform = "scale(" + s + ")"; box.style.height = Math.round(770 * s) + "px"; });
MOMENTS.forEach(([label, t]) => {
  const b = document.createElement("button"); b.type = "button"; b.textContent = label; if (t === at) b.classList.add("on");
  b.addEventListener("click", () => { at = t; atBar.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); load(); });
  atBar.appendChild(b);
});
fit(); load();
addEventListener("resize", fit, { passive: true });
</script>
</body>
</html>
