<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sally design system · Sizzle</title>
<meta name="robots" content="noindex">
<!-- The reel at the room cover's shape (16 by 10), on its own.
     ?w=1600 sets the box's width; ?sizzle=still&shot=N holds one shot. -->
<style>
  html, body { margin: 0; background: #fff; font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
  .box { position: relative; width: min(calc(100vw - 40px), var(--w, 1100px)); aspect-ratio: 16 / 10; margin: 20px auto; overflow: hidden; border-radius: 4px; background: #F4F3F1; }
  .box img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>
<div class="box" id="box"><img src="/lab/board-thumbs/hp/rhs-sally-design-system-homepage-the-edit.webp" alt=""></div>
<script src="sizzle.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get("w")) document.getElementById("box").style.setProperty("--w", +q.get("w") + "px");
  const still = q.get("sizzle") === "still";
  SallySizzle.mount(document.getElementById("box"), { still, shot: q.get("shot") != null ? +q.get("shot") : undefined });
</script>
</body>
</html>
