<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sally Beauty · The Lookbook on a phone, scrolling</title>
<meta name="robots" content="noindex">
<!-- His phone mockup, with the site scrolling in it (3 Oct 2026, his "i'm
     also attaching a mobile image we can insert into the case study - i
     dropped a placeholder image into it but i think we'll do the same
     thing - add a mockup to it via code"). His photograph, cropped wide to
     the laptop's 2000 by 1680 with the phone centred, and the live
     Lookbook laid onto its screen with device.js, as the laptop is. The
     four corners were measured off the photograph (each edge fitted where
     the screen's brightness falls halfway to the bezel's, then crossed);
     the screen's round corners (74 photo px) clip the page in its own
     plane, a black ground just past the edge keeps his placeholder from
     showing at any seam, and the island is drawn back on top. The page
     runs at 390 by 852, the screen's own proportion, so it shows its
     phone layout: down the wall of shades, then the Platinum Kit while
     the kit story plays, and back up. -->
<style>
  html, body { margin: 0; background: transparent; }
  .dev { position: relative; overflow: hidden; border-radius: 4px; background: #D8C2A3; }
  .dev > img { display: block; width: 100%; height: auto; }
  /* the screen: the page's own 390 by 852 viewport, mapped onto the glass */
  .glass { position: absolute; left: 0; top: 0; width: 390px; height: 852px; transform-origin: 0 0; }
  .under { position: absolute; inset: -3px; border-radius: 58px; background: #0E0E0E; }
  .screen { position: absolute; inset: 0; overflow: hidden; border-radius: 55px; background: #fff; }
  .screen iframe { display: block; width: 390px; height: 852px; border: 0; pointer-events: none; }
  /* the glass: a faint sheen and the bezel's soft edge, so the page sits under it */
  .screen::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(122deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0) 36%);
    box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.3); }
  .island { position: absolute; background: #0B0B0B; }
</style>
</head>
<body>
<div class="dev" id="dev">
  <img src="/case-studies/sally-design-system/sally-design-system-mockup-lookbook-phone-wide.jpg" alt="The Lookbook homepage on a phone standing on a curved wooden shelf, scrolling down the wall of shades to the Platinum Kit" width="2000" height="1680">
  <div class="glass" id="glass">
    <i class="under" aria-hidden="true"></i>
    <div class="screen"><iframe id="page" src="lookbook-images.html" title="The Lookbook" tabindex="-1" aria-hidden="true"></iframe></div>
  </div>
  <i class="island" id="island" aria-hidden="true"></i>
</div>
<script src="device.js"></script>
<script>
(() => {
  /* measured off sally-design-system-mockup-lookbook-phone-wide.jpg, 2000 by
     1680 (his sally-mobile.jpg from y 604 down), TL TR BR BL */
  Device.place({
    box: document.getElementById("dev"), glass: document.getElementById("glass"), photoW: 2000, view: [390, 852],
    corners: [[746.0, 266.7], [1274.5, 264.6], [1267.5, 1415.3], [743.5, 1413.5]],
    marks: [{ el: document.getElementById("island"), x: 926, y: 283, w: 166, h: 47, round: "pill" }],
  });
  /* the scroll: a thumb's worth at a time down the wall, then the kit,
     held while its story plays (the bag fills in the nav), then back up */
  Device.scroll({
    frame: document.getElementById("page"),
    plan: (w, d) => {
      const nav = d.querySelector(".sk-nav"), story = d.querySelector(".vs"), side = d.querySelector(".st-kitb .st-side");
      const top = (el) => el.getBoundingClientRect().top + w.scrollY;
      const navH = nav ? nav.offsetHeight : 54, VH = w.innerHeight;
      /* the nav pill just under the glass's top edge, as his placeholder has it */
      const y0 = nav ? Math.max(0, Math.round(top(nav) - 10)) : 0;
      const end = story ? Math.round(top(story) + story.offsetHeight - VH) : y0 + 1950;
      const kit = side ? Math.round(top(side) - navH - 30) : end + 1600;
      const stops = [y0];
      for (let y = y0 + 640; y < end - 160; y += 640) stops.push(y);
      stops.push(end);
      const steps = [{ y: y0, hold: 1800 }];
      for (let i = 1; i < stops.length; i++) steps.push({ y: stops[i], move: 1400, hold: 1300 });
      steps.push({ y: kit, move: 1900, hold: 8600 });
      steps.push({ y: y0, move: 2600, hold: 600 });
      return steps;
    },
  });
})();
</script>
</body>
</html>
