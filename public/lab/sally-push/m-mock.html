<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sally Beauty · Mockup placeholder</title>
<meta name="robots" content="noindex">
<!-- A placeholder for one of his mockups (2 Oct 2026, his "i think i need
     to work in a few mockup images to break this up", then "could you add
     those placeholders"). ?n=1 to 4 picks the slot. A box at the shape the
     mockup will take, saying what goes there and the size it needs. When
     his file arrives, the study's product-demo section for the slot
     becomes an image section and this page is no longer framed. -->
<link rel="preload" href="/fonts/Satoshi-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="push.css">
<link rel="stylesheet" href="m.css">
<style>
.mock { position: relative; display: flex; flex-direction: column; justify-content: space-between; border-radius: 18px; background: repeating-linear-gradient(135deg, #EEECEA 0 14px, #E8E6E3 14px 28px); box-shadow: inset 0 0 0 1.5px rgba(28, 20, 19, 0.14); padding: clamp(18px, 3.4vw, 32px); overflow: hidden; }
.mock .top { display: flex; justify-content: space-between; gap: 16px; }
.mock .tag { display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 999px; background: #1C1413; color: #fff; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
.mock .ratio { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--grey); }
.mock h2 { font-size: clamp(26px, 5vw, 46px); line-height: 0.96; font-weight: 600; letter-spacing: -0.045em; max-width: 16ch; }
.mock p { margin-top: 10px; max-width: 46ch; font-size: clamp(14px, 1.9vw, 17px); line-height: 1.45; color: var(--ink-2); }
.mock .spec { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.mock .spec span { height: 28px; padding: 0 11px; border-radius: 999px; background: rgba(255, 255, 255, 0.85); font-size: 12.5px; font-weight: 600; line-height: 28px; }
.mock .file { margin-top: 12px; font-size: 12.5px; color: var(--grey); }
</style>
</head>
<body>
<div class="mod">
  <div class="mock" id="mock">
    <div class="top"><span class="tag" id="tag">Mockup</span><span class="ratio" id="ratio"></span></div>
    <div><h2 id="h"></h2><p id="p"></p><div class="spec" id="spec"></div><p class="file" id="file"></p></div>
  </div>
</div>
<script>
(() => {
  let framed = true; try { framed = window.top !== window; } catch (e) { framed = true; }
  if (!framed) document.body.classList.add("solo");
  /* the four slots, as agreed in the chat */
  const SLOTS = {
    1: { ratio: [16, 9], h: "The Lookbook on a laptop, in a real setting.", p: "Full width, after the opening sizzle. It sets up “The homepage leads with the looks.”", spec: ["Landscape 16:9", "3200 px wide (2400 at least)", "JPG, no transparency"], file: "Screens: homepage-lookbook-desktop.jpg, homepage-lookbook-desktop-long.jpg" },
    2: { ratio: [4, 5], h: "The Lookbook story on a phone, in a hand.", p: "In The Homepage, under the three homepages.", spec: ["Portrait 4:5", "1600 px on the long side at least", "JPG, no transparency"], file: "Screens: homepage-lookbook-mobile.jpg, homepage-lookbook-mobile-long.jpg" },
    3: { ratio: [3, 2], h: "Two phones: The Gloss and the sale.", p: "Before the emails, the way they look in an inbox.", spec: ["Landscape 3:2", "2400 px wide at least", "JPG, no transparency"], file: "Screens: email-the-gloss-phone.jpg, email-the-sale-phone.jpg" },
    4: { ratio: [16, 9], h: "Every channel at once, from one brief.", p: "Opening act 3. A laptop, a phone, a social post and an email, all one story.", spec: ["Landscape 16:9", "3200 px wide (2400 at least)", "JPG, no transparency"], file: "Screens: homepage-colorfest-desktop.jpg, homepage-colorfest-mobile.jpg, email-punch-candy-phone.jpg" },
  };
  const n = +(new URLSearchParams(location.search).get("n") || 1);
  const S = SLOTS[n] || SLOTS[1];
  const box = document.getElementById("mock");
  box.style.aspectRatio = S.ratio[0] + " / " + S.ratio[1];
  document.getElementById("tag").textContent = "Mockup " + n + " of 4";
  document.getElementById("ratio").textContent = S.ratio[0] + ":" + S.ratio[1];
  document.getElementById("h").textContent = S.h;
  document.getElementById("p").textContent = S.p;
  document.getElementById("spec").innerHTML = S.spec.map((x) => "<span>" + x + "</span>").join("");
  document.getElementById("file").textContent = S.file;
})();
</script>
</body>
</html>
