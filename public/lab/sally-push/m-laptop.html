<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sally Beauty · The Lookbook on a laptop, scrolling</title>
<meta name="robots" content="noindex">
<!-- His laptop mockup, with the site scrolling in it (3 Oct 2026, his "is
     it possible to show the site scrolling in an image like this? not
     sure if you can make something like that?"). His photograph, cropped
     wide, with the live Lookbook laid onto its screen: the screen's four
     corners were measured off the photograph (the first bright pixel in
     from the bezel on each side, fitted as lines and crossed), and the
     page is mapped onto them with a perspective transform, so it sits in
     the glass exactly. The camera notch is drawn back on top. The page
     scrolls itself the way a person would, stop by stop through the looks
     to the Platinum Kit, holds there while the kit plays, and eases back
     up. It stands still while the room pauses it (data-paused on the
     root) and for anyone who asked for less motion. Framed in the room in
     fit mode, edge to edge. -->
<style>
  html, body { margin: 0; background: transparent; }
  .lap { position: relative; overflow: hidden; border-radius: 4px; background: #CFC6BB; }
  .lap > img { display: block; width: 100%; height: auto; }
  /* the screen: the page's own 1440 by 924 viewport, mapped onto the glass */
  .screen { position: absolute; left: 0; top: 0; width: 1440px; height: 924px; overflow: hidden; transform-origin: 0 0; background: #fff; }
  .screen iframe { display: block; width: 1440px; height: 924px; border: 0; pointer-events: none; filter: saturate(0.97) contrast(0.98); }
  /* the glass: a faint sheen and the bezel's soft edge, so the page sits under it */
  .screen::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(118deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0) 38%);
    box-shadow: inset 0 0 14px rgba(0, 0, 0, 0.28); }
  .notch { position: absolute; background: #0C0C0C; }
</style>
</head>
<body>
<div class="lap" id="lap">
  <img src="/case-studies/sally-design-system/sally-design-system-mockup-lookbook-laptop-wide.jpg" alt="The Lookbook homepage on a laptop on a wooden side table, scrolling through the looks to the Platinum Kit" width="2000" height="1680">
  <div class="screen" id="screen"><iframe id="page" src="lookbook-images.html" title="The Lookbook" tabindex="-1" aria-hidden="true"></iframe></div>
  <i class="notch" id="notch" aria-hidden="true"></i>
</div>
<script>
(() => {
  /* measured off sally-design-system-mockup-lookbook-laptop-wide.jpg, 2000 by 1680 */
  const PHOTO_W = 2000;
  const CORNERS = [[312.5, 444.7], [1686.9, 443.1], [1691.4, 1328.5], [312.5, 1328.1]]; /* TL TR BR BL, half a pixel out */
  const NOTCH = { x: 924, y: 443, w: 151, h: 16, r: 6 };
  const VW = 1440, VH = 924;
  const lap = document.getElementById("lap"), screen = document.getElementById("screen"), notch = document.getElementById("notch"), frame = document.getElementById("page");

  /* the perspective transform that takes the viewport's rectangle onto the
     four corners: solve the homography, write it as a matrix3d */
  const solve = (A, b) => { const n = b.length; for (let i = 0; i < n; i++) { let p = i; for (let r = i + 1; r < n; r++) if (Math.abs(A[r][i]) > Math.abs(A[p][i])) p = r; [A[i], A[p]] = [A[p], A[i]]; [b[i], b[p]] = [b[p], b[i]]; for (let r = i + 1; r < n; r++) { const f = A[r][i] / A[i][i]; for (let c = i; c < n; c++) A[r][c] -= f * A[i][c]; b[r] -= f * b[i]; } } const x = Array(n).fill(0); for (let i = n - 1; i >= 0; i--) { let s = b[i]; for (let c = i + 1; c < n; c++) s -= A[i][c] * x[c]; x[i] = s / A[i][i]; } return x; };
  const homography = (src, dst) => {
    const A = [], b = [];
    src.forEach(([x, y], i) => { const [u, v] = dst[i]; A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u); A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v); });
    const h = solve(A, b);
    return [h[0], h[3], 0, h[6], h[1], h[4], 0, h[7], 0, 0, 1, 0, h[2], h[5], 0, 1];
  };
  const layout = () => {
    const k = lap.clientWidth / PHOTO_W; if (!k) return;
    const dst = CORNERS.map(([x, y]) => [x * k, y * k]);
    const m = homography([[0, 0], [VW, 0], [VW, VH], [0, VH]], dst);
    screen.style.transform = "matrix3d(" + m.map((v) => +v.toFixed(10)).join(",") + ")";
    Object.assign(notch.style, { left: NOTCH.x * k + "px", top: NOTCH.y * k + "px", width: NOTCH.w * k + "px", height: NOTCH.h * k + "px", borderRadius: "0 0 " + NOTCH.r * k + "px " + NOTCH.r * k + "px" });
  };
  layout();
  addEventListener("resize", layout);
  if ("ResizeObserver" in window) new ResizeObserver(layout).observe(lap);

  /* the scroll: stop by stop, the way a person reads a homepage. Its clock
     stands still while the room pauses the module or the tab is hidden */
  const root = document.documentElement;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  let plan = null, t = 0, last = 0;
  const build = () => {
    let w, d; try { w = frame.contentWindow; d = frame.contentDocument; } catch (e) { return null; }
    if (!d || !d.body) return null;
    const nav = d.querySelector(".sk-nav"), kit = d.getElementById("kit");
    /* start with the nav pill just under the glass's top edge, as his
       mockup does: the line over it scrolled away */
    const y0 = nav ? Math.max(0, nav.getBoundingClientRect().top + w.scrollY - 10) : 0;
    const yk = kit ? Math.round(kit.getBoundingClientRect().top + w.scrollY - (nav ? nav.offsetHeight + 30 : 90)) : y0 + 2400;
    const stops = [y0, y0 + 760, y0 + 1520, Math.max(y0 + 2100, yk)];
    const steps = [{ y: stops[0], hold: 1800 }];
    for (let i = 1; i < stops.length; i++) steps.push({ y: stops[i], move: 1500, hold: i === stops.length - 1 ? 8600 : 1300 });
    steps.push({ y: stops[0], move: 2200, hold: 600 });
    return { w, steps, total: steps.reduce((a, s) => a + (s.move || 0) + s.hold, 0) };
  };
  const at = (ms) => {
    let acc = 0, y = plan.steps[0].y;
    for (const s of plan.steps) {
      if (s.move) { if (ms < acc + s.move) return y + (s.y - y) * ease((ms - acc) / s.move); acc += s.move; }
      y = s.y;
      if (ms < acc + s.hold) return y;
      acc += s.hold;
    }
    return y;
  };
  const tick = (now) => {
    const dt = last ? Math.min(64, now - last) : 0; last = now;
    if (!plan) plan = build();
    if (plan && !root.dataset.paused && !document.hidden) {
      t = (t + dt) % plan.total;
      try { plan.w.scrollTo(0, Math.round(at(t))); } catch (e) { /* gone */ }
    }
    requestAnimationFrame(tick);
  };
  frame.addEventListener("load", () => {
    plan = null; t = 0;
    try { frame.contentDocument.fonts.ready.then(() => { plan = null; }); } catch (e) { /* another origin */ }
    requestAnimationFrame(tick);
  });
})();
</script>
</body>
</html>
