<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pressing — the homepage, stratified</title>
<style>
  /*
    The homepage, stratified. LAB FILE v4 — the design surface.

    v2 mixed everything into one feed and the mix read as a mess as a
    RESTING state. v3 fixed the state: idle, the page is a magazine of
    strata (the work, the practice, the board), each type in its own
    register; asked, matches from every stratum deal at the top.

    v4 fixes the chrome. v3 pinned the question in a second bar under
    the masthead — two stacked strips, and the lower one had to carry
    paper, which is the one surface the burn pill cannot act on. So the
    question moved INTO the masthead as its middle zone. One bar, still
    transparent, the feed still running under it. The three links it
    replaced did not die: they became queries, riding the same rotation
    as "marble" and "does this company do master bedrooms?".

    The bar itself is a verbatim lift of the shipped masthead — same
    16px Helvetica, same pill, same three-stage heat, same reversal —
    because it IS the shipped masthead with a question where the links
    were. The matcher is what went conversational: common words
    set aside, best tier wins unless the tier is thin, and the narrator
    reports all of it — where each word landed, what found nothing,
    what was skipped. Tune HERE first, port second.
  */
  :root {
    --paper: #FFFFFF;
    --ink: #000000;
    --lbl: 10px;
    --lbl-track: 0.04em;
    --lbl-weight: 500;
    --note: 16px;
    --cap: 11px;
    /* --pp-r in globals.css, which is what PressingIndex reads through
       --ix-r. One radius for every framed asset on the site. */
    --r: 16px;
    --gap: 6px;
    --nav: 54px;
    --gut: 40px;
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--paper); scroll-behavior: smooth; }
  body { font-family: var(--sans); color: var(--ink);
    -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  button { font-family: inherit; }

  /* ── the masthead ─────────────────────────────────────────────────
     Lifted value-for-value from src/components/shell/Masthead.module.css
     so the lab bar and the shipped bar are the same object: 16px
     Helvetica at 0.04em on transparent ground, the burn pill inset
     18px past the gutter, resting at rgba(243,240,237,0.05). Nothing
     here may drift — if one of these numbers wants tuning it gets
     tuned in the module and copied back, the same contract every
     other pressing value lives under.

     v4's one structural change is what sits in the middle: the
     question, where the three links used to be. It wears the bar's
     type exactly, so at rest the centre of the bar still reads like
     the centre of the bar. */
  #nav { --nav-size: 16px; --nav-gutter: 40px; --nav-overhang: 18px;
    --masthead-ink: #000000; --masthead-paper: #FFFFFF;
    position: sticky; top: 0; z-index: 60; height: var(--nav);
    display: grid; align-items: center;
    grid-template-columns: 1fr auto 1fr;
    gap: 24px; padding: 0 var(--nav-gutter);
    font-family: var(--sans); font-size: var(--nav-size);
    letter-spacing: 0.04em; font-weight: 500;
    -webkit-font-smoothing: antialiased; color: var(--masthead-ink); }

  /* The burn sits BEHIND everything in the bar. Over flat cream a
     saturate/contrast pump has nothing to act on, so it is invisible;
     over photography it goes off. That asymmetry is the whole effect.
     A pill, not a band: backdrop-filter clips to the border-box,
     radius included, so it reads as a floating lens. */
  #navBurn { position: absolute; pointer-events: none; z-index: 0;
    left: calc(var(--nav-gutter) - var(--nav-overhang));
    right: calc(var(--nav-gutter) - var(--nav-overhang));
    top: 5px; bottom: 5px; border-radius: 999px;
    backdrop-filter: url(#mastheadMelt) blur(0px) saturate(1) contrast(1);
    -webkit-backdrop-filter: blur(0px) saturate(1) contrast(1);
    background: rgba(243, 240, 237, 0.05); }

  /* the field is NOT in this list — it is positioned, not merely
     raised, and #nav .ask would out-specify the .ask rule below */
  #nav .mark, #nav .meta { position: relative; z-index: 1; }
  #nav a { color: inherit; text-decoration: none; }
  #nav a:hover { opacity: 0.45; }
  #nav .mark { grid-column: 2; justify-self: center; white-space: nowrap; }
  #nav a.meta { grid-column: 3; justify-self: end; white-space: nowrap;
    color: rgba(0, 0, 0, 0.42); }
  #nav a.meta:hover { color: var(--masthead-ink); opacity: 1; }

  /* ── the question, which travels ─────────────────────────────────
     There is one field, not two. It begins at display size in the
     cover and ends in the bar, and the only thing that moves it is
     the page: drop is the distance from its reserved slot to the bar's
     centre, so while the slot is on screen the field rides with the
     document exactly like any other block, and when the slot reaches
     the bar it simply parks. Nothing crossfades, nothing hands over.

     It is absolutely positioned inside the bar rather than in the
     cover, because the destination is the thing that has to be exact —
     landing on the gutter to the pixel matters more than where it
     starts. And it stays LEFT the whole way, which is what makes the
     travel read as one move: the wordmark went to the middle to leave
     the slot open for it.

     Sizes come from the driver as custom properties. #query inherits
     the lot, so the field and its own chrome can never disagree. */
  #nav .ask { position: absolute; left: var(--ask-left, var(--nav-gutter)); z-index: 1;
    top: 50%; transform: translateY(-50%) translateY(var(--ask-drop, 0px));
    width: var(--ask-w, 420px); display: flex; align-items: center; gap: 8px;
    font-family: inherit; font-size: var(--ask-fs, 16px);
    font-weight: var(--ask-fw, 500); letter-spacing: var(--ask-ls, 0.04em);
    line-height: 1.04; }
  /* only while the answer opens or closes — never during a scroll,
     where a transition would drag behind the page */
  .ask.settling { transition: transform 0.45s cubic-bezier(0.2, 0.55, 0.2, 1),
    width 0.45s cubic-bezier(0.2, 0.55, 0.2, 1), font-size 0.45s ease; }
  #query { flex: 1 1 auto; min-width: 0; border: 0; outline: 0;
    background: transparent; color: inherit; font: inherit;
    letter-spacing: inherit; padding: 4px 0; border-radius: 0;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s ease, color 0.28s ease; }
  #nav:hover #query { border-bottom-color: rgba(0, 0, 0, 0.22); }
  #query:focus { border-bottom-color: var(--masthead-ink); }
  #query::placeholder { color: rgba(0, 0, 0, 0.42); opacity: 1;
    transition: opacity 0.3s ease; }
  /* at display size it wears a real rule; in the bar it goes back to
     the module's bare centre slot */
  .ask.big #query { border-bottom-width: 2px;
    border-bottom-color: rgba(0, 0, 0, 0.14); padding-bottom: 10px; }
  .ask.big #query::placeholder { color: var(--masthead-ink);
    transition: color 0.25s ease; }
  /* Click in and the question goes grey. At display size the
     placeholder is full ink — it reads as a statement, which is right
     until someone means to type over it. Grey says the line is theirs
     now. */
  .ask.big #query:focus::placeholder { color: rgba(0, 0, 0, 0.3); }
  #nav.rev .ask.big #query:focus::placeholder { color: rgba(255, 255, 255, 0.42); }
  /* display, not visibility: hidden it still holds its width and the
     flex gap, and the question is fitted to the width it actually has */
  .clear { display: none; background: none; border: 0; padding: 0 2px;
    cursor: pointer; font-size: var(--nav-size); line-height: 1;
    color: rgba(0, 0, 0, 0.42); }
  body.asked .clear { display: block; }
  .clear:hover { color: var(--masthead-ink); }

  /* Reversed over dark ground, same as the module: mix-blend-mode
     cannot work because sticky makes the bar its own stacking
     context, so a driver toggles this against declared
     [data-nav-dark] zones. The transition is what keeps the handover
     from reading as a flicker at the boundary. */
  #nav .mark, #nav .meta, #nav #query { transition: color 0.28s ease; }
  #nav.rev { color: var(--masthead-paper); }
  #nav.rev a.meta { color: rgba(255, 255, 255, 0.5); }
  #nav.rev a.meta:hover { color: var(--masthead-paper); }
  #nav.rev #query::placeholder { color: rgba(255, 255, 255, 0.6); }
  #nav.rev:hover #query { border-bottom-color: rgba(255, 255, 255, 0.35); }

  /* ── the cover: the question, and what the question is for ───────
     Term left, definition right. The left column is the way in — the
     field at display size, and under it what the house holds, which is
     the same job Pentagram's "showing the latest 27 projects" does. The
     right column says what asking does and then lists the vocabulary,
     as an overlay. That overlay is gone, and the room it had to
     reserve went with it. */
  /* Height gives the question the presence a display line needs, and
     drops the count to the foot of its column. It does NOT lengthen
     the travel, which was the guess: the question sits at the TOP of
     the cover, so its distance to the bar is unchanged by how tall the
     cover is (measured: 522px cover, 130px travel). The only lever on
     travel length is how far down the question starts, and it starts
     at the top on purpose. */
  /* One column now. The question, then who is asking — the two
     paragraphs explaining the field are gone, because a field that
     needs explaining in two paragraphs has not been designed yet. */
  .cover { padding: clamp(34px, 5dvh, 74px) var(--gut) clamp(30px, 4dvh, 56px); }
  body.asked .cover { display: none; }
  /* the statement takes the field's measure, so the two hang off the
     same right edge and the page keeps one vertical line down its
     middle. Set below the field, not level with it: a display size
     here would compete with the question rather than answer it. */
  .coverR { padding-top: clamp(30px, 4dvh, 58px);
    width: min(52%, 700px); }
  /* The statement is set exactly as PressingCover sets it on a case
     study — clamp(24px, 3.2vw, 44px)/1.18/-0.02em at 500, over a 21em
     measure. Same voice in both places, so the homepage opens at the
     scale a study opens at.

     The measure is what makes 44px work here: 21em at 44px is 924px,
     wider than the field's 52% column, so the statement is allowed
     out past it rather than being crushed into eight short lines. */
  .coverR { width: auto; }
  .coverR .statement { font-size: clamp(24px, 3.2vw, 44px);
    line-height: 1.18; letter-spacing: -0.02em; font-weight: 500;
    max-width: 21em; }
  .ledelbl { display: block; font-size: var(--lbl);
    font-weight: var(--lbl-weight); letter-spacing: var(--lbl-track);
    opacity: 0.5; padding-bottom: 14px; }
  /* the field takes half the measure, so its rule stops mid-page and
     the statement below it reads against open space */
  #askSlot { width: min(52%, 700px);
    height: calc(clamp(32px, 5.6vw, 88px) * 1.28); }

  .statement { font-size: clamp(20px, 2.6vw, 36px); line-height: 1.2;
    letter-spacing: -0.02em; font-weight: 500; max-width: 30em; }
  .statement .dim { color: rgba(0, 0, 0, 0.42); }
  .stratum .statement { padding: 0 var(--gut) clamp(26px, 4dvh, 48px); }

  .explain { font-size: var(--note); line-height: 1.5;
    color: rgba(0, 0, 0, 0.8); }
  .explain + .explain { padding-top: 1.1em; }
  /* the room the travelling field needs. Fixed at the largest size the
     rotation can take, so a long question cycling in never reflows the
     page under it. */

  @media (max-width: 860px) {
    #askSlot, .coverR { width: 100%; }
  }

  /* ── section furniture ──
     Each stratum announces itself on one line: what it is at the left,
     the way further in at the right, both on the page gutter so the
     row reads as the same container the cards below it sit in. */
  .stratum { padding-top: clamp(56px, 9dvh, 120px); }
  .stratum .shead { display: flex; justify-content: space-between;
    align-items: baseline; gap: 24px; flex-wrap: wrap;
    padding: 0 var(--gut) clamp(20px, 3dvh, 36px); }
  .stratum .slbl { font-size: var(--lbl); font-weight: var(--lbl-weight);
    letter-spacing: var(--lbl-track); opacity: 0.55; }
  .stratum .slink { font-size: var(--lbl); font-weight: var(--lbl-weight);
    letter-spacing: var(--lbl-track); text-decoration: none; }
  .stratum .slink:hover { text-decoration: underline; }

  /* ── feeds (shared card grammar) ── */
  /* The feed sits in the same container as the masthead, the question
     and the section labels: one gutter down the whole page, so an
     image's edge lines up with the type above it. The 6px stays
     BETWEEN the columns, which is what keeps it reading as a feed
     rather than a layout. */
  .fd-cols { display: flex; gap: var(--gap); padding: 0 var(--gut); }
  .fd-col { flex: 1 1 0; min-width: 0; display: flex;
    flex-direction: column; gap: var(--gap); }

  .fd-it { position: relative; display: block; width: var(--w, 100%);
    text-decoration: none; }
  .fd-it.insetR { align-self: flex-end; }
  /* The frame holds the ratio and the clip; the image is cut taller
     than the frame so it has somewhere to go. Nothing here moves on
     its own — the drift driver writes the transform, and it writes it
     to the IMAGE, never to the card, so the arrival animation on the
     card and the drift never fight over one transform. */
  /* No fill. The frame reserves its space through the declared ratio,
     not through a visible plate — and with the curtain a grey ground
     would sit there being uncovered, which draws attention to the
     mechanism instead of the picture. */
  .fd-it .shot { display: block; width: 100%; aspect-ratio: var(--ar, 1);
    overflow: hidden; border-radius: var(--r); background: none; }
  .fd-it .shot img { display: block; width: 100%;
    height: calc(100% + var(--drift, 16%)); object-fit: cover;
    /* the rest position is the MIDDLE of the slack, not the top: a
       frame the driver has not reached yet — or will never reach,
       under reduced motion — is still a centred crop rather than one
       that has quietly lost its bottom sixth. */
    transform: translate3d(0, calc(var(--drift, 16%) / -2), 0); }

  /* ── the page transition ─────────────────────────────────────────
     Three beats, each an edge moving in one direction:

       1  white falls from the top until it covers
       2  black rises from the bottom until it covers the white
       3  black's BOTTOM edge rises, uncovering the next page

     Beat 3 is why there are two panels. Uncovering from the bottom
     means the last thing you see leaving is the top of the screen —
     the opposite direction to beat 1 — and the reversal is what stops
     the whole thing reading as one long wipe. The white exists only so
     beat 2 has something to travel over; a black panel rising over the
     live page would just be beat 3 played backwards.

     clip-path, not transform: the panels never move, only what is
     drawn of them, so nothing composites at 100dvh scale and the
     edges stay exactly straight. Each beat eases hard at the end. */
  .pt { position: fixed; inset: 0; z-index: 200; pointer-events: none;
    visibility: hidden; }
  .pt.pt-run { visibility: visible; pointer-events: auto; }
  .ptw, .ptb { position: absolute; inset: 0; }

  /* The destination's name, repeated down the whole page, drawn TWICE
     — once in each panel, at identical coordinates, in the colour that
     panel needs. Neither copy ever changes colour: the CLIP does it.
     As a curtain's edge crosses a line, the words above the edge
     belong to one panel and the words below to the other, so the type
     inverts ALONG the moving edge instead of snapping when a panel
     lands. Both stacks must register exactly or the inversion shows a
     seam, which is why the geometry is declared once here and neither
     panel is allowed its own.

     The lines also arrive and leave in sequence, and the two
     directions are deliberately opposite: IN from the top, chasing
     the white curtain down the page; OUT from the bottom, running
     just ahead of the black curtain as it lifts. Beat 3 was already
     removing them bottom-up — its clip does exactly that — so the
     stagger is not inventing a direction, it is making one that
     already existed legible. */
  .ptw, .ptb { overflow: hidden; }
  /* The same inset all round — the gutter the rest of the page keeps.
     The lines are then given an EXACT line-height so a whole number of
     them fills that box: otherwise the leftover fraction sits as extra
     air top and bottom, and the inset stops being uniform. */
  .ptstack { position: absolute; inset: 0; padding: var(--gut);
    display: flex; flex-direction: column; justify-content: center; }
  .ptl { display: block; white-space: nowrap;
    font-size: clamp(20px, 2.6vw, 38px); font-weight: 500;
    line-height: var(--ptlh, 1.18); letter-spacing: -0.02em;
    opacity: 0; transform: translateY(14px);
    transition: opacity 0.3s ease,
      transform 0.34s cubic-bezier(0.16, 1, 0.3, 1);
    transition-delay: var(--d, 0s); }
  .pt-1 .ptl { opacity: 1; transform: none; }
  .pt-3 .ptl { opacity: 0; transform: translateY(-10px);
    transition-duration: 0.22s, 0.24s; }
  .ptw .ptl { color: var(--ink); }
  .ptw .ptl .sub { color: rgba(0, 0, 0, 0.42); }
  .ptb .ptl { color: var(--paper); }
  .ptb .ptl .sub { color: rgba(255, 255, 255, 0.48); }
  .ptw { background: var(--paper); clip-path: inset(0 0 100% 0); }
  .ptb { background: var(--ink); clip-path: inset(100% 0 0 0); }
  /* the beats. Durations live here so the driver only sequences. */
  .pt-run .ptw { transition: clip-path 0.52s cubic-bezier(0.33, 0.28, 0.12, 1); }
  .pt-run .ptb { transition: clip-path 0.52s cubic-bezier(0.33, 0.28, 0.12, 1); }
  .pt-1 .ptw { clip-path: inset(0 0 0 0); }
  .pt-2 .ptb { clip-path: inset(0 0 0 0); }
  /* The white is dropped instantly once the black is FULL — invisible
     under it, and it has to be gone before beat 3 or it is what gets
     revealed. Keyed to pt-3, not pt-2: pt-2 is added when the black
     STARTS rising, and clearing the white then uncovers the live page
     for the length of that beat. Measured at 95% exposed before this
     moved. */
  .pt-3 .ptw { transition: none; clip-path: inset(0 0 100% 0); }
  .pt-3 .ptb { transition: clip-path 0.68s cubic-bezier(0.33, 0.28, 0.12, 1);
    clip-path: inset(0 0 100% 0); }

  /* ── the ring: the index as the body ───────────────────────────
     Rows, not rails. Every row is top-aligned across the page, takes a
     generous interval below it, and is ruled off from the next — so
     the page has a horizontal spine instead of two columns flowing
     past each other. Both frames in a row hang from the same line;
     the difference in their depth falls as air, which is the same
     move the uneven pair made, now stated with a rule under it.

     The working notes are the exception, and deliberately so: they
     hold the left column and ignore the row rhythm completely,
     crossing the rules as they go. That is why they are laid over the
     rows rather than placed in them — a note is not a cell. */
  .ixbody { position: relative; padding: 0 var(--gut); }

  .ixnotes { position: absolute; top: 0; left: var(--gut);
    width: var(--ix-note-w, 200px);
    display: flex; flex-direction: column;
    /* 2.5x the old clamp(26px, 3vw, 46px): these are four separate
       statements, not a list, and they need to stop reading as one */
    gap: clamp(65px, 7.5vw, 115px); }
  .ixnotes .blk { font-size: var(--note); line-height: 1.45;
    color: rgba(0, 0, 0, 0.78); }
  .ixnotes .blk .tag { display: block; font-size: var(--lbl);
    font-weight: var(--lbl-weight); letter-spacing: var(--lbl-track);
    opacity: 0.5; padding-bottom: 7px; }

  /* the row: notes column left empty (the notes float over it), then
     two frames, each hung from the top and pushed to the right of its
     half — the two right edges are the only vertical lines the eye
     needs to hold the grid together */
  .ixrow { --ixgap: clamp(24px, 3.4vw, 56px);
    display: grid; align-items: start;
    grid-template-columns: var(--ix-note-w, 200px) 1fr 1fr;
    column-gap: var(--ixgap);
    row-gap: clamp(44px, 5.5vw, 96px);
    margin-bottom: clamp(44px, 5.5vw, 96px); }
  .ixrow:last-child { margin-bottom: 0; }
  .ixrow .cell { display: flex; justify-content: flex-end; }

  /* The rule belongs to the two frames it separates, not to the page:
     it starts at the LEFT EDGE OF THE LEFT FRAME and runs to the right
     edge of the right one, so it never crosses the notes column and
     never reaches further than the pictures do.

     That start moves every row, because the left frame's width is
     dealt. The offset is written as a calc rather than measured: the
     rule spans both cells plus the gap between them, so
     (100% - gap) / 2 IS one cell, and one cell times the share the
     frame did not take is exactly where its left edge falls. No
     reflow, no resize listener — it simply stays true. */
  .ixrule { grid-column: 2 / -1; height: 0;
    border-top: 1px solid rgba(0, 0, 0, 0.13); }
  .ixrow:last-child .ixrule { display: none; }

  .ixrow .fd-it { width: calc(var(--share, 0.7) * 100%);
    transform-origin: right center;
    transition: opacity 0.8s ease,
      transform 0.62s cubic-bezier(0.16, 1, 0.3, 1); }
  /* arrival is opacity-ONLY: a translateY here would be overwritten by
     the hover transform, and they are the same property */
  .ixrow .fd-it, .ixrow .fd-it.fd-on { transform: none; }
  .ixrow .fd-it .shot { aspect-ratio: var(--ar, 1); }
  .ixrow .fd-it .cap { display: none; }
  .ixrow .fd-it .lbl { display: block; padding-top: 10px;
    font-size: var(--note); line-height: 1.35; font-weight: 600;
    letter-spacing: -0.004em; text-align: left; }

  /* ── hover: the frame opens down and left ────────────────────────
     transform-origin is the top right corner, so the frame keeps its
     TOP LINE — the one thing a row of top-aligned frames cannot afford
     to lose — and opens downward and leftward from there.

     The scale is on the FRAME, not the card, so the name underneath is
     not scaled with it. It is displaced instead: the driver measures
     how far the frame grew and slides the label down by exactly that,
     so the type stays its own size and simply keeps its place under
     the picture.

     And the frame beside it is pushed rather than covered. The driver
     works out whether the opening frame would actually reach its
     neighbour and moves it only as far as it has to — a frame that
     was never in the way does not move at all. */
  .ixrow .fd-it, .ixrow .fd-it .shot, .ixrow .fd-it .lbl {
    transition: transform 0.62s cubic-bezier(0.16, 1, 0.3, 1); }
  .ixrow .fd-it .shot { transform-origin: right top; }

  @media (hover: hover) and (min-width: 761px) {
    /* the ceiling; each frame takes as much of it as it has room for */
    .ixbody { --ix-grow-max: 1.32; }
    .ixrow .fd-it .shot {
      transition: transform 0.62s cubic-bezier(0.16, 1, 0.3, 1),
        border-radius 0.62s cubic-bezier(0.16, 1, 0.3, 1); }
    .ixrow .fd-it:hover { z-index: 2; }
    .ixrow .fd-it:hover .shot { transform: scale(var(--ix-grow, 1.32));
      /* squares off as it opens: a rounded frame reads as an object on
         the page, losing the corner turns it into the picture itself */
      border-radius: 0; }
    /* The name swings to the right edge as the frame opens — the same
       edge every frame in the index is hung from.

       It SLIDES rather than re-aligns. text-align cannot be
       transitioned, so switching it on hover snapped the type across
       in a single frame. The driver measures how far the text
       actually is from the right edge and translates it there, on the
       same transform and the same clock as the drop — so the label
       makes one diagonal move rather than two unrelated ones. */
    .ixrow .fd-it:hover .lbl {
      transform: translate(var(--slide, 0px), var(--drop, 0px)); }
  }

  @media (max-width: 860px) {
    /* no room for a floating column: the notes run first, then the
       rows go one frame wide */
    .ixnotes { position: static; width: auto; left: auto;
      padding-bottom: clamp(40px, 9vw, 64px); }
    .ixrow { grid-template-columns: 1fr; row-gap: clamp(30px, 7vw, 48px); }
    .ixrow .cell { justify-content: stretch; }
    .ixrow .fd-it { width: 100%; }
  }

  /* ── the work: blocks, and the air between them ──────────────────
     Twelve tracks, the house grid. This is not a feed any more: each
     block owns its own rows, so blocks never interlock, and the space
     between them is a real interval rather than a gutter.

     Three shapes, and only three:

       1        one image the full width
       5|7      the uneven pair, 41/58, tops aligned
       7|5      the pair reversed

     The pair's asymmetry is not authored twice. Both frames carry a
     landscape ratio — 4:3 for the wide one, 5:4 for the narrow — so
     the narrow frame comes out about three quarters the depth of the
     wide one purely BECAUSE it is narrower. That is what stops it
     reading as a system: nobody chose "half". The ratios were chosen
     and the proportion fell out of them.

     The air under the shallow frame is simply the rest of its row, and
     the row is as tall as the deep frame. No spacer, nothing placed —
     which only became possible once blocks stopped sharing rows. */
  .workrows { display: grid; align-items: start;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    column-gap: clamp(12px, 1.6vw, 22px);
    row-gap: clamp(56px, 7vw, 130px);
    padding: 0 var(--gut); }

  .workrows .fd-it.hero     { grid-column: 1 / -1; }
  .workrows .fd-it.pNarrow  { grid-column: 1 / span 5; }
  .workrows .fd-it.pWide    { grid-column: 6 / span 7; }
  .workrows .fd-it.pWideL   { grid-column: 1 / span 7; }
  .workrows .fd-it.pNarrowR { grid-column: 8 / span 5; }
  .workrows > .cell         { grid-column: 1 / span 5; }

  .workrows .fd-it.hero .shot { aspect-ratio: 2 / 1; }
  .workrows .fd-it.pWide .shot,
  .workrows .fd-it.pWideL .shot { aspect-ratio: 4 / 3; }
  .workrows .fd-it.pNarrow .shot,
  .workrows .fd-it.pNarrowR .shot,
  .workrows > .cell .shot { aspect-ratio: 5 / 4; }
  .workrows .fd-it.hero .shot img { --drift: 20%; }

  /* the standing words, set off to one side with a row to themselves —
     the beat between two pairs, and the only place on the page where
     the house mentions itself in passing */
  /* Not a card here. On the work's white ground a filled box reads as
     one more tile in a run of tiles; the same words set plainly read
     as an aside, which is what they are. Nothing to open either — the
     text is simply there, at the size the rest of the page speaks in. */
  .workrows .fd-note { aspect-ratio: auto; background: none; border: 0;
    border-radius: 0; padding: 0; color: var(--ink);
    display: block; cursor: default; }
  .workrows .fd-note .word { display: block; font-size: var(--lbl);
    font-weight: var(--lbl-weight); letter-spacing: var(--lbl-track);
    opacity: 0.5; padding-bottom: 12px; }
  .workrows .fd-note .full { display: block; font-size: var(--note);
    font-weight: 400; line-height: 1.55; letter-spacing: 0;
    color: rgba(0, 0, 0, 0.78); padding-top: 0; white-space: pre-line; }
  .workrows .fd-note .full .att { display: block; margin-top: 12px;
    font-size: var(--cap); opacity: 0.5; }
  .workrows .fd-note.noteL { grid-column: 1 / span 4; }
  .workrows .fd-note.noteR { grid-column: 9 / span 4; }

  /* the hover caption is the board's device; the work has a real one */
  .workrows .fd-it .cap { display: none; }

  @media (max-width: 860px) {
    .workrows { row-gap: clamp(38px, 9vw, 72px); }
    /* one column: every block is simply the width of the page */
    .workrows .fd-it.hero, .workrows .fd-it.pNarrow, .workrows .fd-it.pWide,
    .workrows .fd-it.pWideL, .workrows .fd-it.pNarrowR, .workrows > .cell,
    .workrows .fd-note.noteL, .workrows .fd-note.noteR { grid-column: 1 / span 8; }
    .workrows .fd-it.hero .shot { aspect-ratio: 3 / 2; }
  }

  /* the standing label: the case study's body size (--pp-note is 16px
     there), carrying more weight so it reads as a name and not as
     running copy */
  .fd-it .lbl { display: none; }
  .workrows .fd-it .lbl { display: block;
    box-sizing: border-box; padding-top: 12px;
    font-size: var(--lbl-size, var(--note)); font-weight: 600;
    line-height: 1.35; letter-spacing: -0.004em; }
  .fd-it .lbl .sub { opacity: 0.42; }
  .fd-it .cap { position: absolute; left: 10px; bottom: 8px; right: 10px;
    font-size: var(--cap); font-weight: 400; line-height: 1.5;
    color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,0.55);
    opacity: 0; transition: opacity 0.25s ease; pointer-events: none; }
  @media (hover: hover) { .fd-it:hover .cap { opacity: 1; } }

  /* ── solid cards — the house's own words ──
     Words, not pictures: solid ink, no outline, and for the info cards
     no eyebrow either. An outlined white card on white ground reads as
     an empty box; a solid one reads as a deliberate beat in a grid of
     photographs. They also declare themselves dark, so the masthead's
     reversal driver flips the wordmark as they pass under it. */
  .fd-note { position: relative; width: var(--w, 100%);
    border: 0; border-radius: var(--r);
    background: var(--ink); color: var(--paper);
    cursor: pointer; text-align: left;
    display: flex; align-items: flex-end; padding: 22px; }
  .fd-note { aspect-ratio: var(--nar, 4 / 3); }
  .fd-note .word { font-size: clamp(19px, 1.7vw, 30px); font-weight: 700;
    letter-spacing: -0.03em; line-height: 1.05; }
  .fd-note .full { display: none; }
  .fd-note .idx { position: absolute; top: 14px; left: 22px;
    font-size: var(--lbl); font-weight: var(--lbl-weight);
    letter-spacing: var(--lbl-track); opacity: 0.5; color: inherit; }
  /* the info cards carry no label at all — the word is the whole card */
  .fd-note.plain .idx { display: none; }
  .fd-note.open { aspect-ratio: auto; align-items: flex-start; }
  .fd-note.open .word { display: none; }
  .fd-note.open .full { display: block; font-size: var(--note);
    font-weight: 400; line-height: 1.6; letter-spacing: 0;
    color: rgba(255,255,255,0.82); padding-top: 26px; white-space: pre-line; }
  .fd-note.open .full .att { display: block; margin-top: 12px;
    font-size: var(--cap); opacity: 0.55; }
  .fd-note:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }
  .fd-note.plain.open .word { display: block; font-size: var(--note);
    font-weight: 700; letter-spacing: 0; padding-bottom: 4px; }

  /* the practice: a band of white cards, not a masonry */
  /* ── arrival ─────────────────────────────────────────────────────
     A curtain, not a fade. The frame is already there — its ratio is
     declared, so it holds its space from first layout — and the
     picture is UNCOVERED downward rather than faded up.

     clip-path is the mechanism, and it goes on the frame's CONTENT —
     which is an <img> on every card but one, and the reel's own stage
     on that one, so the selector takes whatever is in there rather
     than naming a tag.

     Content, not the frame: the frame carries the radius, and clipping
     it would square its corners for the length of the reveal and fight
     the hover's own squaring-off. Clip rather than transform: the
     drift driver already writes transform to the image and the hover
     grow writes it to the card, and a third party on either would be
     the two-drivers-one-property bug this kit keeps paying for. A clip
     belongs to nobody.

     The ease is the point, and the first attempt got it wrong in an
     instructive way: cubic-bezier(.16,1,.3,1) puts its first control
     point at y=1, which throws the output almost straight to the top
     — 47% of the picture was uncovered in the first 120ms, so the
     curtain appeared to BLINK to halfway and then crawl. You never
     saw it fall.

     This curve keeps a fast, readable descent through the first half
     and saves the deceleration for the end, over nearly twice the
     duration. The falling edge is the thing being animated; it has to
     be legible as an edge that moves. */
  .fd-it .plate { display: block; width: 100%; height: 100%; }
  /* Curtain and settle together, on the same clock and the same ease:
     the frame is uncovered downward while what is inside it comes to
     rest from 125%. Two properties, one element, one timing — so they
     land on the same beat rather than merely near each other. */
  .fd-it .shot > * {
    clip-path: inset(0 0 100% 0);
    transform: scale(1.25); transform-origin: center;
    transition: clip-path 1.4s cubic-bezier(0.33, 0.28, 0.12, 1),
      transform 1.4s cubic-bezier(0.33, 0.28, 0.12, 1);
    /* A row's two frames do not arrive together. The second waits, so
       the row reads left to right as one gesture with two beats rather
       than as a pair of shutters dropping at once. The wait is set on
       the card by the dealer, not here, because only the dealer knows
       which of the two a frame is. */
    transition-delay: var(--lag, 0s); }
  .fd-on .shot > * { clip-path: inset(0 0 0 0); transform: none; }
  /* the text cards keep the quiet fade — there is no picture to draw
     back a curtain from */
  .fd-note { opacity: 0; transform: translateY(14px);
    transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.2, 0.55, 0.2, 1); }
  .fd-note.fd-on { opacity: 1; transform: none; }
  /* the card itself no longer fades: the curtain IS the arrival, and a
     fade under it would grey the picture while it was being drawn */
  .fd-it { opacity: 1; }

  /* ── the answer ──────────────────────────────────────────────────
     Ask, and the page becomes the answer: the magazine steps back and
     every kind assembles at the top, under the bar you asked in.
     Heterogeneity only ever shows up as an answer, which is the one
     place it is right. The head carries the receipts. */
  .answer { display: none; }
  body.asked .answer { display: block; }
  body.asked .stratum { display: none; }

  .anshead { padding: clamp(26px, 4dvh, 52px) var(--gut) clamp(18px, 3dvh, 32px); }
  /* ── the answer, spoken ──────────────────────────────────────────
     One line at the statement's own scale, typed out. The receipts
     did not go away, they went into the writing: every clause is
     derived from the matcher's output, and the mechanical trace keeps
     one quiet line underneath for anyone who wants the working. */
  .ansprose { font-size: clamp(24px, 3.2vw, 44px); font-weight: 500;
    line-height: 1.18; letter-spacing: -0.02em; max-width: 21em;
    min-height: 2.4em; }
  #ansSay.typing::after { content: ""; display: inline-block;
    width: 0.45ch; height: 0.92em; margin-left: 4px;
    background: currentColor; vertical-align: -0.1em;
    animation: sayblink 0.9s steps(2, start) infinite; }
  @keyframes sayblink { 50% { opacity: 0; } }

  /* while the brain works, the field's rule runs a scan: grows from
     the left, collapses to the right. Contained, so nothing juts. */
  .ask::after { content: ""; position: absolute; bottom: 0; left: 0;
    width: 0; height: 1px; background: currentColor; opacity: 0; }
  body.working .ask::after { opacity: 0.7;
    animation: askscan 0.8s cubic-bezier(0.45, 0.05, 0.35, 0.95) infinite; }
  @keyframes askscan {
    0% { left: 0; width: 0; }
    52% { left: 0; width: 100%; }
    100% { left: 100%; width: 0; }
  }
  /* the spoken line can carry one link: the email address, live */
  .ansprose a { color: inherit; text-decoration: underline;
    text-decoration-thickness: 2px; text-underline-offset: 5px; }

  /* ── the answer in the ring's columns ────────────────────────────
     The registers still never mix: work takes the left frames, the
     board the right, and the working notes column explains itself.
     What changed is the container: the answer uses the SAME rows the
     resting page deals, so asking re-deals the magazine rather than
     replacing it with a different-looking page. */
  .answer .ixnotes { opacity: 0; transition: opacity 0.4s ease; }
  .answer .ixnotes.on { opacity: 1; }
  .answer .ixnotes .blk.working { color: rgba(0, 0, 0, 0.5); }
  /* a pull's name is its description: it reads as a caption, not a
     title, or the board would look like it was claiming credit */
  .ixrow .fd-it.k-pull .lbl { font-weight: 400; font-size: var(--cap);
    opacity: 0.55; }

  .ansback { padding-top: 16px; font-size: var(--lbl);
    font-weight: var(--lbl-weight); letter-spacing: var(--lbl-track); }
  .ansback button { background: none; border: 0; padding: 0; cursor: pointer;
    font: inherit; letter-spacing: inherit; color: var(--ink);
    text-decoration: underline; }

  .foot { display: flex; justify-content: space-between; gap: 24px;
    flex-wrap: wrap; align-items: baseline;
    margin: clamp(70px, 10vw, 150px) 40px 0; padding: 18px 0 40px;
    border-top: 1px solid rgba(0,0,0,0.14);
    font-size: var(--lbl); font-weight: var(--lbl-weight);
    letter-spacing: var(--lbl-track); }
  .foot .dim { opacity: 0.45; }

  /* The module's mobile block: the nav keeps its own tighter gutter
     (16px) while the page keeps 20px — that difference is in the real
     stylesheet, not a slip. No overflow-x here, unlike the module: a
     field flexes where four links could not, and the vocabulary row
     hangs off the bar, which an overflow context would clip. */
  @media (max-width: 760px) {
    :root { --nav: 48px; --gut: 20px; }
    #nav { --nav-size: 11px; --nav-gutter: 16px; --nav-overhang: 10px;
      grid-template-columns: 1fr auto; gap: 10px; letter-spacing: 0.02em; }
    /* 390pt cannot centre a wordmark AND seat a field beside it, so
       the wordmark takes the right end (the mailto's slot, which is
       hidden here anyway) and the field keeps the left gutter — the
       travel stays a straight vertical drop on a phone too. */
    #nav .mark { grid-column: 2; justify-self: end; }
    #nav .meta { display: none; }
    /* the shead and the feeds read --gut, which halves above, so the
       only thing left to restate here is the footer's margin */
    .foot { margin-left: var(--gut); margin-right: var(--gut); }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .fd-it .shot > * { clip-path: none !important;
      transform: none !important; transition: none !important; }
    .fd-it, .fd-note { opacity: 1 !important; transform: none !important;
      transition: none !important; }
    #query { transition: none; }
    /* the travel itself is scroll position, not animation, so it stays;
       the glide when an answer opens is animation, so it goes */
    .ask.settling { transition: none; }
  }
</style>
</head>
<body>

<nav id="nav">
  <div id="navBurn" aria-hidden="true"></div>
  <div class="ask">
    <input id="query" type="text" placeholder="Ask the house."
      autocomplete="off" autocorrect="off" spellcheck="false"
      aria-label="Ask the house" />
    <button type="button" class="clear" id="clearQ" aria-label="Clear">&times;</button>
  </div>
  <a href="#top" class="mark">Reckon House Staples</a>
  <a class="meta" href="mailto:hello@reckon.house">hello@reckon.house</a>
</nav>

<!-- the melt: the burn pill's displacement, lifted from the masthead -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="mastheadMelt" x="-20%" y="-20%" width="140%" height="140%"
    color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.015 0.025"
      numOctaves="3" seed="8" result="noise" />
    <feGaussianBlur in="noise" stdDeviation="2" result="smoothNoise" />
    <feDisplacementMap in="SourceGraphic" in2="smoothNoise" scale="18"
      xChannelSelector="R" yChannelSelector="G" />
  </filter>
</svg>

<section class="cover">
  <!-- the room the travelling field needs; the field itself lives in
       the bar, which is the end of its journey and the only place its
       position has to be exact -->
  <div id="askSlot" aria-hidden="true"></div>

  <div class="coverR">
    <span class="ledelbl">The practice</span>
    <p class="statement" id="infoLead"></p>
  </div>
</section>

<!-- the answer: only in query mode, and it opens with its receipts -->
<section class="answer">
  <div class="anshead">
    <p class="ansprose" id="ansSay"></p>
    <div class="ansback"><button type="button" id="resetQ">Back to the house</button></div>
  </div>
  <!-- the ring's own body, borrowed whole: the answer is not another
       page, it is the same magazine re-dealt. Work curtains into the

  <div class="ixbody">
    <div class="ixnotes" id="ansNotes"></div>
    <div class="ixrows" id="ansRows"></div>
  </div>
</section>

<!-- ── the magazine ── -->
<!-- the ring: the body of the homepage IS the case-study footer's
     All-work index. Every study ends at this object; here it stands
     alone with the brain above it. Enter anywhere, leave nowhere. -->
<!-- no lede: the field IS the title. At rest the brain reads
     "all work", which is both the name of what is below and a live
     query for it — the title and the control are one object. -->
<section class="stratum" id="stIndex">
  <div class="ixbody">
    <!-- the working notes hold the left column and ignore the row
         rhythm entirely: they are a column of their own, not cells -->
    <div class="ixnotes" id="ixNotes"></div>
    <div class="ixrows" id="ixRows"></div>
  </div>
</section>


<!-- the page transition. Two panels and nothing else: what makes the
     sequence read is the ORDER of their edges, not the number of parts. -->
<div class="pt" id="pt" aria-hidden="true">
  <div class="ptw"><div class="ptstack" id="ptwT"></div></div>
  <div class="ptb"><div class="ptstack" id="ptbT"></div></div>
</div>

<div class="foot">
  <span>&copy; 2026 Reckon House</span>
  <span class="dim">Awwwards Honors, 2026 &middot; Faux Reel released as an open repo</span>

</div>

/* ── cards ────────────────────────────────────────────────────────
   Every card carries NAMED fields rather than one blob, so the
   narrator can report which field a word actually landed in. "what it
   is" is a real field too, and it is what makes the old nav words
   searchable: ask for work and the work comes back, ask for staples
   and the board does. */
const norm = (s) => (" " + s + " ").toLowerCase().replace(/[-_./]/g, " ");
const cards = [];
WORK.forEach((r) => cards.push({
  kind: "work", title: r[0], sub: r[1], href: r[2], img: r[3],
  ar: r[4] + " / " + r[5],
  fields: [["title", r[0]], ["category", r[1]],
    ["filename", r[3].split("/").pop()],
    /* the case study's own hero filename, recovered when the index
       moved to the square thumbnails: those SEO names carry the
       keywords nobody authored (marble, island, vanity, sage), and
       dropping them silently cost "marble" its two works */
    ["the images", r[6] || ""],
    ["what it is", "work project case study portfolio"]]
}));
PULLS.forEach((p) => cards.push({
  kind: "pull", title: p.alt, img: p.src, ar: null,
  fields: [["description", p.alt], ["filename", p.src.split("/").pop()],
    ["what it is", "staple pull board inspiration what inspires me reference kept"]]
}));
QUOTES.forEach((q) => cards.push({
  kind: "quote", word: q.attribution.split(",")[0], full: q.text,
  att: q.attribution,
  fields: [["a kept quote", q.text], ["who said it", q.attribution],
    ["what it is", "staple quote board words"]]
}));
NOTES.forEach((n) => cards.push({
  kind: "note", word: n[0], full: n[1],
  fields: [["the practice", n[0] + " " + n[1]],
    ["what it is", "info about the practice studio contact"]]
}));
cards.forEach((c) => { c.norm = c.fields.map((f) => [f[0], norm(f[1])]); });

/* ── the matcher ──────────────────────────────────────────────────
   Written for the way people actually ask. Common words are set
   aside, whatever survives scores a card once for every word that
   lands in it, and no word is required to hit — so "does this company
   do master bedrooms?" still works when only "bedrooms" is in the
   house, and says so. Three outcomes get reported, never one: what
   matched and in which field, what found nothing, what was skipped.
   Swap this for embeddings later; the receipts line survives it. */
/* "all" and "every" belong here for a structural reason, not just a
   linguistic one: as substrings they land in wALL, DALLas, instALL —
   and a junk hit on every card trips the best-tier rule into holding
   back everything that only matched once. "all work", the page's own
   resting query, was returning 7 pieces instead of 31 because of it. */
const STOP = new Set(("a an and any all are as at be been by can could did do does " +
  "every everything for from get got has have how i if in is it its me my of on or please " +
  "should show some that the their them there they this to us was we what " +
  "which who with would you your company thing things stuff").split(" "));

function analyse(q) {
  const raw = q.toLowerCase().replace(/[^a-z0-9&\s]/g, " ").split(/\s+/).filter(Boolean);
  const toks = [], skipped = [];
  raw.forEach((t) => ((t.length < 2 || STOP.has(t)) ? skipped : toks).push(t));
  if (!toks.length) return null;
  const hit = (h, t) => h.includes(t) ||
    (t.length > 3 && t.endsWith("s") && h.includes(t.slice(0, -1)));
  const score = new Map();
  const caught = new Map();          /* card → which words it caught */
  const spread = new Map();          /* word → how many cards carry it */
  const where = [], dead = [];
  toks.forEach((t) => {
    const fields = new Set();
    let n = 0;
    cards.forEach((c, i) => {
      let got = false;
      c.norm.forEach((f) => { if (hit(f[1], t)) { got = true; fields.add(f[0]); } });
      if (got) {
        score.set(i, (score.get(i) || 0) + 1);
        if (!caught.has(i)) caught.set(i, new Set());
        caught.get(i).add(t);
        n += 1;
      }
    });
    spread.set(t, n);
    if (fields.size) where.push([t, [...fields]]); else dead.push(t);
  });
  /* Best tier, unless the best tier is thin. A card that caught every
     live word beats one that caught a single word, and mixing the two
     ruins the answer: "jack white" would drag forty black-and-white
     photographs in behind the nine that are actually him. But strict
     tiers can starve — nothing in the house says "app" AND "design" in
     one place except the practice note, and one info card is not an
     answer to "app design". So a thin top tier keeps the near misses
     behind it rather than throwing them away, and the receipts say
     which is which. */
  const rank = { work: 0, pull: 1, quote: 2, note: 3 };
  const best = Math.max(0, ...score.values());
  const all = [...score.keys()].sort((a, b) =>
    (score.get(b) - score.get(a)) || (rank[cards[a].kind] - rank[cards[b].kind]));
  const top = all.filter((i) => score.get(i) === best);
  const thin = top.length < 3 && all.length > top.length;
  /* A thin top tier extends with near-misses — but only the ones that
     caught the RAREST live word. The old rule let in every near-miss,
     and a query like "kitchen design" flooded: "design" sits in half
     the categories on the site, so 27 projects arrived behind the two
     that actually answer. Rarity is the tell for which word carries
     the query's meaning: five cards say kitchen, thirty say design,
     so the kitchen cards are the near-misses worth keeping. */
  let idx = top;
  if (thin) {
    const live = toks.filter((t) => spread.get(t) > 0);
    const rare = live.sort((a, b) => spread.get(a) - spread.get(b))[0];
    idx = all.filter((i) =>
      score.get(i) === best || (caught.get(i) && caught.get(i).has(rare)));
  }
  return {
    idx, where, dead, skipped,
    held: all.length - idx.length,
    exact: thin ? top.length : 0
  };
}

/* ── the facts layer ──────────────────────────────────────────────
   The substring matcher above finds strings; this finds FACTS. The
   index is built by scripts/build-facts.mjs from the case studies
   themselves — every term in it was mined from the studies' own prose
   and alt text, negations and metaphors already rejected — so an
   answer composed from it can name what kind of thing was asked
   about. "Marble" is a material, "kitchen" a room, "Nordstrom" a
   client, and the sentence reads differently for each.

   The matcher stays underneath as the safety net: the index only
   speaks about what it verified, and everything else (a band's name,
   "ridgeline", a half-remembered filename) still deserves an answer. */
let FACTS = null;
const factCard = { work: new Map(), pull: new Map() };
cards.forEach((c, i) => {
  if (c.kind === "work") factCard.work.set(c.href, i);
  if (c.kind === "pull") factCard.pull.set(c.img, i);
});
fetch("project-facts.min.json")
  .then((r) => (r.ok ? r.json() : null))
  .then((j) => {
    FACTS = j;
    /* a deep-linked ?q= builds its answer before this fetch lands, on
       the matcher alone. If the facts have something better to say
       about the standing question, say it — the rebuild happens
       inside the first beats of arrival, not mid-read */
    if (asked && query.trim() && think(query)) buildAnswer();
  })
  .catch(() => {});

const fold = (s) => s.toLowerCase().replace(/[^a-z0-9&]+/g, " ").trim();
/* alias values keep their authored casing (neiman → "Neiman Marcus"),
   and everything downstream compares folded, so fold on the way out */
const resolveAlias = (q) => fold((FACTS && FACTS.aliases && FACTS.aliases[q]) || q);
/* "dining" names "dining table" the way "interior" names "Interior
   Design": the whole word, never a fragment — "din" reaches nothing */
const namesTerm = (t, q) => {
  const f = fold(t);
  if (f === q || f.split(" ").includes(q)) return true;
  /* bedrooms finds bedroom, tables finds table: a trailing s is the
     one bit of grammar the lookup absorbs, and nothing shorter than
     four letters gets stemmed (gas must not find ga) */
  if (q.length > 3 && q.endsWith("s")) {
    const qs = q.slice(0, -1);
    return f === qs || f.split(" ").includes(qs);
  }
  return false;
};

function factMatches(p, q) {
  /* facet terms arrive as [term, evidenceCount]; the count is the
     ranking signal. Disciplines and tools are curated, count 1. */
  const m = [];
  for (const facet in p.f) p.f[facet].forEach(([t, n]) => {
    if (namesTerm(t, q)) m.push({ facet, term: t, n });
  });
  p.d.forEach((d) => { if (namesTerm(d, q)) m.push({ facet: "discipline", term: d, n: 1 }); });
  p.t.forEach((t) => { if (namesTerm(t, q)) m.push({ facet: "tool", term: t, n: 1 }); });
  return m;
}
const weight = (h) => h.m.reduce((a, m) => a + m.n, 0);
/* words that shape a query without carrying it: "interior projects"
   is a question about interiors, and requiring "projects" to land
   somewhere would sink it */
const FILLER = new Set(("projects project work works pieces piece " +
  "things thing stuff surfaces surface").split(" "));

function factLookup(q0) {
  const q = resolveAlias(fold(q0));
  if (!q || !FACTS) return { hits: [], pulls: [], dead: [], and: false };
  const seek = (qw) => ({
    hits: FACTS.projects.map((p) => ({ p, m: factMatches(p, qw) })).filter((h) => h.m.length),
    pulls: FACTS.pulls.filter((p) => {
      for (const facet in p.f) if (p.f[facet].some((t) => namesTerm(t, qw))) return true;
      return false;
    })
  });
  let r = seek(q);
  if (r.hits.length || r.pulls.length) return { ...r, dead: [], and: false };
  /* Several terms at once. Only words the index KNOWS anything about
     get a vote: "does this company do master bedrooms" is a bedrooms
     question wearing a sentence, and letting "does" veto it would be
     the strictness defeating the point. The AND stays strict across
     the live words — "kitchen island" still narrows to the one
     project with both — and the dead ones get reported, the same
     honesty the matcher has always had. */
  const words = [...new Set(q.split(" ").map(resolveAlias)
    .filter((w) => w.length > 2 && !FILLER.has(w) && !STOP.has(w)))];
  const alive = (w) => FACTS.projects.some((p) => factMatches(p, w).length) ||
    FACTS.pulls.some((p) => {
      for (const facet in p.f) if (p.f[facet].some((t) => namesTerm(t, w))) return true;
      return false;
    });
  const live = words.filter(alive);
  const dead = words.filter((w) => !live.includes(w));
  if (!live.length) return { hits: [], pulls: [], dead: [], and: false };
  if (live.length === 1) {
    r = seek(live[0]);
    /* Half the question died and one word survived. Keep the answer
       only when that word carries a MINED fact — "master bedrooms"
       loses master and still means bedrooms, because bedroom is a
       room the index dug out of the work. "App development" losing
       app must not become a confident answer about Brand Development:
       a fragment of a discipline's name is not the question's
       subject. The matcher below does uncertainty better. */
    if (dead.length && !r.hits.some((h) => h.m.some((m) =>
      m.facet !== "discipline" && m.facet !== "tool"))) {
      return { hits: [], pulls: [], dead: [], and: false };
    }
    return { ...r, dead, and: false };
  }
  const hits = FACTS.projects
    .map((p) => ({ p, per: live.map((w) => factMatches(p, w)) }))
    .filter((h) => h.per.every((m) => m.length))
    .map((h) => ({ p: h.p, m: h.per.flat() }));
  return { hits, pulls: [], dead, and: true };
}

/* ── intents ──────────────────────────────────────────────────────
   Some questions are not about the work at all. "Contact" was being
   answered with a note-card shrug and "email address" with whatever
   pull happened to contain the word address — the house knew the
   words and missed the point. A person asking these is trying to
   REACH somebody, and the reasonable reply is the address, said
   plainly, first. */
const REACH = new Set(("contact email mail reach hire hiring hired inquiry " +
  "inquiries inquire commission collaborate touch talk call available availability").split(" "));
const WHOAMI = new Set("who about bio yourself jeremy prasatik practice".split(" "));
const WHERE = new Set("where based located location".split(" "));
const rawWords = (q) => q.toLowerCase().replace(/[^a-z0-9&\s]/g, " ").split(/\s+/).filter(Boolean);

const plural = (t) => (/[^aeiou]y$/.test(t) ? t.slice(0, -1) + "ies" : t + "s");
const capWords = (t) => t.replace(/\b[a-z]/g, (c) => c.toUpperCase());
/* three names get said in full — "and one more" withholding a name
   the sentence had room for reads as coyness, not economy */
const nameList = (xs) =>
  xs.length === 1 ? xs[0] :
  xs.length === 2 ? xs[0] + " and " + xs[1] :
  xs.length === 3 ? xs[0] + ", " + xs[1] + ", and " + xs[2] :
  xs.slice(0, 2).join(", ") + ", and " + num(xs.length - 2) + " more";

/* One plan for the whole answer: what to say, what to show, and what
   the receipt can prove. Returns null when neither intents nor facts
   have anything, and the matcher underneath takes the question. */
function think(q) {
  const words = rawWords(q);
  if (!words.length) return null;

  if (words.some((w) => REACH.has(w))) {
    const ncards = [];
    NOTES.forEach((n, i) => {
      if (n[0] === "Get in touch" || n[0] === "How I work") ncards.push(noteIdx(i));
    });
    const setLines = (FACTS && FACTS.voice && FACTS.voice.set) || {};
    return {
      say: setLines.contact ||
        "Looking to reach me? hello@reckon.house. That inbox is the whole contact page.",
      receipt: "read as: getting in touch  ·  " + ncards.length + " notes  ·  house voice v" + VOICE_VERSION,
      workIdx: ncards, pullIdx: [], mailto: true
    };
  }

  const f = factLookup(q);
  if (f.hits.length || f.pulls.length) return planFacts(q, f);

  /* Nothing matched, but the question might be using the world's word
     for a thing the studies name differently: "app development",
     "software", "coding". The bridge redirects whole, and says it did
     — silently swapping the subject is what it exists to avoid. */
  const qf = fold(q);
  const senseKey = SENSES[qf] ? qf : words.find((w) => SENSES[w]);
  const br = senseKey ? senseBridge(senseKey) : null;
  if (br) {
    const plan = planFacts(br.target, factLookup(br.target));
    plan.say = "\u201c" + cap(qf) + "\u201d files under " + br.target + " here. " +
      cap(num(plan.workIdx.length)) + " projects carry it.";
    plan.receipt = "\u201c" + qf + "\u201d read as the " + br.label + " kind, bridged to " +
      br.target + "  \u00b7  " + plan.workIdx.length + " projects  \u00b7  facts index v" +
      FACTS.vocabularyVersion;
    return plan;
  }

  /* after facts on purpose: "where do you use marble" is a marble
     question. Only a where with nothing else in it lands here. */
  if (FACTS && words.some((w) => WHERE.has(w))) {
    const placed = FACTS.projects.filter((p) => p.f.place && p.f.place.length);
    const idx = placed.map((p) => factCard.work.get(p.href)).filter((i) => i != null)
      .sort((a, b) => a - b);
    const names = [...new Set(placed.flatMap((p) => p.f.place.map(([t]) => t)))]
      .filter((t) => t !== "texas" && t !== "dallas").map(capWords);
    return {
      say: "Dallas, independent. The placed work runs through " + nameList(names) + ".",
      receipt: "read as: where  ·  place facts on " + idx.length + " projects  ·  facts index v" +
        FACTS.vocabularyVersion,
      workIdx: [noteIdx(NOTES.findIndex((n) => n[0] === "How I work"))]
        .concat(idx).filter((i) => i != null && i >= 0),
      pullIdx: [], mailto: false
    };
  }

  if (words.some((w) => WHOAMI.has(w))) {
    return {
      say: "I'm Jeremy Prasatik. The notes below have the rest.",
      receipt: "read as: about the practice  ·  " + NOTES.length + " notes",
      workIdx: NOTES.map((n, i) => noteIdx(i)), pullIdx: [], mailto: false
    };
  }
  return null;
}
function noteIdx(i) {
  return cards.findIndex((c) => c.kind === "note" && c.word === NOTES[i][0]);
}

/* Words that mean one thing in the studies and another in the mouth
   of the person asking. "Development" is Brand Development on this
   site and building software everywhere else. The bridge is curated
   like the vocabulary is, and it never speaks unverified: the target
   is looked up first, and a bridge to nothing stays silent. */
const SENSES = {
  development: ["software", "engineering"],
  software: ["software", "engineering"],
  coding: ["software", "engineering"],
  programming: ["software", "engineering"],
  developer: ["software", "engineering"],
  engineer: ["software", "engineering"],
  dev: ["software", "engineering"],
};
function senseBridge(qf) {
  const sense = SENSES[qf];
  if (!sense || !FACTS) return null;
  const [label, target] = sense;
  if (target === qf) return null;
  const r = factLookup(target);
  return r.hits.length ? { label, target, hits: r.hits.length } : null;
}

/* ── the house voice ──────────────────────────────────────────────
   A visible stage, not a vibe. The templates below are cut from the
   studies' own measured diction — things sit, carry, live and anchor
   there; colon lists; contractions; "the rest" — and this pass
   enforces the copy rules the studies are edited under, mechanically:
   no em dashes ever, no formal is-not, one space, one full stop even
   when a title brings its own. It runs on every sentence the house
   speaks, and the working names it, because a pipeline you can show
   is part of the site's own case study. */
const VOICE_VERSION = 2;
function voice(s) {
  return s
    .replace(/\u2014/g, ", ")
    .replace(/\b(It|That|There|Here) is\b/g, "$1's")
    .replace(/\b(does|do|is|was) not\b/g, (m, v) =>
      ({ does: "doesn't", do: "don't", is: "isn't", was: "wasn't" }[v]))
    .replace(/\.\.+/g, ".")
    .replace(/  +/g, " ")
    .trim();
}
/* the same question always gets the same sentence; different
   questions get different bones. A rotation seeded by the clock would
   make the house sound different on every visit, which reads as
   random, not alive. */
const vary = (q, n) => {
  let h = 0;
  for (const c of q) h = (h * 31 + c.charCodeAt(0)) & 0xffff;
  return h % n;
};

/* Facet-aware composition. The verb belongs to the KIND of fact:
   materials are used, furniture is simply there, clients are names,
   tools are built with. Same copy rules as everything else in the
   house: short sentences, contractions, no em dashes. */
const FACET_RANK = ["client", "material", "furniture", "room", "colour", "place", "tool", "discipline"];
function planFacts(q, f) {
  /* Most evidence first, then the order the house would walk you
     through them. Weight is the mined count riding on each term: the
     living room with seventeen sofa mentions leads, the mockup whose
     couch appears in one photograph follows, and A.R.C. merely
     cataloguing the word "kitchen" never outranks the kitchen. */
  const hits = [...f.hits].sort((a, b) =>
    (weight(b) - weight(a)) ||
    ((factCard.work.get(a.p.href) ?? 99) - (factCard.work.get(b.p.href) ?? 99)));
  const workIdx = hits.map((h) => factCard.work.get(h.p.href)).filter((i) => i != null);
  const pullIdx = f.pulls.map((p) => factCard.pull.get(p.src)).filter((i) => i != null);
  /* w counts PROJECTS, and it must, because the grid does: two
     Fairviews share a display title, and a sentence saying seven over
     eight visible cards reads as a miscount, not a nuance */
  const titles = [...new Set(workIdx.map((i) => cards[i].title))];
  const w = workIdx.length, p = pullIdx.length;

  /* which facet speaks: the one with the most projects, rank breaking
     the tie, and the receipt lists every reading either way */
  const byFacet = {};
  hits.forEach((h) => h.m.forEach((m) => {
    (byFacet[m.facet] ??= { terms: new Set(), n: 0 }).terms.add(m.term);
    byFacet[m.facet].n += m.n || 1;
  }));
  const facets = Object.keys(byFacet).sort((a, b) =>
    (byFacet[b].n - byFacet[a].n) ||
    (FACET_RANK.indexOf(a) - FACET_RANK.indexOf(b)));
  const lead = facets[0];
  /* speak the asker's own term when it was matched directly: someone
     who typed "table" gets tables, not the dining table that happened
     to lead the strongest project's list */
  const qRes = resolveAlias(fold(q));
  const leadTerms = lead ? [...byFacet[lead].terms] : [];
  const qStem = qRes.length > 3 && qRes.endsWith("s") ? qRes.slice(0, -1) : qRes;
  const exact = leadTerms.find((t) => fold(t) === qRes || fold(t) === qStem);
  const term = exact || leadTerms[0] || fold(q);
  /* "Development" names two different disciplines here and neither IS
     the word typed. Picking one silently is the index deciding what
     the visitor meant; saying the fork is reasoning they can see. */
  const forked = !exact && leadTerms.length > 1 && !f.and;

  /* The sentence only claims projects that matched the SPEAKING facet.
     "Dining" finds a dining table in the kitchen and a dining room in
     A.R.C.'s catalogue, and a line placing a dining table in A.R.C.
     would be the index putting words in the house's mouth. The other
     reading still gets shown, and gets named for what it is. */
  const leadHits = hits.filter((h) => h.m.some((m) => m.facet === lead));
  const tl = [...new Set(leadHits.map((h) =>
    cards[factCard.work.get(h.p.href)]?.title).filter(Boolean))];
  const wl = leadHits.length;
  const others = titles.filter((t) => !tl.includes(t));

  /* When an alias did the work, say so: someone who asked for shiplap
     and got "I've used wood" watched the house change the subject.
     "Shiplap files under wood here" is the same lookup made visible.
     Skipped when the two share a word — "bathroom files under bath"
     explains nothing. */
  const qf = fold(q);
  const aliased = resolveAlias(qf) !== qf &&
    !qf.split(" ").some((wd) => fold(term).split(" ").includes(wd));
  const bridge = aliased ? "“" + cap(qf) + "” files under " + term + " here. " : "";

  /* The about layer: an authored line for this term, quoted from the
     calibration file. When one exists it LEADS, the index injects the
     live counts mid-sentence, and the tail closes personal. The index
     never writes his opinions; he never has to remember his counts. */
  const vTerms = (FACTS && FACTS.voice && FACTS.voice.terms) || {};
  const vl = vTerms[qRes] || vTerms[fold(term)];
  const inspoCount = (n) =>
    n === 1 ? "1 inspiration example" : n + " saved as inspiration";

  const v = vary(fold(q), 3);
  let say;
  if (vl && w && !f.and) {
    const countLine = vl.counts === false ? "" :
      " You can see " + w + " below" +
      (p ? ", along with " + inspoCount(p) + "." : ".");
    say = (vl.lead || "") + countLine + (vl.tail ? " " + vl.tail : "");
  } else if (forked && w) {
    say = "\u201c" + cap(fold(q)) + "\u201d goes " + num(leadTerms.length) +
      " ways here: " + nameList(leadTerms) + ". " +
      cap(num(w)) + (w === 1 ? " project" : " projects") + " between them.";
  } else if (!w) {
    say = "Haven't worked that into a project yet, but " +
      (p === 1 ? "1 inspiration example is below." : num(p) + " below are saved as inspiration.");
  } else if (f.and) {
    /* two Hill Country studies share a display title, and "two
       projects: Hill Country home" reads as a miscount; "among them"
       carries the arithmetic honestly */
    say = w === 1
      ? "One project holds all of that: " + titles[0] + "."
      : w === titles.length
        ? cap(num(w)) + " projects hold all of that: " + nameList(titles) + "."
        : cap(num(w)) + " projects hold all of that, " + nameList(titles) + " among them.";
  } else if (lead === "client") {
    say = wl === 1
      ? "That's " + term + ". One project: " + tl[0] + "."
      : ["That's " + term + ". " + cap(num(wl)) + " projects under the name.",
         term + ": " + num(wl) + " projects. " + tl[0] + " leads.",
         "That's " + term + ". " + cap(num(wl)) + " projects came through here."][v];
  } else if (lead === "material" || lead === "colour") {
    const it = aliased ? "It" : cap(term);
    say = bridge + (wl === 1
      ? (aliased ? "It lives in " : cap(term) + " lives in ") + tl[0] + "."
      : wl === 2
        ? it + " sits in " + tl[0] + " and " + tl[1] + "."
        : [it + " lives in " + num(wl) + " projects. " + tl[0] + " carries the most.",
           it + " runs through " + num(wl) + " projects. Start with " + tl[0] + ".",
           "I've used " + (aliased ? "it" : term) + " in " + num(wl) + " projects, " + tl[0] + " among them."][v]);
  } else if (lead === "furniture") {
    say = aliased
      ? bridge + (wl === 1 ? "There's one in " + tl[0] + "."
        : "One sits in " + num(wl) + " projects. " + tl[0] + " first.")
      : wl === 1 ? "There's a " + term + " in " + tl[0] + "."
      : wl === 2 ? "There's a " + term + " in " + tl[0] + " and in " + tl[1] + "."
      : ["A " + term + " sits in " + num(wl) + " projects. " + tl[0] + " carries the most.",
         cap(num(wl)) + " projects have a " + term + " somewhere. Start with " + tl[0] + ".",
         capWords(plural(term)) + ": " + num(wl) + " projects. " + tl[0] + " first."][v];
  } else if (lead === "room") {
    say = bridge + (wl === 1 ? "That's " + tl[0] + "."
      : [capWords(plural(term)) + ": " + nameList(tl) + ".",
         cap(num(wl)) + " projects have " + term + " work in them. " + tl[0] + " leads.",
         capWords(plural(term)) + ": " + nameList(tl) + "."][v]);
  } else if (lead === "place") {
    say = bridge + capWords(term) + " work: " + nameList(tl) + ".";
  } else if (lead === "tool") {
    say = wl === 1
      ? "Built with " + term + ". One project: " + tl[0] + "."
      : ["Built with " + term + ". It's in " + num(wl) + " projects.",
         cap(num(wl)) + " projects went through " + term + ".",
         term + " does work in " + num(wl) + " projects here."][v];
  } else {
    say = wl === 1
      ? "That's " + term + " here. One project carries it: " + tl[0] + "."
      : ["That's " + term + " here. " + cap(num(wl)) + " projects carry it.",
         term + ": " + num(wl) + " projects.",
         cap(num(wl)) + " projects sit under " + term + "."][v];
  }
  /* the projects that matched the word another way, named as such */
  if (!f.and && w && others.length) {
    say += " " + nameList(others) +
      (others.length === 1 ? " answers" : " answer") + " it in a different sense.";
  }
  const bridged = senseBridge(fold(q));
  if (bridged) {
    say += " If you meant the " + bridged.label + " kind, ask for " +
      bridged.target + ". " + cap(num(bridged.hits)) + " projects answer to it.";
  }
  /* the calibration's own register for the right-hand column:
     "saved as inspiration", "inspiration example". Voice-led answers
     already counted it in their count line. */
  if (w && p && !vl) {
    say += p === 1 ? " Plus 1 inspiration example below."
      : p === 2 ? " A couple below are saved as inspiration."
      : " " + num(p) + " below are saved as inspiration.";
  }
  if (f.dead && f.dead.length && (w || p)) {
    say += " Nothing answered to \u201c" + f.dead.join("\u201d, \u201c") + "\u201d.";
  }

  say = voice(say);

  const readings = facets.map((fa) =>
    fa + ": " + [...byFacet[fa].terms]
      .sort((a, b) => (fold(b) === qRes || fold(b) === qStem ? 1 : 0) -
                      (fold(a) === qRes || fold(a) === qStem ? 1 : 0))
      .slice(0, 2).join(", "));
  const receipt = "“" + fold(q) + "” read as " +
    (readings.length ? readings.join("  ·  ") : "several facts at once") +
    "  ·  " + w + (w === 1 ? " project" : " projects") +
    "  ·  " + p + " saved as inspiration" +
    "  ·  facts index v" + (FACTS ? FACTS.vocabularyVersion : "?") +
    "  ·  house voice v" + VOICE_VERSION;
  return { say, receipt, workIdx, pullIdx, mailto: false };
}

/* ── shared building blocks ── */
let seedNo = 5;
let query = "";
const REDUCE = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const SHARES = [1, 1, 1, 0.82, 0.66];
const mkRnd = (s0) => { let s = s0;
  return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }; };

function observeArrivals(els) {
  if (REDUCE()) { els.forEach((el) => el.classList.add("fd-on")); return; }
  const io = new IntersectionObserver((es) => {
    es.forEach((e) => {
      if (e.isIntersecting) { e.target.classList.add("fd-on"); io.unobserve(e.target); }
    });
  }, { threshold: 0.05, rootMargin: "0px 0px -5% 0px" });
  els.forEach((el) => io.observe(el));
}

let reelBoxes = [];
function imgCard(card, rnd, allowShare) {
  /* every card knows what it is, so an answer card can find the same
     card's rect in the magazine and travel from it */
  const el = document.createElement(card.href ? "a" : "div");
  el.dataset.key = card.href || card.img || card.title || "";
  el.className = "fd-it k-" + card.kind;
  if (card.href) { el.href = card.href; el.setAttribute("aria-label", card.title); }
  if (allowShare) {
    const share = SHARES[Math.floor(rnd() * SHARES.length)];
    if (share < 1) {
      el.style.setProperty("--w", (share * 100).toFixed(0) + "%");
      if (rnd() > 0.5) el.classList.add("insetR");
    }
  }
  const shot = document.createElement("span");
  shot.className = "shot";
  if (card.ar) shot.style.setProperty("--ar", card.ar);
  el.appendChild(shot);
  if (card.href === REEL_HREF && !REDUCE()) {
    shot.style.setProperty("--ar", "1");
    reelBoxes.push(shot);
  } else {
    /* The picture gets a PLATE to sit on. The plate is what the
       curtain clips and what settles from 1.25 to 1; the image itself
       is left alone, because the drift driver owns its transform and
       two writers on one property is the bug this kit keeps paying
       for. One element each. */
    const plate = document.createElement("span");
    plate.className = "plate";
    const img = document.createElement("img");
    img.src = card.img; img.alt = card.kind === "pull" ? card.title : "";
    img.loading = "lazy"; img.decoding = "async";
    plate.appendChild(img);
    shot.appendChild(plate);
  }
  const cap = document.createElement("span");
  cap.className = "cap";
  cap.textContent = card.kind === "work"
    ? card.title + " — " + card.sub
    : "Pulled — " + (card.title === "Saved image" ? "the board" : card.title);
  el.appendChild(cap);
  /* Work gets a standing label under the frame as well. A hover
     caption is a nice touch on a board of pulls, where the tag is a
     bonus; on the work it is the ONLY thing naming the project, and it
     does not exist at all on a phone. */
  if (card.kind === "work") {
    const lbl = document.createElement("span");
    lbl.className = "lbl";
    lbl.innerHTML = "";
    lbl.appendChild(document.createTextNode(card.title));
    const sub = document.createElement("span");
    sub.className = "sub";
    sub.textContent = "  " + card.sub;
    lbl.appendChild(sub);
    el.appendChild(lbl);
  }
  return el;
}

function noteCard(card, rnd) {
  const el = document.createElement("button");
  el.type = "button";
  el.className = "fd-note";
  el.dataset.key = "note:" + (card.title || card.word || "");
  el.style.setProperty("--nar", rnd && rnd() > 0.5 ? "4 / 3" : "1 / 1");
  if (card.kind !== "quote") el.classList.add("plain");
  /* solid ink under the bar: let the masthead reverse over it */
  el.setAttribute("data-nav-dark", "");
  el.innerHTML = '<span class="idx"></span><span class="word"></span><span class="full"></span>';
  el.querySelector(".idx").textContent = "A note kept";
  el.querySelector(".word").textContent = card.word;
  const full = el.querySelector(".full");
  full.textContent = card.full;
  if (card.att) {
    const att = document.createElement("span");
    att.className = "att"; att.textContent = card.att;
    full.appendChild(att);
  }
  el.addEventListener("click", () => el.classList.toggle("open"));
  return el;
}

function armReels() {
  if (!reelBoxes.length) return;
  const rio = new IntersectionObserver((es, o) => {
    es.forEach((e) => {
      if (!e.isIntersecting) return;
      o.unobserve(e.target);
      e.target.style.removeProperty("--drift");
      const rl = document.createElement("sizzle-reel");
      rl.setAttribute("radius", "0"); rl.setAttribute("speed", "1");
      rl.sequence = REEL_SEQ;
      rl.setAttribute("colors", REEL_COLORS);
      rl.setAttribute("images", REEL_IMAGES.join(", "));
      rl.style.cssText = "display:block;width:100%;height:100%;aspect-ratio:auto";
      e.target.appendChild(rl);
    });
  }, { rootMargin: "600px 0px" });
  reelBoxes.forEach((b) => rio.observe(b));
  reelBoxes = [];
}

/* How long the second frame in a row waits before its curtain drops.
   0.7 was arrived at on paper and was plainly too long in the hand:
   the left frame reached 89% before the right one moved, so the row
   read as two events rather than one. At 0.25 the left is around a
   third of the way down when the right starts, and the two fall
   together while still clearly beginning apart. A reminder that the
   measured profile tells you what a curve DOES, not how long a wait
   feels. */
const CURTAIN_LAG = "0.25s";

/* ── the blocks ────────────────────────────────────────────────────
   Three shapes and a rhythm. There is no three-across row any more:
   the work runs as a hero, then a pair, then the pair the other way,
   with a stated interval between each — closer to how a case study
   breathes than to how a feed packs.

   "n" is how many cards a block eats. Blocks never share a row, so
   there is nothing to tile and nothing to reserve; the shapes only
   have to take turns. */
const BLOCKS = [
  { w: 3, n: 2, kind: "pairA" },   /* 5|7  narrow left, wide right */
  { w: 3, n: 2, kind: "pairB" },   /* 7|5  the same reversed */
  { w: 2, n: 1, kind: "hero" },    /* 1    the full width */
];
const SHAPE = {
  pairA: ["pNarrow", "pWide"],
  pairB: ["pWideL", "pNarrowR"],
  hero: ["hero"],
};

/* the footer's width ladder, shared by the resting deal and the
   answer: consecutive frames at least a step and a half apart, so no
   two neighbours read as the same size */
const IX_TIERS = [0.33, 0.43, 0.53, 0.64, 0.74, 0.86];
function dealShares(n, rnd) {
  const shares = [];
  let prev = -1;
  for (let i = 0; i < n; i++) {
    let t, guard = 0;
    do { t = IX_TIERS[Math.floor(rnd() * IX_TIERS.length)]; }
    while (Math.abs(t - prev) < 0.17 && guard++ < 24);
    shares.push(t); prev = t;
  }
  return shares;
}

/* ── the magazine ── */
function buildMagazine() {
  const rnd = mkRnd(seedNo);

  /* the ring's body: every project, dealt into two rails of squares
     with the five notes as text blocks down the side rails */
  /* No shuffle. The order is the live homepage's, and it is a
     judgement — Sally, Ivy, A.R.C., the kitchen — not something a
     seed should get to overturn. The deal still composes the page:
     it sets every frame's width, which is what decides the rhythm of
     the rows. Order is editorial, size is dealt. */
  const workIdx = cards.map((c, i) => i).filter((i) => cards[i].kind === "work");

  /* the footer's width ladder: consecutive cards at least a step and
     a half apart, so no two neighbours read as the same size */
  /* The shipped ladder, unchanged from PressingIndex. An earlier pass
     here raised the floor to 0.52 to keep labels short, and it cost
     the thing the ladder is FOR: at 0.52-1.0 the largest frames fill
     their half completely and the page loses its white space. Rows
     are wider cells than the old rails were, so 0.33 is no longer the
     122px stamp it was there — it is ~175px with room to breathe
     around it. Air first; the label wraps if it wraps. */
  const shares = dealShares(workIdx.length, rnd);

  /* the statement lives under the field; the four working notes hold
     the left column */
  const allNotes = cards.map((c, i) => i).filter((i) => cards[i].kind === "note");
  const bio = allNotes.find((i) => /practice/i.test(cards[i].word || ""));
  /* the order is authored, not the corpus's: Recently first, What I do
     last. One array to reshuffle if the mockup meant it the other way
     up — its own reading was ambiguous at this size. */
  const NOTE_ORDER = ["recently", "get in touch", "how i work", "what i do"];
  const noteIdx = allNotes
    .filter((i) => i !== bio)
    .sort((x, y) =>
      NOTE_ORDER.indexOf((cards[x].word || "").toLowerCase()) -
      NOTE_ORDER.indexOf((cards[y].word || "").toLowerCase()));
  const lead = document.getElementById("infoLead");
  if (bio !== undefined) {
    lead.textContent = cards[bio].full;
    /* keyed like any card, so the brain can travel it out of here */
    lead.dataset.key = "note:" + cards[bio].word;
  }

  const notesEl = document.getElementById("ixNotes");
  notesEl.innerHTML = "";
  noteIdx.forEach((ci) => {
    const blk = document.createElement("div");
    blk.className = "blk";
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = cards[ci].word;
    blk.appendChild(tag);
    blk.appendChild(document.createTextNode(cards[ci].full));
    /* same key noteCard writes, so a note the brain surfaces can
       travel out of this column */
    blk.dataset.key = "note:" + (cards[ci].word || "");
    notesEl.appendChild(blk);
  });

  /* ROWS, two frames each, hung from one line and ruled off below.
     The pairing is consecutive rather than split down the middle:
     with rails, half the deck went down each side; with rows, the
