     deal order IS the reading order, left then right, top to bottom. */
  const rowsEl = document.getElementById("ixRows");
  rowsEl.innerHTML = "";
  const workEls = [];
  for (let i = 0; i < workIdx.length; i += 2) {
    const row = document.createElement("div");
    row.className = "ixrow";
    /* the notes float over the first column, so it is left empty */
    row.appendChild(document.createElement("div"));
    [0, 1].forEach((k) => {
      const cell = document.createElement("div");
      cell.className = "cell";
      const ci = workIdx[i + k];
      if (ci !== undefined) {
        const el = imgCard(cards[ci], rnd, false);
        el.style.setProperty("--share", String(shares[i + k]));
        /* the right-hand frame follows the left one in */
        if (k) el.style.setProperty("--lag", CURTAIN_LAG);
        cell.appendChild(el);
        workEls.push(el);
      }
      row.appendChild(cell);
    });
    /* the rule starts where the left frame starts */
    const rule = document.createElement("div");
    rule.className = "ixrule";
    const leftShare = shares[i] !== undefined ? shares[i] : 1;
    rule.style.marginLeft =
      "calc((100% - var(--ixgap)) / 2 * " + (1 - leftShare).toFixed(3) + ")";
    row.appendChild(rule);
    rowsEl.appendChild(row);
  }
  armRows(rowsEl);

  observeArrivals(workEls);
  armReels();
  if (window.armDrift) armDrift(workEls);
}

/* ── the answer, as an act ─────────────────────────────────────────
   The old answer was a filter: two strings and a grid, set in one
   synchronous pass, done before you saw it think. Now asking is
   something you watch happen. The matcher still answers instantly —
   the data is tiny and nothing here pretends otherwise — but the
   REPORT is sequenced: the house's sources answer one at a time, each
   line landing together with its cards.

   Two rules keep it honest. Every line is the matcher's own output —
   its receipts, sequenced, never invented "thinking" copy. And cards
   that were on screen when you asked TRAVEL from where they were to
   their seat in the answer, so the page visibly reorganises rather
   than being replaced. Cards from further down arrive from below.

   Reduced motion: the whole act collapses to the old instant answer —
   same lines, same cards, no time axis. */
let askGen = 0;
let askTimers = [];
function holdAsk(fn, ms) {
  const gen = askGen;
  askTimers.push(setTimeout(() => { if (gen === askGen) fn(); }, ms));
}
function cancelAsk() {
  askGen += 1;
  askTimers.forEach(clearTimeout);
  askTimers = [];
  document.body.classList.remove("working");
}

/* ── the answer, composed ─────────────────────────────────────────
   Sentences, not receipts. Every clause is still DERIVED from the
   matcher's output: counts, kinds, project names, dead words. Nothing
   gets said that the data cannot back, which is the same honesty the
   receipt list had, in a register a person would use. The house
   speaks as Jeremy because the case studies do. House copy rules
   apply to the machine's copy too: contractions, short sentences,
   and no em dashes anywhere. */
/* Counts are typed as digits. The studies lean words for small
   numbers, but the calibration overruled the corpus: "if we do a
   count we would type the number - 12." His call. */
const num = (n) => String(n);
const cap = (t) => t.charAt(0).toUpperCase() + t.slice(1);

function composeAnswer(a) {
  const by = { work: [], pull: [], note: [], quote: [] };
  a.idx.forEach((ci) => by[cards[ci].kind].push(ci));
  const w = by.work.length, p = by.pull.length,
        n = by.note.length, qn = by.quote.length;
  const total = a.idx.length;
  const hit = a.where.map(([t]) => t);
  /* speak every word that landed, in query order — "answers to jack"
     read as a typo when both jack and white had matched */
  const key = hit.join(" ") || query.trim().toLowerCase();
  /* titles repeat across the portfolio (two Hill Country homes, two
     Fairviews), so names are DISTINCT titles, and "more than once"
     is what repetition honestly is */
  const titles = [...new Set(by.work.map((ci) => cards[ci].title))];
  const allWorks = cards.filter((c) => c.kind === "work").length;

  const bits = a.where.map(([t, f]) => "\u201c" + t + "\u201d in " + f.join(", "));
  if (a.dead.length) bits.push("nothing for \u201c" + a.dead.join("\u201d, \u201c") + "\u201d");
  if (a.skipped.length) bits.push("set aside: " + [...new Set(a.skipped)].join(", "));
  bits.push(total + (total === 1 ? " piece" : " pieces"));
  const receipt = bits.join("  \u00b7  ");

  let say;
  if (!total) {
    say = "Nothing in the house answers to that yet. Try a material, a room, or a discipline.";
  } else if (w >= allWorks) {
    say = "All " + w + " projects, in the order I'd walk you through them.";
  } else if (hit.some((t) => t.startsWith("inspir"))) {
    say = (typeof FACTS !== "undefined" && FACTS && FACTS.voice && FACTS.voice.set.board) ||
      "These are things I love and inspired by.";
  } else if (w && p) {
    /* when the query IS a project's name, "I've used west texas in
       West Texas" is what the template says. Say the obvious thing
       instead. */
    const isName = titles.length === 1 && titles[0].toLowerCase() === key;
    const lead = isName
      ? "That's " + titles[0] + "."
      : titles.length === 1
        ? (w === 1 ? "I've used " + key + " in " + titles[0] + "."
                   : "I've used " + key + " in " + titles[0] + " more than once.")
        : titles.length === 2
          ? "I've used " + key + " in " + titles[0] + " and " + titles[1] + "."
          : "I've used " + key + " in " + num(w) + " projects, " + titles[0] + " among them.";
    say = lead + " A couple below are saved as inspiration.";
  } else if (w) {
    say = titles.length === 1
      ? (w === 1 ? "That's " + titles[0] + ". It's below."
                 : titles[0] + " answers that more than once. It's below.")
      : titles.length === 2
        ? "That's " + titles[0] + " and " + titles[1] + ". Both below."
        : cap(num(w)) + " projects answer to that. They're below.";
  } else if (p) {
    say = "Haven't worked " + key + " into a project yet, but " +
      (p === 1 ? "1 inspiration example is below." : num(p) + " below are saved as inspiration.");
  } else {
    say = "That's a practice question. The notes below have it.";
  }
  /* not on the everything answer, where the notes riding along is
     the expected furniture rather than news */
  if (n && w && w < allWorks) say += " It's in the practice notes, too.";
  if (qn && total > qn) say += " A line I've kept rides along.";
  if (a.dead.length && total) {
    say += " Nothing answered to \u201c" + a.dead.join("\u201d, \u201c") + "\u201d.";
  }
  return { say, receipt };
}

function buildAnswer() {
  cancelAsk();
  const rnd = mkRnd(seedNo + 97);
  const rowsEl = document.getElementById("ansRows");
  const notesEl = document.getElementById("ansNotes");
  const sayEl = document.getElementById("ansSay");
  const still = REDUCE();

  /* captured by apply() before the jump home; empty when asked cold */
  const seats = window.__seatRects || new Map();
  window.__seatRects = null;

  /* the plan first: intents, then facts. The matcher answers whatever
     the index has no opinion about. Whichever speaks, the split is
     the same: pictures go to the rows, words go to the notes column. */
  const plan = think(query);
  let say, receipt, mailto = false;
  let leftIdx = [], rightIdx = [];
  const textIdx = [];
  const route = (ci, into) =>
    (cards[ci].kind === "note" || cards[ci].kind === "quote"
      ? textIdx : into).push(ci);
  if (plan) {
    say = plan.say; receipt = plan.receipt; mailto = plan.mailto;
    plan.workIdx.forEach((ci) => route(ci, leftIdx));
    rightIdx = plan.pullIdx.slice();
  } else {
    const a = analyse(query) ||
      { idx: [], where: [], dead: [], skipped: [], held: 0, exact: 0 };
    /* works lead, then the board, then the practice: reading order */
    const ORDER = { work: 0, pull: 1, note: 2, quote: 3 };
    [...a.idx].sort((x, y) => ORDER[cards[x].kind] - ORDER[cards[y].kind])
      .forEach((ci) => route(ci, leftIdx));
    const spoken = composeAnswer(a);
    say = spoken.say; receipt = spoken.receipt;
    if (!leftIdx.length && !textIdx.length && query.trim()) {
      /* The neon answer, from the calibration: an honest miss, then a
         hand of the work that might be comparable. "Might" is doing
         real work in that sentence. No similarity is computed and
         none is claimed; the hedge is what keeps the offer honest.
         The hand is seeded by the question, so the same miss always
         deals the same six. */
      const workAll = cards.map((c, i) => i).filter((i) => cards[i].kind === "work");
      const r2 = mkRnd(4000 + vary(fold(query), 9973));
      const hand = [...workAll].sort(() => r2() - 0.5).slice(0, 6).sort((x, y) => x - y);
      hand.forEach((ci) => leftIdx.push(ci));
      const setLines = (FACTS && FACTS.voice && FACTS.voice.set) || {};
      say = setLines.miss ||
        "That's one I haven't worked into a project or saved as inspiration. Have a look at the work that might be comparable.";
      receipt = "nothing on file for “" + fold(query) + "”  ·  a comparable hand of " +
        hand.length + "  ·  house voice v" + VOICE_VERSION;
    }
  }

  /* THE RING'S OWN ROWS. While both registers hold cards, a row is
     work on the left and a pull on the right — the built and the
     kept, side by side and never mixed. Whatever remains pairs with
     its own kind, and an odd tail rides alone with air beside it,
     which is the uneven pair's move. */
  const L = leftIdx.slice(), R = rightIdx.slice();
  const pairs = [];
  while (L.length && R.length) pairs.push([L.shift(), R.shift()]);
  const rest = L.length ? L : R;
  while (rest.length) pairs.push([rest.shift(), rest.shift()]);

  const shares = dealShares(pairs.length * 2, rnd);
  rowsEl.innerHTML = "";
  const els = [];
  pairs.forEach(([a, b], r) => {
    const row = document.createElement("div");
    row.className = "ixrow";
    /* the notes float over the first column, so it is left empty */
    row.appendChild(document.createElement("div"));
    [a, b].forEach((ci, k) => {
      const cell = document.createElement("div");
      cell.className = "cell";
      if (ci !== undefined) {
        const el = imgCard(cards[ci], rnd, false);
        el.style.setProperty("--share", String(shares[r * 2 + k]));
        /* the cascade: every row's curtains follow the row above, and
           the right frame follows the left — the ring's own lag
           grammar, timed to the arrival stagger below */
        el.style.setProperty("--lag",
          (r * 0.11 + (k ? 0.25 : 0)).toFixed(2) + "s");
        cell.appendChild(el);
        els.push(el);
      }
      row.appendChild(cell);
    });
    const rule = document.createElement("div");
    rule.className = "ixrule";
    rule.style.marginLeft =
      "calc((100% - var(--ixgap)) / 2 * " + (1 - shares[r * 2]).toFixed(3) + ")";
    row.appendChild(rule);
    rowsEl.appendChild(row);
  });
  armRows(rowsEl);

  /* The working notes: whatever text the answer carries — practice
     notes, a kept line — and then the receipt, which was a grey
     stripe under the headline and is now a note like the others. The
     column is the same one the resting page keeps its notes in; an
     answer simply writes different notes on it. */
  notesEl.innerHTML = "";
  notesEl.classList.remove("on");
  textIdx.forEach((ci) => {
    const blk = document.createElement("div");
    blk.className = "blk";
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = cards[ci].kind === "quote" ? "A line I keep" : (cards[ci].word || "");
    blk.appendChild(tag);
    blk.appendChild(document.createTextNode(cards[ci].full || ""));
    if (cards[ci].att) {
      const att = document.createElement("span");
      att.style.cssText = "display:block;padding-top:8px;opacity:0.55";
      att.textContent = cards[ci].att;
      blk.appendChild(att);
    }
    blk.dataset.key = "note:" + (cards[ci].word || "");
    notesEl.appendChild(blk);
  });
  const wk = document.createElement("div");
  wk.className = "blk working";
  const wtag = document.createElement("span");
  wtag.className = "tag";
  wtag.textContent = "The working";
  wk.appendChild(wtag);
  wk.appendChild(document.createTextNode(receipt));
  notesEl.appendChild(wk);

  armReels();
  if (window.armDrift) armDrift(els);

  /* the address becomes a live link once the line is done being
     typed: textContent while the clock runs, one anchor after */
  const linkMail = () => {
    if (!mailto) return;
    sayEl.innerHTML = sayEl.textContent.replace("hello@reckon.house",
      '<a href="mailto:hello@reckon.house">hello@reckon.house</a>');
  };

  if (still) {
    sayEl.classList.remove("typing");
    sayEl.textContent = say;
    linkMail();
    notesEl.classList.add("on");
    els.forEach((el) => el.classList.add("fd-on"));
    return;
  }

  /* stage every card: seated cards travel, the rest rise */
  els.forEach((el) => {
    el.classList.add("fd-on");
    const to = el.getBoundingClientRect();
    const from = seats.get(el.dataset.key);
    el.style.transition = "none";
    el.style.opacity = "0";
    el.style.transform = from
      ? "translate(" + (from.left - to.left).toFixed(1) + "px," +
        (from.top - to.top).toFixed(1) + "px)"
      : "translateY(34px)";
  });

  document.body.classList.add("working");
  sayEl.textContent = "";
  sayEl.classList.add("typing");

  /* the answer types itself. One clock for the whole line, so a short
     answer lands unhurried and a long one does not dawdle. */
  const step = Math.max(9, Math.min(26, Math.round(2100 / Math.max(1, say.length))));
  let i = 0;
  const typeOn = () => {
    i += 1;
    sayEl.textContent = say.slice(0, i);
    if (i < say.length) holdAsk(typeOn, step);
    else {
      sayEl.classList.remove("typing");
      linkMail();
      notesEl.classList.add("on");
      holdAsk(() => document.body.classList.remove("working"), 200);
    }
  };
  holdAsk(typeOn, 180);

  /* the cards do not wait for the sentence: they arrive while it is
     being said. Two frames to a row, so the stagger is the row
     cascade the curtains are lagged to. */
  const STAG = 55;
  els.forEach((el, k) => {
    const at = 300 + k * STAG;
    holdAsk(() => {
      el.style.transition =
        "opacity 0.46s ease, transform 0.52s cubic-bezier(0.2, 0.7, 0.2, 1)";
      el.getBoundingClientRect();
      el.style.opacity = "1";
      el.style.transform = "";
    }, at);
    holdAsk(() => {
      el.style.transition = ""; el.style.opacity = ""; el.style.transform = "";
    }, at + 640);
  });
}

/* The deal is still here — ?deal=7 reshuffles the work order and the
   board's hand, and the seed still rides in the URL so a composition
   can be sent to someone. What is gone is the button: a numbered deal
   counter is a thing the builder understands and a visitor does not. */

/* ── state ──
   Asking is COMMITTED now, not live-filtered: enter, a vocabulary
   word, or a pause in typing fires the act once. A chatbot you are
   still typing at does not start answering; neither does this. While
   the pause timer runs the field already wears the working scan, so
   the house is visibly listening before it speaks. */
let qTimer = 0;
let asked = false;
function onQuery(v, now) {
  query = v;
  clearTimeout(qTimer);
  if (now) { apply(); return; }
  if (!query.trim()) { apply(); return; }   /* clearing is instant, no theatre */
  document.body.classList.add("working");
  qTimer = setTimeout(apply, 420);
}
function apply() {
  syncUrl();
  const next = Boolean(query.trim());
  const changed = next !== asked;
  if (!next) cancelAsk();
  /* Seats are read from the page AS THE VISITOR LEFT IT — before the
     asked class hides the strata (display:none zeroes every rect) and
     before the jump home moves them. Order is the whole trick here:
     capture, then change the world. */
  window.__seatRects = new Map();
  if (next && !REDUCE()) {
    document.querySelectorAll(".stratum [data-key]").forEach((el) => {
      const r = el.getBoundingClientRect();
      if (r.bottom > 0 && r.top < innerHeight) {
        __seatRects.set(el.dataset.key, r);
      }
    });
  }
  document.body.classList.toggle("asked", next);
  if (changed && window.settleAsk) settleAsk();
  if (next) {
    if (scrollY > 4) scrollTo({ top: 0, behavior: "auto" });
    buildAnswer();
  }
  asked = next;
}
function syncUrl() {
  const p = new URLSearchParams();
  if (query.trim()) p.set("q", query.trim());
  if (seedNo !== 5) p.set("deal", String(seedNo));
  const s = p.toString();
  history.replaceState(null, "", s ? "?" + s : location.pathname);
}

const nav = document.getElementById("nav");
const input = document.getElementById("query");
input.addEventListener("input", (e) => {
  onQuery(e.target.value);
  if (window.placeAsk) placeAsk();   /* typing at display size refits */
});
/* Focus completes the word before handing the line over: the typing
   stops wherever it happens to be, and a half-typed question sitting
   greyed under a cursor reads as a mistake rather than an invitation. */
input.addEventListener("focus", () => {
  if (tourFull && !input.value) {
    input.placeholder = tourFull;
    if (window.placeAsk) placeAsk();
  }
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { input.value = ""; onQuery("", true); input.blur(); }
  if (e.key === "Enter") { e.preventDefault(); onQuery(input.value, true); input.blur(); }
});
document.getElementById("clearQ").addEventListener("click", () => {
  input.value = ""; onQuery("", true); input.focus();
});
document.getElementById("resetQ").addEventListener("click", () => {
  input.value = ""; onQuery("", true);
});

/* ── the burn, lifted from Masthead.tsx ────────────────────────────
   Three stages: climb hard while the page moves, hold with a slow
   bleed for two seconds after it stops, then fade out properly. The
   middle stage is what stops it flickering on and off during short
   bursts. These constants are the module's — tune them there. */
(() => {
  const burn = document.getElementById("navBurn");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)");
  let heat = 0, lastScroll = 0;
  const onInput = () => { lastScroll = Date.now(); };
  addEventListener("scroll", onInput, { passive: true });
  addEventListener("wheel", onInput, { passive: true });
  addEventListener("touchmove", onInput, { passive: true });
  const tick = () => {
    requestAnimationFrame(tick);
    if (document.hidden) return;
    if (reduced.matches) { heat = 0; return; }
    const since = Date.now() - lastScroll;
    if (since < 500) heat += (1 - heat) * 0.06;
    else if (since < 2500) heat += (0 - heat) * 0.015;
    else heat += (0 - heat) * 0.03;
    if (heat < 0.005) heat = 0;
    const css = "blur(" + heat * 4 + "px) saturate(" + (1 + heat * 7) +
      ") contrast(" + (1 + heat * 2) + ")";
    burn.style.backdropFilter = "url(#mastheadMelt) " + css;
    burn.style.setProperty("-webkit-backdrop-filter", css);
    burn.style.background = "rgba(243, 240, 237, " + (0.05 + heat * 0.1) + ")";
  };
  requestAnimationFrame(tick);
})();

/* ── the reversal, lifted too ──────────────────────────────────────
   Ink is invisible on dark ground. Rather than sampling pixels, dark
   blocks declare themselves with [data-nav-dark] and this asks whether
   any of them currently overlaps the bar's BAND — not its box, because
   the pill is inset and using the box flips the type a few pixels
   early. The homepage feed declares none yet; see the note in TODO. */
(() => {
  const bar = document.getElementById("nav");
  let raf = 0, was = null;
  const check = () => {
    const b = bar.getBoundingClientRect();
    const top = b.top + 6, bot = b.bottom - 6;
    let hit = false;
    for (const el of document.querySelectorAll("[data-nav-dark]")) {
      const r = el.getBoundingClientRect();
      if (r.height < 2) continue;
      if (r.top < bot && r.bottom > top) { hit = true; break; }
    }
    if (hit !== was) { was = hit; bar.classList.toggle("rev", hit); }
  };
  const onScroll = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(check); };
  check();
  addEventListener("scroll", onScroll, { passive: true });
  addEventListener("resize", onScroll, { passive: true });
})();

/* ── the tour ──────────────────────────────────────────────────────
   One field, one placeholder. It TYPES the question in, holds it, then
   takes it back out again — a fade said "here are some words"; typing
   says someone is asking. Same string at display size and in the bar;
   the field just happens to be a different size by then.

   The size is fitted to the WHOLE word, not to what has been typed so
   far. Fitting the visible fragment would resize the type on every
   character and the line would wobble the entire way in — so the
   driver publishes the target and placeAsk measures that instead.

   No quote marks. They framed the word as something being ASKED, and
   the typing now says that better — and their closing mark sat hard
   against the last character, so it jittered along with every
   keystroke. The word is simply the headline.

   Work, Info and Staples ride in it because they are queries now, not
   destinations. The chips that used to spell them out are gone: a row
   of links under a field that answers questions was hedging. */
const TOUR = ["All work", "Interior projects", "App development",
  "Kitchen design", "What inspires you?", "Marble surfaces", "How do I reach you?"];
const TYPE_IN = 52, TYPE_OUT = 26, TYPE_HOLD = 1700, TYPE_GAP = 340;
let tourFull = "";                     /* what placeAsk should size to */
(() => {
  if (REDUCE()) { input.placeholder = TOUR[0]; return; }
  let k = 0, i = 0, mode = "in", timer = 0;
  const show = (n) => {
    input.placeholder = TOUR[k].slice(0, n);
    if (window.placeAsk) placeAsk();
  };
  const step = () => {
    /* never type over someone who is using the field */
    if (document.activeElement === input || input.value || document.hidden) {
      timer = setTimeout(step, 500);
      return;
    }
    const word = TOUR[k];
    tourFull = word;
    if (mode === "in") {
      i += 1;
      show(i);
      if (i >= word.length) { mode = "hold"; timer = setTimeout(step, TYPE_HOLD); }
      else timer = setTimeout(step, TYPE_IN);
      return;
    }
    if (mode === "hold") { mode = "out"; timer = setTimeout(step, TYPE_OUT); return; }
    i -= 1;
    show(Math.max(0, i));
    if (i <= 0) {
      mode = "in";
      k = (k + 1) % TOUR.length;
      tourFull = TOUR[k];
      timer = setTimeout(step, TYPE_GAP);
    } else timer = setTimeout(step, TYPE_OUT);
  };
  tourFull = TOUR[0];
  timer = setTimeout(step, 600);
})();
/* ── the travel ───────────────────────────────────────────────────
   Everything the field does between the cover and the bar is here.
   Drop is measured, never authored: the distance from the reserved
   slot's centre to the bar's centre, floored at zero. So the field
   rides with the document while the slot is on screen and parks the
   instant the slot arrives — the same behaviour a sticky element
   would have, except this one also changes size on the way.

   The shrink runs over the last SHRINK pixels of that approach, and
   the narrow width is read off the wordmark rather than guessed, so
   the field can never grow into it at any viewport. */
(() => {
  const bar = document.getElementById("nav");
  const ask = document.querySelector(".ask");
  const slot = document.getElementById("askSlot");
  const mark = document.querySelector("#nav .mark");
  const SMALL = 16;
  let raf = 0, settleT = 0;

  const gutter = () => parseFloat(getComputedStyle(bar).paddingLeft) || 40;

  /* ── how big is big ──────────────────────────────────────────────
     Not a constant. The rotation runs from "marble" to "does this
     company do master bedrooms?", and an input does not wrap — at one
     fixed display size the long one would simply be cut off. So the
     question is set to fit its column: measure the string once at
     100px in the same face, then take whatever size fills the width,
     capped so short words cannot grow absurd. Short questions come in
     huge, long ones come in smaller, which is what a typesetter would
     have done anyway. */
  const ghost = document.createElement("span");
  ghost.setAttribute("aria-hidden", "true");
  ghost.style.cssText = "position:absolute;left:-9999px;top:0;visibility:hidden;" +
    "white-space:pre;font-family:inherit;font-weight:700;letter-spacing:-0.045em;" +
    "font-size:100px";
  document.body.appendChild(ghost);
  const fitSize = (text, room) => {
    const cap = Math.max(32, Math.min(88, innerWidth * 0.056));
    ghost.textContent = text || "";
    const per = ghost.getBoundingClientRect().width / 100;
    if (!per || !room) return cap;
    /* a hair under the column: fitting it exactly leaves the last
       glyph riding the edge, and a subpixel there reads as a clip */
    return Math.max(19, Math.min(cap, (room * 0.985) / per));
  };

  const place = () => {
    const barH = bar.getBoundingClientRect().height;
    /* no slot means the cover is gone (an answer is open): park it */
    const live = slot.offsetHeight > 0;
    const s = slot.getBoundingClientRect();
    const drop = live ? Math.max(0, s.top + s.height / 2 - barH / 2) : 0;
    /* The travel's full length, measured rather than authored: the
       slot's centre in DOCUMENT space, which does not move when the
       page does. Progress is drop over that, so the field is exactly
       full size at the top and exactly parked when the slot arrives —
       true at any viewport height, and it stays true if the cover
       above it ever grows a line. */
    const total = live
      ? Math.max(1, s.top + scrollY + s.height / 2 - barH / 2) : 1;
    const p = Math.min(1, drop / total);           /* 1 big, 0 parked */
    const g = gutter();
    const narrow = Math.max(150, mark.getBoundingClientRect().left - g - 26);
    /* the left column IS the slot, so the big field's width is measured
       from the layout rather than computed from the viewport */
    const wide = live ? s.width : narrow;
    /* the WHOLE word while the tour types, so the type does not
       resize on every character */
    const big = fitSize(input.value || tourFull || input.placeholder, wide);
    /* The masthead keeps a tighter gutter than the page does (16 against
       20 on a phone; they are both 40 on a desktop, where this is a
       no-op). So the question rides the PAGE's gutter while it is in
       the page and the BAR's once it lands, walking the few pixels
       between them over the travel rather than sitting wrong at one
       end. Read off the slot, so it cannot disagree with the cards. */
    ask.style.setProperty("--ask-left",
      (g + ((live ? s.left : g) - g) * p).toFixed(1) + "px");
    ask.style.setProperty("--ask-drop", drop.toFixed(1) + "px");
    ask.style.setProperty("--ask-w", (narrow + (wide - narrow) * p).toFixed(1) + "px");
    ask.style.setProperty("--ask-fs", (SMALL + (big - SMALL) * p).toFixed(2) + "px");
    /* display type wants negative tracking, the bar wants the module's
       positive 0.04em — walk between them rather than picking one */
    ask.style.setProperty("--ask-ls", (0.04 - 0.085 * p).toFixed(4) + "em");
    ask.style.setProperty("--ask-fw", p > 0.35 ? "700" : "500");
    ask.classList.toggle("big", p > 0.35);
    document.body.classList.toggle("attop", p > 0.96);
  };

  /* the one time the move is not scroll-driven: opening or closing an
     answer pulls the cover out from under it, so let it glide */
  window.settleAsk = () => {
    ask.classList.add("settling");
    clearTimeout(settleT);
    settleT = setTimeout(() => ask.classList.remove("settling"), 520);
    requestAnimationFrame(place);
  };

  const on = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(place); };
  addEventListener("scroll", on, { passive: true });
  addEventListener("resize", on, { passive: true });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(place);
  /* exposed so the travel can be stepped and measured without waiting
     on rAF — the geometry here is worth being able to assert on */
  window.placeAsk = place;
  place();
})();

/* ── the page transition ──────────────────────────────────────────
   The driver only sequences; every duration is in the stylesheet, so
   the two cannot drift apart. Each beat waits for its own transition
   to actually END rather than for a matching setTimeout — a timer that
   agrees with a CSS duration today is a timer that disagrees with it
   after the next tuning pass.

   In a real app the sequence SPLITS: beats 1 and 2 belong to the page
   being left, the document swap happens at full black, and beat 3
   belongs to the page arriving. Here it plays whole, so the
   choreography can be judged in one go. */
const PT = document.getElementById("pt");
/* how far apart the lines arrive. Fast enough to read as one sweep
   down the page rather than a list being typed out. */
const PT_STEP = 0.03;
/* the exit runs tighter than the entry: arriving is the flourish,
   leaving should not hold the page up */
const PT_STEP_OUT = 0.02;
let ptLines = 0;

function ptBeat(cls, el) {
  return new Promise((res) => {
    let done = false;
    /* transitionend BUBBLES. Every line inside the panel finishes its
       own transition and the event arrives here, so without this the
       first line to land ends the beat — the sequence collapsed to
       about a third of its length. Only the panel's own transition
       counts. */
    const end = (e) => { if (done || (e && e.target !== el)) return; done = true;
      el.removeEventListener("transitionend", end); res(); };
    el.addEventListener("transitionend", end);
    PT.classList.add(cls);
    /* a floor, in case the transition never fires (tab hidden, etc) */
    setTimeout(end, 1400);
  });
}

async function playTransition(href, title, sub) {
  if (PT.dataset.busy) return;
  PT.dataset.busy = "1";
  /* What is loading, repeated until it fills the page. The count is
     measured, not fixed: a line is whatever the type actually renders
     at, so the stack fills a phone and a display alike. */
  const stacks = ["ptwT", "ptbT"].map((id) => document.getElementById(id));
  stacks.forEach((el) => { el.innerHTML = ""; });
  const probe = document.createElement("span");
  probe.className = "ptl";
  probe.style.cssText = "position:absolute;visibility:hidden;opacity:1";
  probe.textContent = title || "—";
  stacks[0].appendChild(probe);
  const lineH = probe.getBoundingClientRect().height || 44;
  probe.remove();
  /* fill the inset box exactly: round to a whole number of lines, then
     hand back the line-height that makes them add up to it */
  const gut = parseFloat(getComputedStyle(document.documentElement)
    .getPropertyValue("--gut")) || 40;
  const avail = innerHeight - gut * 2;
  const N = Math.max(3, Math.round(avail / lineH));
  stacks.forEach((el) => el.style.setProperty("--ptlh",
    (avail / N).toFixed(2) + "px"));
  ptLines = N;
  for (let i = 0; i < N; i++) {
    stacks.forEach((el) => {
      const line = document.createElement("span");
      line.className = "ptl";
      line.style.setProperty("--d", (i * PT_STEP).toFixed(3) + "s");
      line.textContent = title || "";
      if (sub) {
        const t = document.createElement("span");
        t.className = "sub";
        t.textContent = "  " + sub;
        line.appendChild(t);
      }
      el.appendChild(line);
    });
  }
  const white = PT.querySelector(".ptw");
  const black = PT.querySelector(".ptb");
  PT.classList.add("pt-run");
  /* Commit the lines' start state before the class that animates them.
     Built and revealed in the same task, they have never been rendered
     hidden, so there is nothing to transition FROM and all 22 arrive
     at once — the stagger silently does nothing. Reading a layout
     property forces the frame. */
  void PT.offsetHeight;
  await ptBeat("pt-1", white);          /* white falls */
  await ptBeat("pt-2", black);          /* black rises over it */
  /* ── in the app, the document swap goes HERE, under full black ── */
  /* reverse every line's delay before the last beat: they leave from
     the bottom, which is the direction the lifting clip already
     removes them in */
  /* per stack, not across both: querySelectorAll returns document
     order, which is all of the white panel's lines and THEN all of the
     black's — indexing across the pair would give each panel a
     different sequence and break their registration */
  PT.querySelectorAll(".ptstack").forEach((stack) => {
    [...stack.children].forEach((line, i) => {
      line.style.setProperty("--d",
        ((ptLines - 1 - i) * PT_STEP_OUT).toFixed(3) + "s");
    });
  });
  /* Beat 3 is over when BOTH the curtain and the last line are done.
     Waiting only on the curtain reset the overlay at 0.68s while lines
     were still leaving, and hiding the panel cut the stagger off
     mid-flight. */
  const outMs = ((ptLines - 1) * PT_STEP_OUT + 0.26) * 1000;
  await Promise.all([
    ptBeat("pt-3", black),              /* black lifts from the bottom */
    new Promise((r) => setTimeout(r, outMs)),
  ]);
  PT.className = "pt";
  delete PT.dataset.busy;
  if (href) location.href = href;
}

/* Clicks on the work run the sequence. Modified clicks are left alone —
   a new tab should not be preceded by a curtain on the old one. */
document.addEventListener("click", (e) => {
  const a = e.target.closest && e.target.closest(".ixrow a.fd-it");
  if (!a || REDUCE()) return;
  if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
  e.preventDefault();
  /* the destination names itself: taken off the card here, and off
     the route's own data in an app — same fact either way */
  const lbl = a.querySelector(".lbl");
  const sub = lbl && lbl.querySelector(".sub");
  const title = lbl
    ? lbl.firstChild.textContent.trim() : a.getAttribute("aria-label") || "";
  /* the lab has nowhere to go, so it plays the whole sequence and
     stays; pass a.getAttribute("href") to make it navigate */
  playTransition(null, title, sub ? sub.textContent.trim() : "");
});

/* ── hover: the drop and the push ─────────────────────────────────
   Two numbers the stylesheet cannot know. How far the label must slide
   is how far its frame grew, which depends on that frame's dealt
   height; and whether the neighbour needs to move at all depends on
   whether the opening frame actually reaches it — a narrow frame never
   does. Both are measured at the moment of hover, from resting sizes
   (offsetHeight/Width ignore the transform, so they report the frame's
   real size rather than its mid-animation one).

   Delegated on the container, which survives a redeal; the rows
   inside it do not. */
function armRows(rowsEl) {
  if (rowsEl.dataset.armed) return;
  rowsEl.dataset.armed = "1";
  const GAP = 24;
  const live = () => innerWidth > 760 && matchMedia("(hover: hover)").matches;

  rowsEl.addEventListener("pointerover", (e) => {
    const card = e.target.closest && e.target.closest(".fd-it");
    if (!card || !live()) return;
    const row = card.closest(".ixrow");
    const shot = card.querySelector(".shot");
    if (!row || !shot) return;
    let grow =
      parseFloat(getComputedStyle(row).getPropertyValue("--ix-grow-max")) || 1.32;
    /* EACH FRAME OPENS AS FAR AS ITS OWN ROOM ALLOWS. Capping the
       label's drop instead was wrong: the frame kept growing past
       where the label had stopped, so the picture covered its own
       name. The grow itself has to be the thing that yields.

       The taller frame in a row always has exactly the row-gap beneath
       its label (79px), so at a fixed 1.32 a 457px frame needed 146px
       and took it out of the label. Now the grow is per-frame: small
       frames open wide, large ones open a little, and the label always
       has somewhere to go. The biggest pictures moving least is the
       honest outcome — they are already the loudest thing in the row. */
    const rule = row.querySelector(".ixrule");
    const ruled = rule && getComputedStyle(rule).display !== "none";
    const room = ruled
      ? rule.getBoundingClientRect().top -
        card.querySelector(".lbl").getBoundingClientRect().bottom - 8
      : Infinity;
    const fits = 1 + Math.max(0, room) / shot.offsetHeight;
    grow = Math.max(1.04, Math.min(grow, fits));
    card.style.setProperty("--ix-grow", grow.toFixed(3));
    card.style.setProperty("--drop",
      (shot.offsetHeight * (grow - 1)).toFixed(1) + "px");

    /* How far the name is from the right edge. Measured with a Range
       over the label's own contents, because the element is a full-
       width block and its rect would say zero — the Range reports the
       INK, which on a wrapped label is its widest line. */
    const lbl = card.querySelector(".lbl");
    const range = document.createRange();
    range.selectNodeContents(lbl);
    const ink = range.getBoundingClientRect().width;
    const slide = Math.max(0, lbl.getBoundingClientRect().width - ink);
    card.style.setProperty("--slide", slide.toFixed(1) + "px");
    /* and anything to its left moves only as far as it must */
    const hr = shot.getBoundingClientRect();
    const openTo = hr.right - hr.width * grow;
    [...row.querySelectorAll(".fd-it")].forEach((other) => {
      if (other === card) return;
      const or = other.querySelector(".shot").getBoundingClientRect();
      if (or.right > hr.left + 1) return;          /* not to the left */
      const push = Math.max(0, or.right + GAP - openTo);
      other.style.transform = push
        ? "translateX(" + (-push).toFixed(1) + "px)" : "";
    });
  });

  rowsEl.addEventListener("pointerout", (e) => {
    const card = e.target.closest && e.target.closest(".fd-it");
    if (!card) return;
    if (e.relatedTarget && card.contains(e.relatedTarget)) return;
    const row = card.closest(".ixrow");
    if (row) {
      row.querySelectorAll(".fd-it").forEach((c) => { c.style.transform = ""; });
    }
    card.style.removeProperty("--drop");
    card.style.removeProperty("--slide");
    card.style.removeProperty("--ix-grow");
  });
}

/* The neighbour-shift driver went with the rails. It existed because
   a hovered frame in a tight 5px stack had to push its column apart to
   have anywhere to open into. Rows are ruled off with ~90px of air
   between them, so a frame at 1.32 opens into space that is already
   there — and shifting a NEIGHBOURING ROW would drag its rule with it,
   which is the one line on the page that must not move. The grow is
   smaller here for the same reason: 1.5 was sized to a stack that
   parted for it. */

/* ── the drift ─────────────────────────────────────────────────────
   The one piece of motion in the feed, and it is the house's own: the
   case studies already hold content and move it at a fraction of the
   page's speed, so a photograph sliding inside its frame is the same
   idea at a smaller scale rather than a new trick.

   Every image is cut taller than the frame that clips it. As a card
   crosses the viewport its image walks from one end of that slack to
   the other, centred at mid-screen, so nothing is ever revealed as an
   edge. It costs no layout — one transform per visible image — and
   only visible images are touched at all.

   The bigger tiles drift further, which is the second half of what
   makes them read as bigger: more depth AND more movement. How much
   further is set in CSS, beside the tile sizes themselves.

   Under reduced motion this never runs, and because the slack is in
   the image's height rather than its position, a still frame is still
   a correctly filled card. */
(() => {
  if (REDUCE()) return;
  const live = new Set();
  const io = new IntersectionObserver((es) => {
    es.forEach((e) => {
      if (e.isIntersecting) { live.add(e.target); return; }
      live.delete(e.target);
      const img = e.target.querySelector("img");
      if (img) img.style.transform = "";
    });
  }, { rootMargin: "12% 0px" });

  window.armDrift = (els) => els.forEach((el) => {
    const shot = el.querySelector && el.querySelector(".shot");
    if (shot) io.observe(shot);
  });

  const tick = () => {
    requestAnimationFrame(tick);
    if (document.hidden || !live.size) return;
    const h = innerHeight;
    live.forEach((shot) => {
      const img = shot.querySelector("img");
      if (!img || img.tagName !== "IMG") return;
      const r = shot.getBoundingClientRect();
      /* 0 as the card enters from the bottom, 1 as it leaves the top */
      const p = Math.min(1, Math.max(0, (h - r.top) / (h + r.height)));
      /* The slack is MEASURED, not assumed. It is set in CSS beside the
         tile sizes (--drift), and reading it back means the two can
         never disagree — a renamed class or a new tile size needs no
         change here. Both rects come from one layout pass, so this
         costs nothing extra. */
      /* offsetHeight, not the rect: the plate is mid-settle at 1.25
         while a card arrives, and a rect would report the scaled size
         and drift the picture too far. Layout size ignores transforms. */
      const slack = Math.max(0, img.offsetHeight - shot.offsetHeight);
      /* The image sits top-aligned with no transform, so the whole of
         its travel is NEGATIVE: 0 is top-aligned, -slack is
         bottom-aligned, and every value between covers the frame.
         Swinging symmetrically about the middle instead would push the
         image down past the frame's top edge for half the pass and
         show a sliver of background there. */
      img.style.transform =
        "translate3d(0," + (-p * slack).toFixed(2) + "px,0)";
    });
  };
  requestAnimationFrame(tick);
})();

/* boot */
(() => {
  const p = new URLSearchParams(location.search);
  const q = p.get("q") || "";
  const d = parseInt(p.get("deal") || "5", 10);
  if (Number.isFinite(d)) seedNo = d;
  buildMagazine();
  if (q) { input.value = q; query = q; apply(); }
  let rw = 0;
  addEventListener("resize", () => {
    clearTimeout(rw);
    rw = setTimeout(() => { buildMagazine(); if (query.trim()) buildAnswer(); }, 180);
  });
})();
</script>
